name: Automated Tests

env:
  COVERAGE_MIN_FAST: "16"
  COVERAGE_MIN_FULL: "16"

permissions:
  contents: read
  issues: write

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'intelligent_project_analyzer/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements*.txt'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'intelligent_project_analyzer/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements*.txt'
      - '.github/workflows/tests.yml'
  schedule:
    # 每天UTC 0:00运行
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许手动触发
    inputs:
      run_scope:
        description: "手动触发范围"
        required: true
        default: fast_only
        type: choice
        options:
          - fast_only
          - full_matrix
          - both
      run_flaky:
        description: "是否执行 flaky 隔离测试"
        required: true
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-fast:
    name: Fast Tests (ubuntu, py3.11)
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_scope == 'fast_only' || github.event.inputs.run_scope == 'both'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-crawler.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-asyncio pytest-mock
        pip install -r requirements.txt || true

    - name: Check test environment
      run: |
        python --version
        pytest --version
        python scripts/test_automation.py --check

    - name: Run tests with coverage
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python -m pytest tests/ \
          --cov=intelligent_project_analyzer \
          --cov-report=xml \
          --cov-report=term \
          --cov-fail-under=${COVERAGE_MIN_FAST} \
          -v

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-ubuntu-py3.11-fast
        fail_ci_if_error: false

    - name: Generate coverage report
      run: |
        python scripts/test_automation.py --report

    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v3
      with:
        name: coverage-html-report
        path: htmlcov/

  test-matrix-full:
    name: Full Matrix (${{ matrix.os }}, py${{ matrix.python-version }})
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.run_scope == 'full_matrix' || github.event.inputs.run_scope == 'both'))
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-crawler.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-asyncio pytest-mock
        pip install -r requirements.txt || true

    - name: Check test environment
      run: |
        python --version
        pytest --version
        python scripts/test_automation.py --check

    - name: Run tests with coverage
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        python -m pytest tests/ \
          --cov=intelligent_project_analyzer \
          --cov-report=xml \
          --cov-report=term \
          --cov-fail-under=${COVERAGE_MIN_FULL} \
          -v

  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-crawler.txt

    - name: Install linting tools
      run: |
        pip install ruff

    - name: Lint with Ruff
      run: |
        python -m ruff check intelligent_project_analyzer/api intelligent_project_analyzer/core intelligent_project_analyzer/external_data_system intelligent_project_analyzer/utils intelligent_project_analyzer/services intelligent_project_analyzer/tools tests

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-crawler.txt

    - name: Install security tools
      run: |
        pip install bandit safety

    - name: Run Bandit security scan
      run: |
        bandit -r intelligent_project_analyzer/ -ll -f json -o bandit-report.json || true
        bandit -r intelligent_project_analyzer/ -ll

    - name: Check dependencies for vulnerabilities
      run: |
        pip install -r requirements.txt || true
        safety check --json > safety-report.json || true

    - name: Enforce security baseline
      run: |
        python scripts/ci/enforce_security_baseline.py \
          --bandit bandit-report.json \
          --safety safety-report.json \
          --allowlist config/security/security_allowlist.txt

    - name: Upload security reports
      uses: actions/upload-artifact@v3
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
          security-baseline-report.json

  flaky-isolated:
    name: Flaky Tests (isolated, non-blocking)
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_flaky == 'true')
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-crawler.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio pytest-mock
        pip install -r requirements.txt || true

    - name: Run flaky tests only
      run: |
        python -m pytest tests/ -m flaky -v || code=$?
        if [ "${code:-0}" -eq 5 ]; then
          echo "No flaky-marked tests found; skip."
          exit 0
        fi
        exit ${code:-0}

    - name: Create flaky incident issue
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const title = `[Flaky] Isolated flaky test failure - run #${context.runNumber}`;
          const body = [
            "自动创建：flaky 隔离任务失败",
            "",
            `- Workflow: ${context.workflow}`,
            `- Run URL: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            `- Branch/Ref: ${context.ref}`,
            "",
            "请更新 docs/testing/FLAKY_TESTS.md，并补充 owner 与修复日期。"
          ].join("\n");
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title,
            body,
            labels: ["flaky", "ci-incident", "auto-created"]
          });
