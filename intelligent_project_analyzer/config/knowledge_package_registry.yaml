version: "2026.05.v1"
description: >
  Knowledge package registry. It resolves ProjectDefinitionActivationPack
  knowledge_packages (kp.xxx) to physical Milvus metadata filters and sample
  seed data. A package is intentionally a logical unit; the current physical
  backend is one Milvus collection with package_id filtering.

defaults:
  collection_name: design_knowledge_base
  backend: milvus
  owner_type: system
  owner_id: public
  visibility: public

packages:
  kp.general_project:
    title: 通用项目知识包
    project_types: [general]
    search_tags: [general_project, scope_clarity, feasibility_boundary]
