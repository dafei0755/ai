  🚨 **Phase2 质量检查（v10 三阶段门控）**：

  **Phase A 门控（全量强制）：**
  1. ✅ A1_facts：MECE原子化事实，无遗漏重叠
  2. ✅ A2_stakeholders：至少识别3类利益相关者，分析冲突/协同
  3. ✅ A3_user_model：心理/社会/美学基础三维 + 条件激活扩展视角
  4. ✅ A3_brand_dna：提及品牌时必须深层解码（基因层+审美层+空间转译层）
  5. ✅ A4_constraints：预算/工期/规范/物理/运营全覆盖，含constraint_map_insight

  **Phase B 门控（B3/B5强制，B4条件）：**
  6. ✅ B1_core_tension：核心张力公式化，揭示真实对立
  7. ✅ B2_project_task：JTBD公式完整，雇佣任务≥2项
  8. ✅ B3_five_whys_analysis：必须追问L4情感层/L5身份层
  9. ✅ B4_first_principles（条件激活）：诸需求必须去除所有风格标签和行业惯例
  10. ✅ B5_assumption_audit：至少识别3个假设，每个有反向挑战和应对方案

  **Phase C 门控（C1/C5强制，C2/C3/C4/C6条件）：**
  11. ✅ C1_sharpness.score >= 70 才算合格分析；C1<70需返回Phase B
  12. ✅ C2_razor_check（条件激活）：必须进行奥卡姆剤刀检验
  13. ✅ C3_thought_experiments（条件激活）：必须执行3个以上，每个有设计启示
  14. ✅ C4_systemic_impact（商业必选）：必须覆盖短期/中期/长期三个时间维度
  15. ✅ C5_anti_cliche_check：反套路化自检必须通过，禁用词汇必须替换
  16. ✅ C6_multi_perspective_synthesis（条件激活）：必须包含4个对抗视角，convergent_insight必须出现

  **专家接口门控：**
  17. ✅ design_challenge_spectrum：必须体现核心对立的三种立场
  18. ✅ expert_handoff：每个专家至少 1 个critical_question + 1 个adversarial_question

task_description_template: |
  {datetime_info}

  ### 用户输入:
  "{user_input}"

  ### Phase1 输出（已完成）:
  {phase1_output}

  {deliverable_anchoring}

  {sf_knowledge_injection}

  {uncertainty_guidance}

  ### Phase2 任务（深度分析，60秒内完成）

  Phase1已完成交付物识别和信息定性。请基于Phase1结果，执行深度分析：

  **1. 三阶段A/B/C分析流程（v10架构）**

  **Phase A — 现实画像（全量强制执行）：**
  - A1：事实原子化（MECE解构，输出 A1_facts）
  - A2：利益相关者系统（前置，至少3类，输出 A2_stakeholders）
  - A3：用户深度建模（基础+扩展视角+人性维度，输出 A3_user_model）
  - A3b：品牌DNA深层解码（提及品牌时激活，输出 A3_brand_dna）
  - A4：约束地图（预算/工期/规范/物理/运营，输出 A4_constraints）
  - 门控：A1-A4全部完成且无空字段 → 进入Phase B

  **Phase B — 深度挖掘（B3/B5强制，B4条件激活）：**
  - B1：核心张力识别（公式化对立，输出 B1_core_tension）
  - B2：JTBD任务定义（用户雇佣空间，输出 B2_project_task）
  - B3：五层为什么追问（必须到L4情感层，输出 B3_five_whys_analysis）
  - B4：第一性原理裸需求（条件：B3已达L4+，输出 B4_first_principles）
  - B5：假设审计（至少3个+反向挑战，输出 B5_assumption_audit）
  - 门控：B3≥L4 + B5完成 → 进入Phase C

  **Phase C — 验证与锐化（C1/C5强制，C2/C3/C4/C6条件激活）：**
  - C1：锐度评分（门控≥70，输出 C1_sharpness；C1<70 → 返回Phase B）
  - C2：奥卡姆剃刀（条件激活，输出 C2_razor_check）
  - C3：思想实验（条件激活，执行3个，输出 C3_thought_experiments）
  - C4：系统性影响（商业必选，短/中/长期，输出 C4_systemic_impact）
  - C5：反套路自检（强制，输出 C5_anti_cliche_check）
  - C6：多视角对抗（条件激活，4个视角，输出 C6_multi_perspective_synthesis）

  **2. 人性维度深度分析（贯穿Phase A-B）**
  - emotional_landscape：情绪地图（具体情绪转化路径）
  - spiritual_aspirations：精神追求（穿透功能到精神层）
  - psychological_safety_needs：心理安全需求（依恋理论视角）
  - ritual_behaviors：仪式行为（日常微小仪式的空间容器）
  - memory_anchors：记忆锚点（承载情感记忆的物品/元素）

  **3. 结构化输出**
