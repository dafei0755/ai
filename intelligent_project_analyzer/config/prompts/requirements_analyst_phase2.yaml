# 需求分析师 Phase2 配置 - 深度分析 + 专家接口构建
# v7.17 P1架构拆分：单次LLM → 两阶段LLM
# Phase2 专注：L1-L5深度分析 + 专家接口构建（~1800 tokens）
# 前置条件：Phase1 已完成，info_status = "sufficient"
# 🔧 v7.17.1: 引用 expert_autonomy_protocol v4.1 挑战协议

metadata:
  version: "10.0.0-phase2"
  description: "Phase2 深度分析阶段 - 三阶段架构（A现实画像/B需求挖掘/C验证攻击）+ 组件化激活 + Phase级门控质量标准"
  created_at: "2025-12-17"
  updated_at: "2026-02-21"
  optimization: "接收Phase1输出，专注深度分析，避免重复交付物识别"
  phase: 2
  depends_on: "requirements_analyst_phase1"
  v10_0_0_changes: "重大架构重构：L1-L9平铺列表→三阶段A/B/C分层执行；L1.5迁移到B4（需B3五层追问铺垫）；L4.6迁移到C3（思想实验=验证工具）；L6前移到B5（在挖掘末尾锁定假设边界）；新增A4约束地图；B/C阶段引入组件化激活逻辑；三阶段门控取代平铺质量清单"

# ================================================================================
# 🔗 v4.1 挑战协议引用（与 expert_autonomy_protocol_v4.yaml 协同）
# ================================================================================
challenge_protocol_reference:
  source: "expert_autonomy_protocol_v4.yaml"
  version: "4.1"

  # 挑战类型枚举（专家接口中需要标注）
  challenge_types:
    - resource_conflict      # 资源冲突
    - scope_ambiguity        # 范围模糊
    - stakeholder_conflict   # 利益相关者冲突
    - technical_uncertainty  # 技术不确定性
    - timeline_pressure      # 时间压力
    - quality_tradeoff       # 质量权衡
    - capability_boundary    # 能力边界

  # 在 expert_handoff 中必须包含
  handoff_requirements:
    - "关键问题中应标注潜在挑战类型"
    - "不确定性标记交由专家自主决策"
    - "赋予专家'challenge_protocol'挑战权力"

# 输出质量标准（v10 三阶段门控）
quality_standards:
  # ─── Phase A 门控（完成A才能进入B）───
  phase_a_gate:
    A1_facts_required: true          # 事实原子化必须完成
    A2_stakeholders_min: 3           # 利益相关者至少3类
    A3_user_model_dimensions_min: 3  # 用户模型至少覆盖3个基础维度
    A3_brand_dna_when_triggered: true # 品牌提及时必须完成DNA解码
    A4_constraints_required: true    # 约束地图不能有空字段

  # ─── Phase B 门控（完成B才能进入C）───
  phase_b_gate:
    B3_five_whys_min_level: 4        # 必须追问到L4情感层
    B3_five_whys_ideal_level: 5      # 理想到L5身份层
    B4_first_principles_strips_min: 1 # 至少剥离1层行业惯例/风格标签
    B5_assumptions_min: 3            # 假设审计至少识别3个假设
    B5_each_assumption_has_counter: true # 每个假设必须有反向挑战

  # ─── Phase C 门控（完成C才能构建expert_handoff）───
  phase_c_gate:
    C1_sharpness_min_score: 70       # 锐度≥70才算合格
    C2_razor_always_execute: true    # 奥卡姆剃刀无论结论如何必须执行
    C3_thought_experiments_min: 3    # 思想实验至少3个（含设计启示）
    C4_systemic_impact_time_dims: 3  # 必须覆盖短/中/长期三维
    C5_anti_cliche_passed: true      # 反套路自检必须通过
    C6_perspectives_min: 4           # 多视角合成必须4个视角
    C6_convergent_insight_required: true # convergent_insight必须存在

  # ─── expert_handoff 门控 ───
  handoff_gate:
    each_expert_critical_questions_min: 1
    each_expert_adversarial_question: true
    design_challenge_shows_tension: true

# ================================================================================
# 🆕 v7.19.0: L2.5 利益相关者系统分析框架
# ================================================================================
l2_5_stakeholder_system:
  description: "在L2用户建模和L3杠杆点之间，插入专门的利益相关者分析层"

  # 利益相关者识别矩阵
  stakeholder_identification:
    primary_stakeholders:  # 核心利益相关者（直接影响决策）
      investor_owner:
        role: "投资人/业主"
        focus_dimensions: ["ROI", "资产增值", "风险控制", "品牌价值", "退出策略"]
        typical_concerns: ["回本周期", "运营成本", "市场风险", "政策风险"]
        decision_power: "high"

      end_consumer:
        role: "终端消费者/用户"
        focus_dimensions: ["体验质量", "情感满足", "功能需求", "价格敏感度", "社交价值"]
        typical_concerns: ["是否值得", "体验是否独特", "是否符合身份认同"]
        decision_power: "indirect"

      operator_manager:
        role: "运营者/管理方"
        focus_dimensions: ["运营效率", "维护成本", "人员管理", "合规性", "可持续性"]
        typical_concerns: ["日常运营难度", "员工培训成本", "设备维护", "淡旺季管理"]
        decision_power: "medium"

    secondary_stakeholders:  # 次要利益相关者（间接影响）
      designer_creative:
        role: "设计师/创意团队"
        focus_dimensions: ["设计自由度", "作品价值", "专业认可", "创意表达"]

      supplier_contractor:
        role: "供应商/施工方"
        focus_dimensions: ["利润空间", "工期可行性", "技术难度", "供应链稳定性"]

      community_neighbor:
        role: "社区/邻里"
        focus_dimensions: ["环境影响", "噪音干扰", "社区融合", "公共资源占用"]

      regulator_government:
        role: "监管方/政府"
        focus_dimensions: ["合规性", "社会效益", "示范价值", "税收贡献"]

  # 关注点差异分析维度
  focus_divergence_dimensions:
    - dimension: "时间视角"
      spectrum: "短期回报 ←→ 长期价值"
      typical_conflict: "投资人追求快速回本 vs 设计师追求经典耐久"

    - dimension: "风险偏好"
      spectrum: "保守稳健 ←→ 创新冒险"
      typical_conflict: "运营者偏好成熟方案 vs 业主追求差异化"

    - dimension: "价值排序"
      spectrum: "功能优先 ←→ 体验优先 ←→ 成本优先"
      typical_conflict: "消费者要体验 vs 投资人控成本"

    - dimension: "审美取向"
      spectrum: "大众接受 ←→ 小众精品"
      typical_conflict: "市场部要大众化 vs 设计师要独特性"

    - dimension: "品牌态度"
      spectrum: "强化品牌 ←→ 淡化品牌"
      typical_conflict: "品牌方要强曝光 vs 消费者要沉浸体验"

  # 典型冲突与协同模式
  conflict_synergy_patterns:
    typical_conflicts:
      - conflict_pair: ["投资人", "设计师"]
        tension: "成本控制 vs 设计品质"
        mediation_strategy: "价值工程分析，识别高性价比设计点"

      - conflict_pair: ["运营者", "消费者"]
        tension: "运营效率 vs 体验深度"
        mediation_strategy: "场景分层，区分高频低成本区和低频高体验区"

      - conflict_pair: ["投资人", "社区"]
        tension: "商业价值最大化 vs 社区融合"
        mediation_strategy: "社区共享空间设计，创造双赢"

      - conflict_pair: ["品牌方", "消费者"]
        tension: "品牌曝光 vs 沉浸体验"
        mediation_strategy: "隐性品牌植入，体验即品牌"

    synergy_opportunities:
      - synergy_pair: ["消费者", "品牌"]
        opportunity: "体验即传播，消费者成为品牌大使"

      - synergy_pair: ["运营者", "设计师"]
        opportunity: "可维护性设计，降低长期运营成本"

      - synergy_pair: ["社区", "消费者"]
        opportunity: "在地文化体验，增强真实感和独特性"

  # 权力动态分析
  power_dynamics_analysis:
    questions:
      - "谁有最终决策权？（decision_hierarchy）"
      - "谁能影响决策者？（influence_network）"
      - "谁有否决权？（veto_points）"
      - "是否存在未明确但有影响力的角色？（hidden_stakeholders）"

# ================================================================================
# 🆕 v7.19.0: 品牌DNA深层解码协议
# ================================================================================
brand_dna_decoding_protocol:
  description: "当用户提到品牌名称或风格标签时，强制执行深层解码"

  trigger_keywords:
    - "HAY"
    - "Muji"
    - "无印良品"
    - "IKEA"
    - "宜家"
    - "北欧"
    - "日式"
    - "新中式"
    - "侘寂"
    - "极简"
    - "品牌"
    - "风格"
    - "气质"
    - "调性"
    - "DNA"

  mandatory_analysis_layers:
    # 1. 品牌基因层
    brand_genome:
      origin_story:
        description: "品牌诞生的故事和初心"
        analysis_questions:
          - "品牌为什么存在？解决了什么问题？"
          - "创始人的核心信念是什么？"
          - "品牌的'第一性原理'是什么？"

      design_philosophy:
        description: "品牌的设计哲学和美学主张"
        analysis_dimensions:
          - "形式语言：极简/繁复/有机/几何"
          - "材料态度：天然/工业/混合"
          - "色彩哲学：克制/大胆/自然"
          - "比例原则：黄金比例/人体工学/视觉平衡"

      cultural_roots:
        description: "品牌的文化根基和价值观"
        analysis_dimensions:
          - "地域文化：北欧/日本/意大利/美国/中国"
          - "时代精神：现代主义/后现代/当代"
          - "生活哲学：极简主义/享乐主义/实用主义"
          - "社会立场：可持续/包容/创新/民主"

    # 2. 审美基调层
    aesthetic_tone:
      visual_language:
        color_palette: "品牌核心色、辅助色、点缀色、禁忌色"
        form_vocabulary: "偏好形态、线条质感、比例规则"
        material_signature: "标志性材料、质感偏好、表面处理"

      emotional_register:
        primary_emotion: "品牌传递的核心情绪"
        secondary_emotions: "辅助情绪"
        forbidden_emotions: "品牌禁忌的情绪（如HAY禁忌严肃冷峻）"

    # 3. 空间转译层
    spatial_translation:
      translation_rules:
        description: "品牌语言→空间语言的转译规则"
        format: "brand_element → spatial_expression"

      anti_patterns:
        description: "品牌禁忌的空间表达"
        format: "forbidden_expressions 列表"

  # 品牌解码示例（HAY）
  example_HAY:
    brand_genome:
      origin_story: "2002年丹麦创立，相信好设计应该人人可及（民主设计），反对设计精英主义"
      design_philosophy: "北欧极简+色彩活力，功能与美学的民主化平衡"
      cultural_roots: "斯堪的纳维亚设计传统+当代生活方式，强调日常美学"

    aesthetic_tone:
      color_palette: "柔和中性色为主，明亮色彩点缀，避免深沉暗色"
      form_vocabulary: "圆润边角、轻盈比例、几何但不冷峻"
      material_signature: "木材+金属+织物，哑光为主，触感温润"
      emotional_register: "轻松愉悦（primary）+ 温暖亲切 + 简约宁静，避免严肃冷峻"

    spatial_translation:
      translation_rules:
        - brand_element: "民主设计理念"
          spatial_expression: "开放式布局、无等级空间、可触摸的展示"
        - brand_element: "北欧极简"
          spatial_expression: "留白、自然光、克制的装饰"
        - brand_element: "色彩活力"
          spatial_expression: "中性背景+彩色家具点缀"
        - brand_element: "日常美学"
          spatial_expression: "生活场景化陈列、可使用的展示"

      anti_patterns:
        - "过度装饰、繁复细节"
        - "深色压抑的空间"
        - "高高在上的展示方式"
        - "冷漠的工业感"

# ================================================================================
# 🆕 v7.19.0: 五层为什么追问协议
# ================================================================================
five_whys_protocol:
  description: "强制性深度追问机制，确保洞察穿透表层到达情感/身份层面"

  trigger_conditions:
    - "用户提出功能需求时"
    - "用户描述风格偏好时"
    - "用户表达情感期望时"
    - "用户提及品牌/文化元素时"

  questioning_template:
    level_1_what:
      question: "用户说了什么？（原话提取）"
      output: "用户原话的精确引用"

    level_2_why_surface:
      question: "为什么用户想要这个？（表层原因）"
      output: "直接可见的原因"

    level_3_why_behavior:
      question: "这个需求背后的行为模式是什么？"
      output: "用户希望通过这个需求实现什么行为"

    level_4_why_emotion:
      question: "这个行为背后的情感需求是什么？"
      output: "用户追求什么情感满足？在对抗什么恐惧？"

    level_5_why_identity:
      question: "这个情感需求背后的身份认同是什么？"
      output: "用户希望成为什么样的人？这与TA的自我认同有什么关系？"

  output_requirement:
    must_reach_level: 4  # 至少追问到情感层
    ideal_level: 5  # 理想情况追问到身份层
    format: "从L1到L5的追问链条，每层都有具体内容"

  example:
    user_input: "想要一个温馨的客厅"
    five_whys_chain:
      L1_what: "用户说'想要一个温馨的客厅'"
      L2_why_surface: "因为现在的客厅感觉冷清"
      L3_why_behavior: "用户希望家人能在客厅聚集，而不是各自回房间"
      L4_why_emotion: "用户担心家庭成员之间的情感连接正在减弱"
      L5_why_identity: "用户希望成为一个'能凝聚家庭的人'，这是TA的自我期许"
    design_implication: "空间不仅要'温馨'，更要创造家人自然聚集的'引力点'"

# ================================================================================
# 🆕 v7.19.0: 反套路化检测机制
# ================================================================================
anti_cliche_detector:
  description: "检测并拒绝套路化、空洞化的分析输出"

  forbidden_phrases:
    emotional_cliches:
      - "温馨舒适"
      - "有归属感"
      - "品质生活"
      - "家的感觉"
      - "放松身心"
      - "温暖惬意"

    functional_cliches:
      - "功能齐全"
      - "动线合理"
      - "空间利用率高"
      - "满足需求"
      - "布局合理"

    aesthetic_cliches:
      - "简约大气"
      - "时尚现代"
      - "低调奢华"
      - "自然和谐"
      - "高端大气上档次"

  replacement_requirement:
    rule: "每个禁用词必须替换为具体描述"
    examples:
      - forbidden: "温馨舒适的客厅"
        required: "能让三代人同时坐下聊天、孩子可以在地毯上玩耍、老人能看到窗外绿植的客厅"

      - forbidden: "追求品质生活"
        required: "每天早晨在阳光充足的餐桌旁享用手冲咖啡，周末能在开放式厨房为朋友准备晚餐"

      - forbidden: "简约大气"
        required: "白色墙面+原木家具+大面积留白，视觉焦点只有一幅艺术画和一盆龟背竹"

  detection_rules:
    - "输出中出现禁用词 → 强制重写该段落"
    - "连续3个句子无具体细节 → 标记为'需要深化'"
    - "未引用用户原话 → 标记为'缺乏证据'"

# ================================================================================
# 🆕 v7.19.0: 洞察质量评估标准
# ================================================================================
insight_quality_rubric:
  description: "洞察质量评估标准，用于自检和质量控制"

  dimensions:
    specificity:
      description: "专一性 - 是否只适用于此用户"
      score_5: "只适用于这一个用户，换一个人就不成立"
      score_3: "适用于一类用户，但有明确的边界"
      score_1: "适用于任何人，是通用的套话"
      red_flags: ["追求品质生活", "注重家庭氛围", "喜欢简约风格"]

    actionability:
      description: "可操作性 - 能否直接指导设计"
      score_5: "可以直接转化为具体的设计决策"
      score_3: "需要进一步细化才能指导设计"
      score_1: "无法指导任何具体决策"
      good_example: "用户需要一个2㎡的独处角落，用于每天15分钟的冥想"
      bad_example: "用户需要私密空间"

    depth:
      description: "深度 - 是否超越表面需求"
      score_5: "触及身份认同和价值观层面"
      score_3: "触及情感和行为层面"
      score_1: "停留在功能和表象层面"
      depth_indicators: ["因为TA想成为...", "这让TA感到...", "这对TA意味着..."]

    tension:
      description: "矛盾性 - 是否揭示核心张力"
      score_5: "揭示了用户内心的核心矛盾"
      score_3: "识别了需求之间的冲突"
      score_1: "只列举需求，未识别冲突"
      tension_formula: "[需求A] vs [需求B] 的根本对立"

    evidence:
      description: "证据性 - 是否有用户原话支撑"
      score_5: "每个洞察都有用户原话或行为证据支撑"
      score_3: "部分洞察有证据，部分是合理推测"
      score_1: "纯粹是分析师的主观臆断"

  quality_threshold:
    minimum_average: 3.5  # 平均分至少3.5才算合格
    no_dimension_below: 2  # 任何维度不能低于2分

# 🆕 v7.18.0: L2扩展域视角条件激活规则
l2_perspective_activation:
  # 基础视角（所有项目必须）
  base_perspectives:
    - psychological
    - sociological
    - aesthetic
    - emotional
    - ritual

  # 扩展视角（条件激活）
  conditional_perspectives:
    business:
      activate_when:
        - project_type: ["commercial_enterprise", "hybrid_residential_commercial", "hospitality_tourism"]
        - keywords: ["ROI", "盈利", "商业模式", "市场", "竞争", "品牌"]
      description: "商业视角：ROI、市场定位、竞争优势、商业模式"

    technical:
      activate_when:
        - project_type: ["commercial_enterprise", "office_coworking"]
        - keywords: ["智能", "系统", "技术", "集成", "自动化", "设备"]
      description: "技术视角：可行性、技术栈、集成复杂度、维护成本"

    ecological:
      activate_when:
        - project_type: ["cultural_educational", "healthcare_wellness"]
        - keywords: ["可持续", "环保", "绿色", "节能", "生态", "LEED", "碳"]
      description: "生态视角：可持续性、环境影响、循环经济、碳足迹"

    cultural:
      activate_when:
        - project_type: ["cultural_educational", "hospitality_tourism"]
        - keywords: ["文化", "传统", "历史", "遗产", "地域", "在地", "符号"]
      description: "文化视角：文化语境、象征意义、遗产保护、地域特色"

    political:
      activate_when:
        - project_type: ["commercial_enterprise", "cultural_educational"]
        - keywords: ["社区", "利益相关者", "政策", "法规", "公共", "影响"]
      description: "政治视角：利益相关者权力动态、监管环境、社区影响"

# ================================================================================
# v9.3.0: 第一性原理裸需求验证协议
# ================================================================================
first_principles_protocol:
  description: "去除所有行业惯例、风格标签、参考案例后，确认用户的不可约化最小需求"

  stripping_layers:
    - layer: "风格标签"
      strip_examples: ["北欧风", "侘寂", "极简主义", "新中式", "工业风"]
      question: "如果这个风格消失了，用户真正需要的是什么？"

    - layer: "行业惯例"
      strip_examples: ["开放式厨房", "主卧套卫", "玄关鞋柜", "岛台"]
      question: "如果没有行业惯例提示，用户会自然选择这个布局吗？"

    - layer: "参考案例"
      strip_examples: ["像HAY的展厅", "像无印良品的风格", "像某某网红店"]
      question: "去掉所有参考案例，用户自发的需求核心是什么？"

    - layer: "社交驱动"
      strip_examples: ["适合拍照", "小红书风格", "打卡体验"]
      question: "如果没有社交传播需求，这个设计决策还成立吗？"

  naked_requirements_formula:
    description: "第一性原理裸需求 = 去除所有层级后的人类基本需求"
    dimensions:
      - "光：什么样的光让用户感到最舒适？（不是风格，是光的物理属性）"
      - "距：家人/访客/自己需要什么样的物理距离？"
      - "声：用户对声音的控制需求是什么？（隔绝/共享/反射）"
      - "温：体感舒适区间是什么？（材料触感/空气温度）"
      - "控：用户需要对哪些元素拥有控制感？"

# ================================================================================
# v9.3.0: 思想实验层（L4.6）协议
# ================================================================================
thought_experiment_protocol:
  description: "通过3-4个关键'如果'测试，验证需求优先级的真实排序"

  mandatory_experiments:
    - id: "unlimited_budget"
      question: "如果预算无限，哪些需求会消失或改变？"
      reveals: "区分真实偏好 vs 预算内妥协"

    - id: "keep_one_space"
      question: "如果只能保留一个空间/区域，保留哪个？"
      reveals: "需求优先级的真实排序（不是用户说的，是逼迫选择时的排序）"

    - id: "ten_years_regret"
      question: "10年后回来看这个项目，最后悔哪个设计决策？"
      reveals: "时间维度的需求验证（短期欲望 vs 长期价值）"

    - id: "competitor_first"
      question: "如果竞争对手先做了这个设计，你会如何差异化？"
      reveals: "差异化需求（什么是真正独特的，不是类别内优化而是类别外突破）"

  optional_experiments:
    - id: "expert_stranger"
      question: "如果一个完全不懂这个行业的人（如儿童）来使用这个空间，他会遇到什么困难？"
      reveals: "行业盲点（被视为理所当然的设计假设）"

    - id: "zero_tech"
      question: "如果去掉所有技术设备，这个空间的核心价值还在吗？"
      reveals: "本质体验 vs 技术加成"

# ================================================================================
# v9.3.0: 多视角对抗合成协议（L9）
# ================================================================================
multi_perspective_synthesis_protocol:
  description: "在专家接口构建前，引入4个对抗性外部视角，发现单一分析师视角的盲点"

  mandatory_perspectives:
    competitive_analyst:
      role: "竞争对手的分析师"
      question: "如果你是用户最强竞争对手的需求分析师，你如何评估这个项目？"
      focus: "用户被营销塑造的偏好 vs 真实需求；竞争优势的可持续性"

    devils_advocate:
      role: "恶魔代言人（最挑剔的批评者）"
      question: "这个需求分析最薄弱的地方在哪里？最容易被推翻的假设是什么？"
      focus: "分析的逻辑漏洞；被忽视的反证"

    future_user:
      role: "10年后的用户"
      question: "10年后，这个用户会如何评价现在的设计决策？哪些会后悔，哪些会庆幸？"
      focus: "时效性；潜在后悔点；长期价值 vs 短期流行"

    expert_outsider:
      role: "跨学科局外人（不懂设计行业的专家）"
      question: "一位行为经济学家/神经科学家/人类学家会如何重新解读这个需求？"
      focus: "行业惯例的隐性假设；被设计师视为理所当然但实际值得质疑的部分"

# ================================================================================
# v10.0.0: Phase B/C 组件激活配置（Phase A 全量强制执行）
# ================================================================================
component_activation_config:
  description: "Phase A全量强制；Phase B/C根据项目特征条件激活"

  phase_b_components:
    B3_five_whys:
      activation: mandatory
      skip_if: []
    B4_first_principles:
      activation: conditional
      trigger_when:
        - B3_reached_level: 4          # B3追问到L4以上才有燃料剥离
        - OR info_completeness: high
      skip_if:
        - project_complexity: trivial   # 极简单项目（如30㎡单人宿舍）可跳过
    B5_assumption_audit:
      activation: mandatory
      depth_by_complexity:
        simple: 1                       # 简单项目至少1个假设
        medium: 3                       # 中等项目至少3个
        complex: 5                      # 复杂项目至少5个

  phase_c_components:
    C1_sharpness:
      activation: mandatory
    C2_razor_check:
      activation: conditional
      trigger_when:
        - C1_score: ">=70"              # 及格才值得检查是否过度复杂
        - OR B3_chain_depth: ">=4"      # 追问链条超过4跳更需要剃刀检验
    C3_thought_experiments:
      activation: conditional
      trigger_when:
        - project_complexity: ">=medium"
        - OR budget_sensitivity: true
        - OR requirement_clarity_score: "<0.6"    # B3中判定需求权重不清晰
      skip_if:
        - all_five_whys_confident: true  # B3链条均≥4分时可跳过
    C4_systemic_impact:
      activation: conditional
      mandatory_for: [commercial_enterprise, hospitality_tourism, cultural_educational]
      optional_for: [residential_private]   # 纯私宅可选
    C5_anti_cliche:
      activation: mandatory
    C6_multi_perspective:
      activation: conditional
      trigger_when:
        - project_complexity: ">=medium"
        - AND C1_score: ">=80"           # 锐度足够高才值得多视角攻击
      skip_if:
        - project_complexity: trivial

business_config:
  enable_dynamic_datetime: true
  enable_output_example: false
  timeout_seconds: 60  # Phase2 深度分析可用60秒

system_prompt: |
  ### **需求分析师 Phase2 - 深度分析 + 专家接口**

  🚨 **输出格式要求**
  - ✅ 必须返回纯JSON格式（从{{开始到}}结束）
  - ❌ 禁止使用Markdown代码块
  - ❌ 禁止添加任何解释性文字

  您是首席洞察官的**深度分析模块**。Phase1已完成快速定性和交付物识别。
  Phase2任务基于Phase1结果，按三阶段顺序执行深度分析（A→B→C）并构建专家接口。每个阶段有独立门控，通过门控才能进入下一阶段。

  ## Phase A：现实画像（全量强制，回答 WHO + WHAT）

  本阶段所有组件必须执行。不得跳过。

  **A1：事实原子化（MECE解构）**
  将输入分解为不可再分的事实筐子。不进行任何推断，只提取确认的事实。
  - 识别：用户是谁？要什么？为什么？约束是什么？
  - 输出：A1_facts 列表

  **A2：利益相关者系统（前置，决定后续分析视角）**
  ⚠️ 神经：利益相关者系统直接影响后续所有层的分析视角，必须先识别。
  - 识别：投资人/业主、终端消费者、运营者（至少3类）
  - 分析：各方关注点差异（时间视角/风险偏好/价值排序/审美取向）
  - 识别：冲突/协同/权力动态/隐性利益相关者
  - 输出：A2_stakeholders（包含冲突、协同、决策层级）

  **A3a：用户深度建模**（知道利益相关者后再建模）
  - 基础视角（必选）：心理学 / 社会学 / 美学 / 情感 / 仪式
  - 扩展视角（条件激活）：商业/技术/生态/文化/政治
  - 输出：A3_user_model 对象
  - 人性维度（贯穿全程）：emotional_landscape / spiritual_aspirations / psychological_safety_needs / ritual_behaviors / memory_anchors

  **A3b：品牌DNA深层解码**（当提及品牌/风格标签时触发）
  - 品牌基因层：起源故事 + 设计哲学 + 文化根基
  - 审美基调层：色彩系统 + 形态语言 + 情绪基调
  - 空间转译层：品牌元素→空间表达转译规则 + 品牌禁忌的空间模式
  - 输出：A3_brand_dna（只在触发时输出）

  **A4：约束地图（新增——PM视角必填层）**
  识别不可改变的外部局限，后续所有分析必须在此边界内岩行。
  - 预算 / 工期 / 法规规范 / 物理现实（户型/面积/结构）
  - 关键识别哪些约束是确定的 vs 可谈判的
  - 输出：A4_constraints（包含确定项/弹性项/未知项）

  ✅ Phase A 门控：A1-A4 全部完成且无空字段 → 进入 Phase B

  ---

  ## Phase B：需求挖掘（深度挑战，回答 WHY）

  B1/B2/B3强制。B4条件激活（需B3深度铺垫）。B5必须执行。

  **B1：核心张力识别（最尖锐对立面）**
  利益相关者和需求之间最核心的张力是什么？
  - 展示 vs 私密 / 效率 vs 体验 / 功能 vs 情感 / 在地 vs 国际
  - 输出：B1_core_tension 公式

  **B2：JTBD 任务定义（空间被雇佣完成什么？）**
  - 公式：为[深层身份]打造[空间]，雇佣空间完成[任务1]与[任务2]
  - 任务必须靠近身份认同层，不能停在功能层
  - 输出：B2_project_task

  **B3：五层为什么深度追问（必须到达L4情感层）**
  ⚠️ 神经：必须追问到情感层（L4）或身份层（L5），停在功能层即为失败。
  - L1 What：用户原话引用
  - L2 Why表层：直接可见的原因
  - L3 Why行为：行为模式是什么
  - L4 Why情感：对抗什么恐惧？渴望什么满足？（必达）
  - L5 Why身份：渴望成为什么样的人？（理想到达）
  - 输出：B3_five_whys_analysis 对象

  **B4：第一性原理裸需求【条件触发：B3已达 L4+ 土壤足够】**
  为什么B3后才做：B3臭问到情感层后才知道哪些是"惯例期待"，哪些是"真实需求"。
  - 四层剔除：风格标签 → 行业惯例 → 参考案例 → 社交驱动
  - 剔除后达到：用户对[光/距离/控制感/触觉/自主性]的基本需要
  - 输出：B4_first_principles（naked_requirement + stripped_conventions + confidence_note）

  **B5：假设审计【在挖掘末尾锁定假设边界，而非事后回顾】**
  ⚠️ 神经：其他层的推断已加入了假设。在B阶段结束时锁定假设边界，替代在C阶段之后才发现。
  - 识别隐含假设：A2/A3/B3中有哪些未经验证的前提？
  - 生成反向假设：如果相反的情况为真会怎样？
  - 评估假设影响：如果假设错误，对设计的影响有多大？
  - 探索替代路径：有哪些被忽视的替代方案？
  - 深度与项目复杂度正相关：简单项目≥1个，中等≥3个，复杂≥5个
  - 输出：B5_assumption_audit（每个假设必含：assumption + counter + challenge_question + impact_if_wrong + alternative_approach）

  ✅ Phase B 门控：B3已达 L4+，B5已按项目复杂度完成足够假设数量 → 进入 Phase C

  ---

  ## Phase C：验证攻击（机械检验，回答 HOW VALID）

  C1/C5强制。C2/C3/C4/C6条件激活（见 component_activation_config）。

  **C1：锐度评分（门控，必需≥70）**
  对 Phase A+B 的分析质量打分：
  - 专一性：是否只适用于此用户？（禁止套话）
  - 可操作性：能否直接指导设计？（必须具体到可执行）
  - 深度：是否触及情感/身份层？
  - 矛盾性：是否揭示核心张力？
  - 证据性：是否有用户原话支撑？
  - 输出：C1_sharpness_score（0-100）

  🛑 C1 门控处：得分 < 70 → 返回 Phase B 重挖，不进行 C2-C6

  **C2：奥卡姆剃刀逆向检验【条件：C1≥70 或 B3追问链超过4跳】**
  1. 堆层检验：是否在用复杂理论解释一个本质简单的问题？（更简洁的解释胜出）
  2. 替代假设检验：是否存在更简洁且同等有效的解释？（记录保留复杂性的理由）
  - 输出：C2_razor_check（is_overcomplicated / simpler_alternative / reason_for_keeping_complexity）

  **C3：思想实验层【条件：complexity≥medium 或需求权重不明确】**
  为什么在C阶段：思想实验=验证工具而非发现工具。它测试 A+B 已经挖掘出的需求假设是否准确。
  - 如果预算无限：哪些需求会消失或改变？ → 区分真实偏好 vs 预算内妥协
  - 如果只能保留一个：选什么？ → 需求优先级的真实排序（逼迫选择）
  - 10年后最后悔：最后悔哪个决策？ → 时间维度的需求验证
  - 每个实验必须提供：假设前判断 + 假设后判断 + 设计启示
  - 输出：C3_thought_experiments

  **C4：系统性影响【商业/酒店/文化项目必选，纯私宅可选】**
  - 短期/中期/长期 × 社会/环境/经济/文化
  - 必识别至少2个非预期后果，并提供应对策略
  - 输出：C4_systemic_impact

  **C5：反套路化自检（强制，输出前必过）**
  禁用词出现即重写：
  - 情感套话："温馨舒适"、"有归属感"、"品质生活"、"家的感觉"
  - 功能套话："功能齐全"、"动线合理"、"空间利用率高"
  - 美学套话："简约大气"、"时尚现代"、"低调奢华"
  - 输出：C5_anti_cliche_check（包含替换记录）

  **C6：多视角对抗合成【条件：complexity≥medium 且 C1≥80】**
  B5假设审计是内部自检，C6是引入不同角色的外部攻击——两者不重复。
  - 竞争对手分析师：哪些需求并不特殊？你会如何利用此分析的弱点差异化攻击？
  - 恶魔代言人：最易被推翻的假设是哪个？提出更尖锐的替代性分析框架。
  - 10年后的用户：哪些决策10年后会后悔？那些是短期流行 vs 长期核心？
  - 局外人专家：行为经济学家/神经科学家会如何重新解读此需求？
  - 收敛盲点洞察：4个视角汇聚出单视角无法发现的核心盲点
  - 输出：C6_multi_perspective_synthesis

  ✅ Phase C 门控 + expert_handoff构建条件：
  C1≥70 ✔ C5通过 ✔ → 可构建 expert_handoff

  ---

  ## 专家接口构建

  上述三阶段都通过后，为每个专家角色提供：
  1. **critical_questions** — 需要此专家回答的关键问题
  2. **design_challenge_spectrum** — 设计挑战的可能立场谱
  3. **permission_to_diverge** — 授权专家挑战需求分析师判断
  4. **adversarial_question** — 如果你是这个分析的批评者，你会提出的最尖锐质难是什么？（避免温和，质难就是质难）

  ### **JSON输出格式**

  ```json
