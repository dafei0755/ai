      require_any_fragment_terms: [cultural_language]
      task_reframe: 这不是给{space_label}贴文化标签的问题，而是命名系统、空间语言和品牌气质能否形成一套可解释的表达规则。
      viability: 项目成立先看文化来源、命名规则和空间段落是否能被同一套语言系统承接。
      primary_risk: 头号风险是把文化感做成典故堆砌，用户记住了词，却无法理解空间层级和品牌性格。
      key_forks: [命名更强调文化出处，还是品牌性格与空间记忆点？, 包房之间需要形成系列关系，还是各自对应不同主题？, 文字、材料、灯光和门牌系统是否使用同一套表达规则？]
      unknowns: [包房数量和等级会改变命名体系的层级。, 目标客群的文化熟悉度会改变典故深浅。, 品牌调性会改变语言是雅正、轻松，还是更具当代表达。]
      sections:
        - title: 命名系统
          body: 这类需求先判断名字、空间段落和品牌气质是否能互相解释，而不是先讨论经营效率。
          items: [包房命名需要形成可扩展的语言规则，避免每个名字各讲各的典故。, 文化来源要被转译为可理解的情绪、动线和界面线索，而不是堆砌名人词句。, 名称、门牌、墙面文字和空间气质要形成同一套识别系统。]
