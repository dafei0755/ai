          body: 酒店大堂需求重构要先判断抵达、办理、等候、寄存和短暂停留能否同时成立，而不是把城市文化展示做成独立展陈。
          items: [入住接待、退房、问询和行李寄存会决定前场动线和排队组织。, 商务等候、早餐外摆和临时会客需要判断停留时长、安静度和服务半径。, 城市文化展示应服务抵达记忆和品牌识别，不能挤压接待效率与行李流线。]
          emphasis: high
        - title: 服务边界
          body: 大堂同时承担运营、社交、等候和品牌表达，必须先把不同时间段的使用压力拆开。
          items: [早高峰、集中入住和退房时段会改变座位、前台和行李区关系。, 早餐外摆若进入大堂，会改变气味、清洁、补给和客流交叉。, 商务等候区需要明确与普通休息、前台排队和城市文化展示的边界。]
