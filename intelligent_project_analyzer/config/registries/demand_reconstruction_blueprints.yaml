      sections:
        - title: 生产链路
          body: 直播和短视频空间要先确认内容从选品、展示、拍摄到运营复盘如何流动。
          items: [主播间、选品展示、样品仓和运营中控需要形成短路径协同，而不是互相穿插。, 短视频拍摄和直播带货对灯光、收音、背景和设备常驻方式的要求不同。, 样品流转、临时堆放和退换管理会反向决定后台面积和通道宽度。]
          emphasis: high
        - title: 运营中控
          body: 内容生产空间的稳定性来自运营、设备、人员和货品管理，而不只是画面好看。
          items: [中控区需要同时看见直播状态、库存节奏、脚本提示和突发处理。, 多主播、多账号或多语种运营会改变隔音、候场和化妆准备需求。, 设备走线、补光、网络和仓储安全要先进入任务书，否则后期会反复返工。]
          emphasis: medium
      slots:
        project_object: 内容生产空间
        core_tension: 内容生产效率、货品流转与直播画面稳定之间的张力
        recommended_brief_focus: 先冻结直播链路、样品流转、中控协同和设备常驻方式
      next_question: 这个直播基地首先服务直播带货、短视频拍摄，还是选品展示和运营中控
    kitchen_media_lab:
      trigger_terms: [厨房, 美食, 烹饪, 做饭, 菜品, 菜系, 油烟, 烘焙, 热炒, 备菜, 美食实验室]
      task_reframe: 这不是先做{space_label}风格的问题，而是判断真实使用、镜头呈现、设备协同和污染控制能否在同一套空间机制里切换。
      viability: 项目成立先看真实烹饪与高质量拍摄能否通过分区、时间切换或设备策略被同时维护。
      primary_risk: 头号风险是空间只像一个漂亮厨房影棚，却在真实烹饪、清洁、收音或灯光维护中失效。
      key_forks: [拍摄是单人固定机位，还是有摄影、灯光和收音协同？, 核心内容是重油烟热炒，还是烘焙、轻食、摆盘和讲解？, 背景替换依赖实体模块，还是绿幕、虚拟背景和后期合成？]
      unknowns: [拍摄团队规模会改变机位、走线和通行边界。, 菜系和油烟强度会改变排风、新风和材料耐清洁等级。, 设备是否常驻会改变收纳、吊挂和插座策略。, 日常做饭频率会改变生活收纳和拍摄布景的优先级。]
      sections:
        - title: 场景切换机制
          body: 媒体型空间要先确认拍摄状态与日常使用状态如何互不破坏。
          items: [真实操作会产生油烟、水汽、杂物和噪声，镜头呈现却要求画面、收音和灯光稳定。, 同一台面如果同时承担备菜、烹饪、展示和拍摄，最容易在高频使用中失效。, 背景可替换不是装饰题，而是布景、收纳、清洁和机位边界能否快速复位。]
          emphasis: high
        - title: 专业使用者习惯
          body: 先确认创作者的工作流，再决定空间、设备和灯光的主次。
          items: [单人拍摄、团队拍摄和直播带货需要完全不同的走线、补光和监看位置。, 菜品研发、脚本录制、成片展示和日常做饭的优先级不同，会改变厨房核心区。, 设备常驻还是临时搭建，会改变收纳、插座、吊挂和地面安全边界。]
          emphasis: medium
        - title: 污染与画面边界
          body: 油烟控制要和镜头、灯光、声学一起判断，而不是只看排风设备。
          items: [重油烟菜系会提高排风、新风、镜头防污和背景材料耐清洁要求。, 灯光系统如果和油烟、水汽、吊柜冲突，会直接影响拍摄质量和维护成本。, 收音、排风噪声和设备散热会共同决定拍摄时能否稳定工作。]
          emphasis: medium
      slots:
        project_object: 媒体型厨房
        core_tension: 真实烹饪、镜头呈现与设备维护之间的张力
        recommended_brief_focus: 先冻结拍摄工作流、油烟强度、设备常驻方式和背景切换机制
      next_question: 日常真实烹饪与镜头前拍摄烹饪在时间上是重合的还是分离的
    food_styling_studio:
      trigger_terms: [摆盘, 桌面布景, 餐具布景, 成品展示, 甜品]
      exclude_when_any_fragment_terms: [heavy_cooking_exclusion]
      task_reframe: 这不是把{space_label}做成厨房影棚的问题，而是摆盘、布景、补光、收音和快速复位能否支撑稳定短视频产出。
      viability: 项目成立先看桌面拍摄链路是否稳定，再看视觉风格能否服务内容更新。
      primary_risk: 头号风险是把空间做得好看，却没有解决道具收纳、灯位复位和拍摄效率。
      key_forks: [拍摄以成品摆盘为主，还是需要讲解、开箱和过程展示？, 背景切换依赖固定墙面、移动布景，还是桌面道具组合？, 补光和收音设备是常驻，还是每次临时搭建？]
      unknowns: [拍摄频率会改变设备常驻和收纳容量。, 画面比例和平台类型会改变机位、背景宽度和灯位。, 道具数量会改变墙面、柜体和桌面组织。]
      sections:
        - title: 桌面拍摄链路
          body: 这类内容生产先看成品展示、桌面布景、补光和收音能否快速复位，而不是按真实厨房处理。
          items: [摆盘区需要稳定的桌面尺度、机位距离和道具收纳，避免每次拍摄重新搭场。, 餐具、背景板、软装和小道具应按镜头主题分类，减少拍摄前准备时间。, 成品展示更依赖光线、色彩和表面质感控制，而不是重操作工位。]
          emphasis: high
        - title: 声光与布景
          body: 短视频拍摄区要先确认补光、收音和背景切换方式，再决定装饰风格。
          items: [补光灯位、反光板和相机支架需要常驻边界，否则会挤占桌面操作。, 收音要避开设备噪声和临时人流，确保讲解类内容稳定。, 背景切换可以依赖可移动板、布景架或墙面模块，但要便于清洁和收纳。]
          emphasis: medium
      slots:
        project_object: 内容拍摄空间
        core_tension: 桌面布景、声光设备、道具收纳与内容更新效率之间的张力
        recommended_brief_focus: 先冻结拍摄类型、布景切换、补光收音和道具收纳
      next_question: 这个拍摄区主要做成品摆盘展示，还是也要承接讲解、开箱和过程类内容
    heavy_cooking_exclusion:
      trigger_terms: [厨房, 烹饪, 做饭, 油烟, 热炒, 备菜, 菜系, 排风, 新风]
  commercial_specialties:
    food_beverage_operation:
      trigger_terms: [咖啡, 社区咖啡, 咖啡店, 茶饮, 奶茶, 餐厅, 饮品, 出杯, 堂食, 外带, 菜单, 吧台, 翻台, 取餐]
      task_reframe: 这不是单纯布置店面的效率题，而是客流、出品、停留和外带路径能否在小空间里同时成立的问题。
      viability: 项目成立先看高峰期路径是否顺畅，再看氛围和风格能否加分。
      primary_risk: 头号风险是把面积花在好看的座位或展示上，反而牺牲出品和取餐效率。
      key_forks: [堂食翻台优先，还是外带快取优先？, 高峰期订单集中在几分钟内，还是全天均匀？, 吧台承担展示、点单、出品、取餐中的哪几项？]
      unknowns: [峰值订单量会改变吧台与等候区判断。, 菜单复杂度会改变设备和后场需求。, 外带占比会改变入口、排队和取餐组织。]
      sections:
        - title: 经营变量
          body: 商业空间需求重构要先抓经营机制，不先做风格建议。
          items: [翻台取决于座席停留时长、点单等待、取餐回流和清台效率。, 外带效率取决于点单、等候、取餐是否与堂食路径互不打架。, 小面积店铺的命门通常不是座位多，而是高峰期是否堵在吧台前。]
          emphasis: high
        - title: 隐藏开关
          body: 这些选择会让后续平面和面积判断完全不同。
          items: [堂食优先还是外带优先，会改变吧台长度和座席密度。, 现制饮品复杂度越高，后场和等候区压力越大。, 社区熟客店与路过型快取店，视觉表达和入口组织不同。]
          emphasis: medium
      slots:
        project_object: 商业空间
        core_tension: 坪效、出品效率与停留体验之间的张力
        recommended_brief_focus: 优先冻结经营模型、峰值动线和外带/堂食比例
    automated_retail:
      trigger_terms: [无人便利店, 无人零售, 自助结算, 货架补货, 冷柜监控, 防损摄像头, 夜间运营, 会员复购, 自动售卖]
      task_reframe: 这不是给便利店做货架陈列的问题，而是把自助结算、货架补货、冷柜监控、防损摄像头、夜间运营和会员复购排成可运营的无人零售链路。
      viability: 项目可以进入需求重构，但必须先确认无人值守、补货维护、防损监控和会员复购机制，不能按普通门店或茶饮快周转逻辑展开。
      primary_risk: 头号风险是只优化陈列和动线，却没有处理自助结算、补货、冷柜监控、防损和夜间运营之间的运营闭环。
      key_forks: [无人值守优先，还是补货效率和防损控制优先？, 自助结算、防损摄像头和会员系统是否需要同一套入口识别？, 冷柜监控和夜间运营由空间管理、设备系统，还是后台巡检共同完成？]
      unknowns: [SKU结构、冷柜比例和补货频率尚未确认。, 自助结算方式、防损策略和会员系统尚未确认。, 夜间运营时段、巡检方式和异常处理责任尚未确认。]
      sections:
        - title: 无人零售运营链路
          body: 无人便利店需求重构要先确认商品、设备、结算、防损和补货如何闭环，而不是只做普通零售陈列。
          items: [自助结算和入口识别会改变动线、货架可见性和异常处理位置。, 货架补货、冷柜监控和库存预警会决定后台、通道和设备检修边界。, 防损摄像头、夜间运营和会员复购需要共同定义开放边界和运营责任。]
          emphasis: high
        - title: 设备与巡检边界
          body: 无人零售空间的稳定性来自设备在线、异常响应和巡检制度，而不是一次性平面布置。
          items: [先确认冷柜、摄像头、自助结算设备和网络是否需要独立检修路径。, 先确认夜间异常、支付失败、补货延迟和设备故障的响应机制。, 先确认会员运营是入口识别、消费复购，还是社群活动的一部分。]
          emphasis: medium
      slots:
        project_object: 无人便利店
        core_tension: 自助结算、补货维护、冷柜监控、防损控制、夜间运营和会员复购之间的张力
        recommended_brief_focus: 先冻结无人值守机制、补货频率、冷柜监控、防损策略和会员复购边界
    retail_brand_conversion:
      trigger_terms: [旗舰店, 体验店, 快闪体验店, 香薰品牌, 小众香薰, 产品试闻, 试闻, 试用, 品牌故事, 会员活动, 高客单转化, 销售转化, 样板间展示, 材料体验, 销售咨询]
      task_reframe: 这不是先给{space_label}做漂亮陈列的问题，而是品牌理解、产品体验、停留转化和会员关系能否被同一套动线承接。
