      sections:
        - title: 服务体验
          body: 高端餐饮需求重构要先判断宴请、包房、茶室和服务路径如何共同塑造体验，而不是套快周转效率题。
          items: [宴请接待更依赖抵达、等候、入席和离席的节奏，而不是单纯提高座位周转。, 包房秩序需要兼顾私密、服务响应、展示界面和临时会客。, 茶室、艺术陈设和公共客厅应服务品牌气质与停留体验，而不是成为孤立装饰。]
          emphasis: high
        - title: 品牌文化
          body: 品牌文化体验要被转化为可感知的服务层级、空间段落和材料细节。
          items: [文化表达应帮助客人理解餐厅性格，而不是堆砌符号。, 服务动线要隐藏后台压力，同时保证高峰宴请时的响应速度。, 艺术陈设、茶室和包房命名应形成一套一致的记忆系统。]
          emphasis: medium
      slots:
        project_object: 餐饮空间
        core_tension: 宴请接待、品牌文化、包房私密和服务效率之间的张力
        recommended_brief_focus: 先冻结客群、包房层级、服务路径和品牌文化表达
    quick_service_exclusion:
      trigger_terms: [翻台, 外带, 快取, 出杯, 取餐, 坪效, 小店, 社区咖啡]
  workplace_specialties:
    headquarters:
      trigger_terms: [办公, 总部, 研发团队, 研发小组, 产品会议, 项目讨论, 工位, 员工休息, 会议室, 开放办公, 混合办公, 企业协作枢纽, 客户来访, 团队恢复]
      task_reframe: 这不是给总部办公空间做形象包装的问题，而是把组织协作、客户接待、员工恢复和品牌展示重新排成可运行的空间秩序。
      viability: 项目可以进入需求重构，但要先确认组织工作方式和访客边界，再决定视觉形象与空间配置。
      primary_risk: 头号风险是把总部做成品牌展厅，结果研发协作、会议效率、员工休息和客户接待互相挤压。
      key_forks: [研发专注、跨团队协作和产品会议谁是第一优先级？, 客户接待需要展示到什么深度，哪些内部工作必须隔离？, 品牌展示服务信任建立，还是服务员工文化认同？]
      unknowns: [团队规模、部门关系和混合办公比例尚未确认。, 客户到访频率、接待深度和保密边界尚未确认。, 会议类型、项目协作节奏和员工恢复需求尚未确认。]
      sections:
        - title: 组织协作
          body: 总部办公需求重构要先判断组织如何工作，而不是先做前台、会议室和工位的面积拼盘。
          items: [研发、产品、会议和管理节奏不同，会决定开放协作、专注工作和项目讨论的比例。, 组织文化不是墙面口号，而是员工每天如何相遇、协作、沉淀和恢复。, 客户接待与内部办公共享空间时，要先确认哪些信息可见、哪些行为必须隔离。]
          emphasis: high
        - title: 访客与员工边界
          body: 总部空间同时面向员工、客户和品牌展示，最容易在流线与权限上互相打架。
          items: [客户动线应能理解品牌，但不能穿透研发、会议和员工恢复区。, 员工休息不是装饰福利区，它会反向影响专注效率、社交密度和加班恢复。, 品牌展示要服务信任建立，而不是牺牲真实办公效率。]
          emphasis: medium
      slots:
        project_object: 总部办公空间
        core_tension: 组织协作、客户接待、员工恢复和品牌展示之间的张力
        recommended_brief_focus: 先冻结组织工作方式、访客边界、会议协作和品牌展示深度
    professional_service:
      trigger_terms: [心理咨询, 咨询室, 咨询师, 律所, 律师, 客户会谈, 档案保密, 合伙人会议, 团体活动, 专业服务]
      task_reframe: 这不是给办公室做形象包装的问题，而是把接待、专业服务、档案保密、内部协作和人员恢复重新排成可运行的服务秩序。
      viability: 项目可以进入需求重构，但要先确认服务流程、隐私边界和专业人员工作节奏，再决定空间配置与表达。
      primary_risk: 头号风险是把专业服务办公室做成普通办公，结果客户会谈、档案保密、团体活动和人员恢复互相干扰。
      key_forks: [客户会谈和咨询服务优先，还是团队协作与复盘优先？, 档案保密靠空间隔离、权限管理，还是流程控制？, 团体活动、接待等候和专业人员恢复是否能共享空间？]
      unknowns: [日均到访量、咨询室数量和团体活动频率尚未确认。, 档案保密等级、资料调用方式和内部权限尚未确认。, 咨询师或专业人员的恢复、复盘和协作需求尚未确认。]
      sections:
        - title: 专业服务秩序
          body: 专业服务办公首先要确认服务对象、专业人员和资料安全如何共存，而不是直接套通用组织形象模板。
          items: [接待、等候、咨询或会谈需要控制可见性、安静度和心理安全感。, 档案保密、客户信息和内部讨论应明确权限边界，不能只按普通开放办公处理。, 专业人员的恢复、复盘和协作空间会影响服务质量，不应被压缩成剩余面积。]
          emphasis: high
        - title: 隐私与协作
          body: 这类空间的关键不是展示组织规模，而是把对外服务、私密沟通和内部协作排成稳定流程。
          items: [先确认咨询室、会谈室、团体活动和接待区之间的声学与视线边界。, 先确认客户到访、专业人员复盘和档案调用是否会互相打扰。, 先确认哪些区域需要降低压迫感，哪些区域必须提高保密与管理强度。]
          emphasis: medium
      slots:
        project_object: 专业服务办公空间
        core_tension: 客户隐私、专业服务、内部协作和人员恢复之间的张力
        recommended_brief_focus: 先冻结服务流程、隐私边界、档案管理和专业人员恢复需求
  technical_specialties:
    generic_constraint:
      is_default_fragment: true
      task_reframe: 这不是先给形式建议的问题，而是先确认哪些技术边界会决定空间能不能成立。
      viability: 项目可以继续重构，但需要先确认约束等级，再决定是否进入完整任务书。
      primary_risk: 头号风险是把硬约束当成后期深化问题，导致方案方向一开始就建立在不可实现的前提上。
      key_forks: [哪些约束是不可突破的，哪些只是需要协调？, 技术边界优先，还是体验目标优先？, 哪些参数需要专项顾问或设备清单才能确认？]
      unknowns: [原建筑条件会改变可改造范围。, 设备、消防、结构或环境控制标准会改变空间组织。, 维护检修和公众使用边界会改变动线分区。]
      sections:
        - title: 约束分层
          body: 技术约束题必须先区分不可突破条件、可协调条件和体验目标。
          items: [法规、安全、结构、机电、环境控制或无障碍中，先确认哪些是不可突破条件。, 已有建筑条件、设备尺寸和系统容量会改变平面、层高、动线或材料选择。, 硬约束与体验目标冲突时，必须先确认谁拥有优先级和决策权。]
          emphasis: high
        - title: 待确认参数
          body: 这些条件不清，需求重构只能给判断路径，不能给施工级结论。
          items: [原建筑结构、消防分区和机电容量是否允许调整。, 关键设备、环境控制或安防系统的性能标准。, 公众使用、后台管理和维护检修是否需要分流。]
          emphasis: medium
      slots:
        project_object: 技术约束空间
        core_tension: 技术边界、体验目标和实施条件之间的张力
        recommended_brief_focus: 先冻结不可突破约束、待测参数、专项顾问边界和维护检修路径
      next_question: 哪些技术条件已经确定，哪些还需要检测、设备清单或专项顾问确认
    cold_storage_constraint:
      trigger_terms: [冷藏柜, 冷藏, 冷链, 生鲜, 鲜果, 奶制品, 预制品]
      semantic_axis_matches:
        critical_constraints: [cold_chain_logistics]
      task_reframe: 这不是直接报一个尺寸的问题，而是先找出会让参数翻倍或失效的隐藏开关。
      viability: 当前能判断问题路径，但不能直接冻结尺寸。
      primary_risk: 头号风险是用经验尺寸替代设备逻辑，后期造成补货、动线或用电冲突。
      key_forks: [前场展示冷藏，还是后场储藏冷藏？, 鲜果奶制品为主，还是瓶装/预制品为主？, 按日补货，还是需要多日储备？]
      unknowns: [菜单结构会改变冷藏容量。, 补货频率会改变储藏量。, 设备布置和电力条件会改变可选型号。]
      sections:
        - title: 隐藏开关
          body: 硬约束题必须先问会改变答案的变量。
          items: [设备尺寸受产品结构、补货频率、后场面积和用电条件共同影响。, 如果涉及鲜果、奶制品或预制品，冷藏需求会完全不同。, 前场展示冷藏与后场储藏冷藏不是同一个问题。]
          emphasis: high
        - title: 待确认参数
          body: 这些参数不清，需求重构只能给判断路径，不能给施工级结论。
          items: [日销量和峰值备货量。, SKU 数量与需要冷藏的原料类型。, 前场展示、后场储藏和操作台下冷藏的分工。]
          emphasis: medium
      slots:
        core_tension: 设备参数与运营模型之间的张力
        recommended_brief_focus: 优先冻结菜单、补货和设备分工
    acoustic_constraint:
      trigger_terms: [声学, 隔声, 吸声, 杜比, 全景声, 低频, 扬声器, 观影, 影音室, 家庭影院, 设备散热, 混响]
      semantic_axis_matches:
        critical_constraints: [acoustics]
      task_reframe: 这不是先配置影音设备的问题，而是把声学目标、隔声边界、低频控制、设备散热和观影座位排成可验证的影音系统链路。
      viability: 项目可以进入需求重构，但必须先确认声学目标、相邻空间、设备热量和座位关系，不能只按设备清单展开。
      primary_risk: 头号风险是只追求杜比或设备规格，却没有处理隔声、吸声、低频驻波、散热和座位覆盖之间的硬冲突。
      key_forks: [声学效果优先，还是对相邻空间的隔声控制优先？, 低频控制靠房间比例、构造吸声，还是设备调校共同完成？, 设备散热、检修和布线是否会改变座位与墙体构造？]
      unknowns: [房间尺寸、层高和相邻空间尚未确认。, 扬声器数量、低频设备和功放散热尚未确认。, 隔声目标、吸声材料和混响控制标准尚未确认。]
      sections:
        - title: 声学链路
          body: 影音室需求重构要先确认声音如何被产生、控制、隔离和校准，而不是只罗列设备型号。
          items: [杜比全景声需要同时校准扬声器布局、座位覆盖和反射界面。, 隔声与吸声不是同一个问题；前者控制外泄，后者控制室内听感和混响。, 低频驻波、墙体构造和房间比例会直接改变设备布置与材料策略。]
          emphasis: high
        - title: 设备与散热边界
          body: 影音设备、功放、线缆和散热会反向改变墙体、吊顶、检修和座位组织。
          items: [先确认功放、低频炮和机柜是否需要独立散热与检修路径。, 先确认布线、吊顶高度和墙体构造是否支撑声学与设备要求。, 先确认观影座位数量、视距和声场覆盖是否匹配房间尺度。]
          emphasis: medium
      slots:
        project_object: 影音室
        core_tension: 声学效果、隔声边界、低频控制、设备散热和座位覆盖之间的张力
        recommended_brief_focus: 先冻结声学目标、隔声等级、设备散热、布线和座位覆盖方式
    archive_preservation:
      trigger_terms: [档案馆, 档案库, 地下档案库, 恒温恒湿, 防火分区, 安防管理, 公众查阅, 查阅动线, 库区, 档案保护]
      task_reframe: 这不是先规划档案馆房间的问题，而是把档案保护、恒温恒湿、防火安防、库区管理和公众查阅排成可验证的保护与服务链路。
      viability: 项目可以进入需求重构，但必须先确认库区保护等级、公众查阅边界和后台管理方式，不能只按普通技术空间或普通展馆展开。
      primary_risk: 头号风险是把档案库当成普通地下用房，结果恒温恒湿、防火分区、安防管理和公众查阅动线互相穿透。
      key_forks: [档案保护优先，还是公众查阅服务优先？, 库区、查阅区和后台管理是否需要完全分流？, 恒温恒湿、防火分区和安防系统谁先决定平面边界？]
      unknowns: [档案类型、保存等级和库容增长方式尚未确认。, 恒温恒湿、防火分区和安防等级尚未确认。, 公众查阅规模、预约制度和后台调档路径尚未确认。]
      sections:
        - title: 档案保护链路
          body: 档案库需求重构要先确认档案如何被保存、调取、查阅和管理，而不是只列房间名称。
          items: [恒温恒湿会改变库区分区、机电容量、维护通道和开放时长。, 防火分区、安防管理和库区权限需要前置确认，不能后期靠门禁补救。, 档案调取、暂存、查阅和归库需要形成受控路径，避免公众动线穿透核心库区。]
          emphasis: high
        - title: 查阅与后台边界
          body: 档案馆同时承担公共服务和长期保存，必须把查阅服务、后台调档和库区保护分清。
          items: [先确认公众查阅是开放查阅、预约查阅，还是仅提供有限阅览服务。, 先确认查阅区、咨询台、调档后台和库区之间的信息与人员边界。, 先确认安防、消防和环境控制是否允许公众路径靠近核心库区。]
          emphasis: medium
      slots:
        project_object: 档案库
        core_tension: 档案长期保护、环境控制、防火安防和公众查阅服务之间的张力
        recommended_brief_focus: 先冻结库区保护等级、环境控制、防火安防、调档路径和公众查阅边界
    coastal_resilience:
      trigger_terms: [滨海, 海边, 盐雾, 防腐, 台风, 抗风, 木结构, 潮湿环境, 防潮, 长期维护]
      task_reframe: 这不是先做滨海民宿风格的问题，而是把盐雾、防腐、台风抗风、木结构安全、潮湿环境和长期维护排成可验证的滨海韧性链路。
      viability: 项目可以进入需求重构，但必须先确认结构、材料、节点、防腐体系和维护周期，不能只按普通民宿或普通技术空间展开。
      primary_risk: 头号风险是把海边景观当成卖点，却没有把盐雾腐蚀、台风荷载、潮湿变形和木结构维护前置为成立条件。
      key_forks: [结构抗风优先，还是材料防腐和维护便利优先？, 木结构是保留、局部替换，还是重建为更耐候的复合体系？, 防腐防潮靠材料选择、构造节点，还是运营维护制度共同完成？]
      unknowns: [滨海风压、盐雾等级和潮湿暴露程度尚未确认。, 木结构现状、节点做法和结构安全等级尚未确认。, 防腐体系、检修频率和长期维护责任尚未确认。]
      sections:
        - title: 滨海韧性链路
          body: 滨海木结构项目要先确认自然环境如何攻击建筑，再决定材料、构造和运营维护。
          items: [盐雾、防腐和潮湿环境会直接改变木材、金属连接件、涂层和外露节点策略。, 台风抗风不是单一结构参数，它会影响屋面、门窗、外廊、遮阳和临海开口方式。, 木结构安全需要把现状检测、节点加固、可替换构件和长期检修写进任务书。]
          emphasis: high
        - title: 维护与运营边界
          body: 滨海项目的长期成立取决于维护制度，而不只是一次性材料选择。
          items: [先确认哪些构件需要定期检查、涂装、防腐或替换。, 先确认运营方能否承担台风季前后巡检和维修停业成本。, 先确认景观开口、户外停留和防风防潮之间的取舍边界。]
          emphasis: medium
      slots:
        project_object: 滨海木结构项目
        core_tension: 滨海景观价值、盐雾防腐、台风抗风、木结构安全和长期维护之间的张力
        recommended_brief_focus: 先冻结盐雾防腐等级、抗风结构边界、木结构现状、节点策略和维护周期
    life_support_resilience:
      trigger_terms: [高海拔, 极寒, 供氧, 新风保温, 应急电力, 避难冗余, 低温运营, 生命支持, 空气循环, 保温, 低温]
      task_reframe: 这不是先做极寒民宿体验包装的问题，而是把稳定供氧、新风保温、应急电力、设备维护、避难冗余和低温运营排成可验证的生命支持链路。
      viability: 项目可以进入需求重构，但必须先确认生命支持系统、能源冗余、低温维护和应急避难边界，不能按普通民宿或实验室设备逻辑展开。
      primary_risk: 头号风险是把极寒和高海拔当成景观卖点，却没有把供氧、新风、保温、电力和应急冗余作为项目成立条件。
      key_forks: [稳定供氧优先，还是保温节能与能源冗余优先？, 新风、供氧和热负荷是否由同一套系统协同控制？, 避难冗余靠备用电力、物资储备，还是运营响应共同完成？]
      unknowns: [海拔、极端低温时长和入住峰值尚未确认。, 供氧方式、新风量、热负荷和备用电力容量尚未确认。, 设备维护周期、应急避难流程和运营值守方式尚未确认。]
      sections:
        - title: 生命支持链路
          body: 极寒高海拔项目要先确认人如何安全停留，再讨论空间体验和民宿氛围。
          items: [稳定供氧、新风和保温需要共同计算，不能把供氧设备当成后期附加项。, 应急电力、备用热源和设备维护会决定机房、管线、检修和运营值守边界。, 低温运营下的门斗、气密、结露、排风和物资储备会反向改变平面组织。]
          emphasis: high
        - title: 避难与运营冗余
          body: 极端气候项目必须把故障场景写入需求重构，而不是只描述正常营业状态。
          items: [先确认断电、供氧故障、暴雪封路或设备停机时的避难策略。, 先确认运营团队是否具备巡检、维护、救援联动和停业决策机制。, 先确认游客体验边界不能压过生命安全、能源冗余和维护可达性。]
          emphasis: medium
      slots:
        project_object: 极寒高海拔民宿
        core_tension: 供氧新风、保温能源、设备维护、避难冗余和低温运营之间的张力
        recommended_brief_focus: 先冻结供氧方式、新风保温、备用电力、设备维护和避难冗余边界
    power_infrastructure:
      trigger_terms: [弱电机房, UPS, 电力容量, 机柜散热, 网络布线, 检修通道, 消防联动, 配电, 弱电, 机柜]
      task_reframe: 这不是给展厅附加一个设备房的问题，而是把 UPS、电力容量、机柜散热、网络布线、检修通道和消防联动排成可维护的电力与弱电链路。
      viability: 项目可以进入需求重构，但必须先确认供配电容量、弱电架构、散热方式、消防联动和检修边界，不能只按普通展陈空间补一个机房。
      primary_risk: 头号风险是把弱电机房当成后台剩余面积，结果电力容量、散热、布线、检修和消防联动反向破坏展厅运营。
      key_forks: [电力容量优先，还是机柜散热和网络稳定优先？, 弱电机房是集中布置，还是与展项设备分散协同？, 检修通道、消防联动和展厅开放是否需要严格分离？]
      unknowns: [UPS 容量、机柜数量和网络设备清单尚未确认。, 散热方式、消防联动和配电容量尚未确认。, 检修频率、后台到达路径和展厅开放边界尚未确认。]
      sections:
        - title: 电力与弱电链路
          body: 展厅技术后台要先确认电力、弱电、散热和消防如何稳定协同，而不是只预留一间设备房。
          items: [UPS、电力容量和配电回路会决定机房面积、设备位置和备用电策略。, 机柜散热、网络布线和展项设备走线会反向改变吊顶、地面、墙体和检修路径。, 消防联动、安防和展厅开放时间会限制机房位置、门禁和后台到达方式。]
          emphasis: high
        - title: 检修与开放边界
          body: 技术后台必须可维护，同时不能打断展厅日常开放和观众动线。
          items: [先确认检修通道是否可以避开展厅主参观路径。, 先确认设备故障、网络中断和消防联动时的运营响应流程。, 先确认机房噪声、热量和权限管理是否影响展陈体验。]
          emphasis: medium
      slots:
        project_object: 展厅弱电机房
        core_tension: UPS 电力容量、机柜散热、网络布线、检修通道和消防联动之间的张力
        recommended_brief_focus: 先冻结 UPS 容量、机柜散热、网络布线、消防联动和检修边界
    laboratory_constraint:
      trigger_terms: [实验室, 样本接收, 洁净实验, 设备维护, 人员更衣, 废弃物处理, 生物科技实验室, 洁净区, 样本]
      task_reframe: 这不是单纯配置实验室设备的问题，而是把样本接收、洁净实验、设备维护、人员更衣和废弃物处理排成可验证的实验链路。
      viability: 项目可以进入需求重构，但必须先确认洁净等级、样本流线、人员更衣和废弃物处理边界，不能按普通办公室或普通设备间展开。
      primary_risk: 头号风险是只按房间名称排平面，忽略样本、人员、设备维护和废弃物之间的洁污冲突。
      key_forks: [样本接收和洁净实验是否需要完全分流？, 人员更衣、物料进入和废弃物处理是否共用后勤路径？, 设备维护是日常高频，还是低频但必须独立到达？]
      unknowns: [洁净等级、样本类型和实验风险等级尚未确认。, 人员更衣、物料进入和废弃物处理流程尚未确认。, 设备维护频率、尺寸和安全边界尚未确认。]
      sections:
        - title: 实验链路
          body: 实验室需求重构要先确认样本、人员、设备和废弃物如何流动，而不是只罗列房间名称。
          items: [样本接收和洁净实验之间要确认是否需要缓冲、传递窗或独立路径。, 人员更衣会改变入口、洁净区边界和非洁净区停留方式。, 设备维护如果穿越洁净实验区，会直接破坏实验链路和安全边界。]
          emphasis: high
        - title: 洁污边界
          body: 洁净、污染、维护和废弃物处理是这类项目的硬边界，必须先进入任务书。
          items: [废弃物处理路径需要与人员入口、样本接收和办公区分离。, 洁净实验区的等级、压差、材料和清洁制度会直接决定空间构造。, 设备维护、耗材补给和应急处理要有可达路径，不能依赖临时穿行。]
          emphasis: medium
      slots:
        project_object: 实验室
        core_tension: 样本流线、洁净实验、设备维护和废弃物处理之间的张力
        recommended_brief_focus: 先冻结洁净等级、样本流程、人员更衣和废弃物处理边界
  public_cultural_specialties:
    generic_exhibition:
      is_default_fragment: true
      trigger_terms: [展示馆, 展示, 展陈, 展厅, 展示空间, exhibition, pavilion, gallery]
      material_topic_terms: [有机, 可持续, 材料, 循环材质, 建材, 再生材料, 环保材料]
      material_topic_item: 有机、可持续或材料主题需要被转化为可验证的展陈证据，而不是借用农场或自然风格模板。
      task_reframe: 这不是先给{space_label}做展示包装的问题，而是叙事、互动、公众理解和运营维护能否共同成立。
      viability: 项目成立先看核心叙事是否清楚、公众路径是否顺畅、互动和安全边界是否可控。
      primary_risk: 头号风险是把展示馆做成概念堆叠，观众看完记不住关键判断，也无法建立信任。
      key_forks: [主要观众是政府访客、产业伙伴，还是普通公众？, 互动体验承担科普理解、品牌信任，还是招商洽谈？, 技术安全边界靠展项限制、人员管理，还是空间分区控制？]
      unknowns: [观众结构会改变信息密度和讲解方式。, 核心展项和互动装置清单会改变动线、设备和维护要求。, 安全边界和开放策略会改变参观深度。]
      sections:
        - title: 叙事路径
          body: 公共展陈类项目要先确认观众如何理解内容，而不是先堆展示形式。
          items: [技术、品牌或文化内容需要被组织成可进入、可停留、可复述的叙事路径。, 政府访客、产业伙伴和公众的理解深度不同，不能用同一套信息密度对待。, 核心展项、互动节点和洽谈停留点要分清主次，避免参观动线被信息量压垮。]
          emphasis: high
        - title: 互动边界
          body: 互动体验要先确认教育、传播、信任建立和安全边界的关系。
          items: [互动装置不能只追求热闹，应服务关键概念理解和品牌信任建立。, 技术安全、设备维护和人员管理会限制互动强度与开放程度。, 面向公众开放时，导视、排队、讲解和应急管理要先进入任务书。]
          emphasis: medium
      slots:
        project_object: 公共文化体验空间
        core_tension: 公众理解、互动体验、品牌信任与安全边界之间的张力
        recommended_brief_focus: 先冻结观众结构、叙事路径、互动边界和安全维护条件
      next_question: 这个展示馆首先服务政府访客、产业伙伴，还是普通公众理解
    community_culture_center:
      trigger_terms: [社区文化中心, 公共空间, 非遗手作, 居民活动, 临时展览, 公共讲座, 志愿者运营, 社区文化, 非遗活动]
      task_reframe: 这不是给社区文化中心做一套展示包装的问题，而是把非遗手作、居民活动、临时展览、公共讲座和志愿者运营排成可持续的社区文化秩序。
      viability: 项目可以进入需求重构，但要先确认居民参与、活动频率、志愿者管理和临时展览的切换规则。
      primary_risk: 头号风险是把社区文化中心做成泛展厅，结果非遗手作、居民活动、公共讲座和志愿者运营互相抢场地、抢收纳和抢管理资源。
      key_forks: [日常居民活动优先，还是临时展览和公共讲座优先？, 非遗手作是预约课程、开放体验，还是社区共创活动？, 志愿者运营承担导览、活动组织，还是日常维护？]
      unknowns: [活动频率、居民年龄结构和峰值人数尚未确认。, 非遗手作的材料、清洁、收纳和安全要求尚未确认。, 志愿者职责、开放时段和场地预约规则尚未确认。]
      sections:
        - title: 社区文化运营
          body: 社区文化中心需求重构要先确认活动如何被持续组织，而不是只把空间做成可观看的展厅。
          items: [非遗手作需要材料准备、操作台、清洁、晾置和作品展示的完整链路。, 居民活动、临时展览和公共讲座的声量、时长和家具模式不同，不能默认共享同一套布置。, 志愿者运营会改变服务台、储物、签到、导览和应急管理边界。]
          emphasis: high
        - title: 切换与维护
          body: 社区文化空间的难点是高频切换和低成本维护，而不是一次性主题表达。
          items: [先确认哪些活动需要预约，哪些活动日常开放，哪些活动只在节庆或周末发生。, 先确认临时展览、公共讲座和手作课程之间的家具、灯光和收纳切换规则。, 先确认志愿者、社区工作人员和外部讲师的权限与后台使用边界。]
          emphasis: medium
      slots:
        project_object: 社区文化中心
        core_tension: 非遗手作、居民活动、临时展览、公共讲座和志愿者运营之间的张力
        recommended_brief_focus: 先冻结活动组织、手作清洁收纳、展览讲座切换和志愿者运营边界
      next_question: 这个社区文化中心首先服务日常居民活动、非遗手作课程，还是临时展览和公共讲座
    collection_museum:
      trigger_terms: [博物馆, 美术馆, 收藏馆, 收藏家, 藏品, 限量藏品, 收藏墙, 藏品展示, 常设展, 专题展, 珍藏展厅, 限量鞋款, 品牌时间线]
      task_reframe: 这不是把藏品做成漂亮展墙的问题，而是让藏品保护、品牌历史叙事、公众参观和会员运营在同一套博物馆秩序里成立。
      viability: 项目可以进入需求重构，但必须先确认藏品保护等级、叙事路径和活动开放边界，不能只按普通展厅或硬约束参数推进。
      primary_risk: 头号风险是把博物馆做成好看的收藏陈列，结果恒温恒湿、安防、观看秩序和会员活动互相冲突。
      key_forks: [藏品保护优先，还是公众参观体验优先？, 品牌历史叙事靠时间线、代表藏品，还是主题章节组织？, 会员活动是深度讲解、社群运营，还是商业转化的一部分？]
      unknowns: [藏品数量、价值等级和轮换方式尚未确认。, 恒温恒湿、照度、防盗和保险要求尚未确认。, 公众开放强度、会员活动频率和讲解运营模式尚未确认。]
      sections:
        - title: 藏品保护
          body: 收藏型展陈首先要确认藏品保护等级，再决定展示密度、灯光、互动和会员活动。
          items: [限量藏品需要温湿度、照度、防尘、防盗和触碰边界共同控制，不能只看展柜造型。, 恒温恒湿会影响展柜、机电、后台维护和参观开放时长，应前置到任务书核心约束。, 藏品轮换、借展和保险要求会改变库房、修复、安防和人员管理边界。]
          emphasis: high
        - title: 展陈叙事
          body: 博物馆类需求重构要把藏品价值转成公众能理解的观看路径，而不是把收藏堆成陈列墙。
          items: [品牌历史、收藏谱系和代表性藏品要形成可进入、可停留、可复述的叙事顺序。, 公众参观和会员活动的信息密度不同，需要分清常设展、专题展和活动区的边界。, 商业会员活动可以增强运营，但不能破坏藏品安全、观看秩序和专业可信度。]
          emphasis: medium
      slots:
        project_object: 收藏博物馆
        core_tension: 藏品保护、展陈叙事、公众参观和会员运营之间的张力
        recommended_brief_focus: 先冻结藏品保护等级、叙事路径、开放策略和会员活动边界
    performance_heritage:
      trigger_terms: [昆曲, 故居, 老宅, 老房, 练声, 练声教学, 教学故居]
      task_reframe: 这不是先给公共文化体验空间做文化包装的问题，而是历史建筑、静态展陈、练声教学和小型交流能否在同一套保护与运营边界内成立。
      viability: 项目成立先看保护边界、声学干扰、展陈节奏和教学运营能否被同时控制。
      primary_risk: 头号风险是把昆曲老宅做成主题化展厅，实际却无法承接练声教学、讲解停留和运营维护。
      key_forks: [练声教学和静态展陈是否同时发生？, 老宅结构、院落、门窗和旧物哪些必须保留？, 访客参观、学员上课和小型交流是否共用入口与候场区？]
      unknowns: [保护等级和可改造边界会改变所有空间判断。, 练声人数、频率和声压会改变隔声、吸声和空间距离。, 展陈内容和课程模式会改变动线、灯光和收纳配置。, 消防、疏散和机电条件会决定老宅是否能承接公共开放。]
      sections:
        - title: 动静分区
          body: 昆曲教学和故居展陈的矛盾不在风格，而在声音、停留和参观节奏是否互相干扰。
          items: [练声教学需要可控的声学反馈，静态展陈需要稳定的观看秩序，两者不能只靠软装遮挡解决。, 小型交流区如果承担候场、讲解和社交，会反向改变入口、停留点和展陈动线。, 教学时段、参观时段和活动时段是否重叠，会决定空间是分区隔离还是分时复用。]
          emphasis: high
        - title: 保护边界
          body: 老宅改造要先确认哪些结构、界面和历史线索不能被动，而不是先决定视觉风格。
          items: [结构、消防、给排水和机电走线的可改造程度，会直接限制教学、展陈和运营方案。, 可保留的旧物、尺度、门窗和院落关系，应进入叙事线索，而不是被后期装饰替代。, 如果保护边界不清，任何关于声学、灯光和展陈的判断都只能停留在框架层。]
          emphasis: high
        - title: 文化转译
          body: 昆曲主题不能只变成符号陈列，应先落到学习、观看、聆听和交流的行为组织。
          items: [展陈内容、教学体验和小型演示应形成互相解释的序列，而不是三套互不相干的房间。, 视觉系统应服务导览、课程和品牌识别，避免把昆曲元素变成表面纹样。, 面向游客、学员、教师和运营人员的路径差异，会改变任务书的优先级。]
          emphasis: medium
      slots:
        project_object: 昆曲教学故居
        core_tension: 历史保护、静态展陈、练声教学与公共运营之间的张力
        recommended_brief_focus: 先冻结保护边界、声学干扰、展陈教学时段和访客路径
      next_question: 昆曲练声教学、静态展陈和小型交流是否需要在同一时段同时发生
    farm_learning_center:
      trigger_terms: [市民农场, 农场, 农产品, 亲子厨房, 咖啡区, 农事, 科普教育]
      product_anchor_terms: [农产品, 农货, 生鲜, 农户直供, 产地直供]
      anchor_missing_postprocess:
        anchor_terms_key: product_anchor_terms
        replacement_key: anchor_missing_replacements
      anchor_missing_replacements:
        农产品展示: 配套展示
        农产品SKU和冷链要求: 展示品类、储藏要求
        农产品SKU: 展示品类
        冷链要求: 储藏要求
        生鲜补货: 后勤维护
        农户直供: 临时零售
        农产品结账: 展示停留
        补货动线: 维护动线
        冷链: 储藏
        SKU: 品类
        补货: 维护
      task_reframe: 这不是给公共文化体验空间叠加自然风格和环保材料的问题，而是公共参观、亲子活动、科普教育、零售休憩和后勤维护能否在同一套场地秩序中互不干扰。
      viability: 项目成立先看公共教育、亲子体验、农产品展示和咖啡休憩能否形成稳定的运营秩序。
      primary_risk: 头号风险是把有机、自然和可持续做成视觉表演，实际却增加清洁、维护和人流管理成本。
      key_forks: [亲子厨房与科普教育是预约制课程，还是低门槛开放体验？, 农产品展示是标准化包装零售，还是包含生鲜和农户直供？, 咖啡区是访客配套、家长等候节点，还是独立对外经营单元？]
      unknowns: [峰值访客量会改变入口、洗手、厕所和安全容量判断。, 农产品SKU和冷链要求会改变后勤仓储与补货动线。, 亲子课程强度会改变清洁、收纳和人员看护配置。, 室外农场体验与室内访客中心的衔接会改变材料耐候等级。]
      sections:
        - title: 公共体验
          body: 访客中心要先确认人群、停留时长和洁污边界，再组织展示、教育和消费配套。
          items: [亲子厨房和科普教育属于高参与、慢停留、易脏污的活动，应与农产品展示和咖啡休憩形成清晰分区。, 咖啡区在这里首先是陪伴、等候和视线看护节点，不应反向主导整个项目的商业效率判断。, 农产品展示需要区分常温陈列、生鲜补货和品牌叙事，避免公共参观动线被后勤穿透。]
          emphasis: high
        - title: 材料循环
          body: 可持续不应停留在自然符号，而要落到可替换、可清洁、可维护的构造机制。
          items: [材料循环策略应优先设计可拆卸展架、可替换墙面和耐高频清洗的地面系统。, 亲子与农事体验区的材料要承受泥水、潮湿、儿童碰撞和季节性高峰，而不是追求脆弱的原生态质感。, 品牌视觉系统可围绕农事日历、作物生长周期和在地生态叙事建立可持续更新的内容框架。]
          emphasis: medium
        - title: 教育互动
          body: 教育模块要先确定是预约课程、自由探索还是团体导览，不同模式会改变空间密度。
          items: [预约制课程需要独立收纳、清洁、等候和安全看护边界。, 自由探索模块更依赖低维护互动装置和清晰导视，避免工作人员高强度补位。, 团体导览需要可聚集的讲解点，不能与咖啡排队、农产品结账和儿童活动入口冲突。]
          emphasis: medium
      slots:
        project_object: 公共文化体验空间
        core_tension: 公共教育、亲子体验、生态叙事与运营维护之间的张力
        recommended_brief_focus: 先冻结访客结构、亲子科普模式、材料循环边界和后勤动线
      next_question: 亲子厨房与科普教育是预约制课程，还是低门槛开放体验
    library_reading:
      trigger_terms: [图书馆, 儿童阅读, 亲子阅读, 绘本, 绘本活动, 借阅, 借阅管理, 安静学习, 阅读区]
      task_reframe: 这不是给社区图书馆儿童阅读区做展示包装的问题，而是把亲子阅读、绘本活动、安静学习和借阅管理排成可持续运营的阅读秩序。
      viability: 项目可以进入需求重构，但要先确认活动声量、借阅管理和安静学习之间的边界。
      primary_risk: 头号风险是把儿童阅读区做成热闹主题空间，结果绘本活动、亲子陪伴、安静学习和借阅管理互相干扰。
      key_forks: [亲子阅读和绘本活动是预约制活动，还是日常开放场景？, 安静学习区需要完全隔离，还是允许与儿童阅读形成渐变边界？, 借阅管理、还书和活动签到是否共享同一服务节点？]
      unknowns: [儿童年龄段、陪伴人数和活动频率尚未确认。, 馆藏规模、借阅方式和归还流程尚未确认。, 安静学习、亲子活动和普通借阅的峰值时段尚未确认。]
      sections:
        - title: 阅读秩序
          body: 图书馆阅读区需求重构要先判断阅读、活动、安静学习和借阅管理如何共存，而不是套公共展陈模板。
          items: [亲子阅读和绘本活动是高互动、慢停留场景，需要与安静学习形成声量和视线边界。, 借阅管理会改变入口、书架、服务台和归还动线，不能只作为后勤问题处理。, 儿童阅读区要兼顾儿童尺度、陪伴看护、活动收纳和安全材料，而不是只做主题化装饰。]
          emphasis: high
        - title: 学习与活动边界
          body: 公共阅读空间的关键是把开放活动和安静学习排成可管理的日常秩序。
          items: [绘本活动是预约课程、临时活动，还是日常自由阅读，会改变家具可变性。, 安静学习区需要确认噪声、照明、座位密度和陪伴人员停留方式。, 借阅、还书、活动签到和家长等候是否共用入口，会决定导视和管理强度。]
          emphasis: medium
      slots:
        project_object: 社区图书馆儿童阅读区
        core_tension: 亲子阅读、绘本活动、安静学习和借阅管理之间的张力
        recommended_brief_focus: 先冻结阅读活动模式、声量边界、借阅管理和儿童安全尺度
  urban_renewal_specialties:
    district_renewal:
      trigger_terms: [城市更新, 街区更新, 老旧街区, 旧城, 老城, 历史街区, 原住民, 存量商户, 分期实施, 社区商业, 片区焕新]
      task_reframe: 这不是单纯改造老旧街区的问题，而是把原住民生活、社区商业、公共活动、历史界面和分期实施重新排成可协商的更新秩序。
      viability: 项目可以进入需求重构，但要先明确利益相关方、保留边界和分期路径，不能直接按商业包装或文化研究推进。
      primary_risk: 头号风险是把街区更新做成短期消费景观，忽略原住民生活、存量商业和长期治理成本。
      key_forks: [原住民生活、社区商业和外来访客谁先定义街区秩序？, 历史界面是严格保留、局部更新，还是转译为新商业语言？, 先做基础设施、样板段试运营，还是直接整体招商改造？]
      unknowns: [原住民留驻比例、商户结构和产权关系尚未确认。, 历史界面保护等级、消防交通和市政条件尚未确认。, 分期资金、运营主体和试运营周期尚未确认。]
      sections:
        - title: 利益相关方
          body: 城市更新不是单一空间改造题，必须先确认原住民、商户、访客、运营方和管理方之间的利益边界。
          items: [原住民生活不能只作为历史氛围素材，它会决定保留、迁改、噪声和日常服务底线。, 社区商业需要兼顾存量商户、新业态导入和公共活动，不宜只按招商逻辑推进。, 公共活动、游客停留和居民日常如果没有边界，会把街区更新推成短期消费景观。]
          emphasis: high
        - title: 分期实施
          body: 街区更新的关键不是一次性画完整蓝图，而是判断哪些动作可以先做、哪些动作必须等待共识和条件成熟。
          items: [历史界面保留、基础设施改善和商业导入的先后顺序会改变成本与阻力。, 试运营、临时活动和样板段可以验证人流、消费和居民接受度。, 分期边界应避免前期改造破坏后续交通、消防、招商和社区治理空间。]
          emphasis: medium
      slots:
        project_object: 城市更新项目
        core_tension: 原住民生活、社区商业、公共活动、历史保留和分期实施之间的张力
        recommended_brief_focus: 先冻结利益相关方、保护边界、运营机制和分期实施路径
  secondary_candidates:
    commercial_operation:
      title: 商业运营边界
      body: 次候选出现商业运营时，任务书不能只写体验叙事，还要确认经营动作会不会反向改变空间组织。
      items: [确认售卖、排队、等候和收银是否进入公共体验动线。, 确认商业收入是主目标、配套服务，还是只承担停留激活功能。, 确认运营高峰是否会挤压展陈、活动或公共使用。]
      emphasis: medium
    hard_constraint:
      title: 硬约束边界
      body: 次候选出现硬性约束时，应先把设备、消防、结构、机电或卫生边界列入需求重构，而不是后期补丁。
      items: [确认哪些约束会直接改变平面、层高、动线或材料选择。, 确认约束是已知参数、待测参数，还是需要专项顾问确认。, 确认硬约束与体验目标冲突时谁拥有优先级。]
      emphasis: medium
    media_production:
      title: 内容生产边界
      body: 次候选出现内容生产时，空间不只服务现场使用，还要确认镜头、声光、收纳和切换效率。
      items: [确认哪些区域必须为拍摄、直播或录制保持可控背景。, 确认灯光、声学、设备和布线是否会改变日常使用。, 确认内容生产与真实运营同时发生时的切换规则。]
      emphasis: medium
    style_semantics:
      title: 语义表达边界
      body: 次候选出现风格语义时，不应直接套视觉标签，而要先拆解哪些符号、材料和比例真正支撑项目立场。
      items: [确认关键词是文化语义、品牌识别，还是用户审美偏好。, 确认哪些符号可以被转译，哪些会造成表面化误读。, 确认表达强度是否会压过功能、运营或公共使用。]
      emphasis: medium
    public_cultural_experience:
      title: 公共体验边界
      body: 次候选出现公共文化体验时，要确认公众如何进入、理解、停留和被管理，而不是只补一个展示区。
      items: [确认访客、居民、会员或员工是否共享同一套动线。, 确认教育、展陈、活动和休息谁是公共体验主线。, 确认开放程度、管理边界和安全责任。]
      emphasis: medium
    life_identity:
      title: 生活身份边界
      body: 次候选出现生活身份时，任务书要校准真实使用者的长期生活，而不是只保留项目的形象目标。
      items: [确认日常居住、家庭关系、工作身份或精神寄托谁是底盘。, 确认使用者画像是否会改变私密、接待和维护边界。, 确认项目表达是否会牺牲长期生活韧性。]
      emphasis: medium
    cultural_research:
      title: 研究证据边界
      body: 次候选出现文化研究时，应先判断哪些文化判断需要证据支撑，避免把未经验证的转译写成结论。
      items: [确认研究对象是历史事实、地域材料、人物线索，还是方法论借鉴。, 确认哪些内容需要案例、文献或田野证据再进入设计任务书。, 确认研究深度是否会推迟正式方案生成。]
      emphasis: medium

