      key_forks: [评估室先导，还是器械训练效率先导？, 物理治疗、主动训练和休息恢复是否需要连续路径？, 家属等候是陪同观察，还是与训练区明确分离？]
      unknowns: [康复人群类型、训练强度和治疗师配置尚未确认。, 器械清单、轮椅/助行器比例和安全看护方式尚未确认。, 家属陪同制度、等候停留时间和无障碍动线宽度尚未确认。]
      sections:
        - title: 康复训练链路
          body: 康复中心的关键不是先罗列器械，而是把评估、治疗、训练、等候和无障碍动线组织成渐进恢复路径。
          items: [评估室决定用户从身体状态判断到训练计划生成的第一步是否稳定。, 物理治疗和器械训练需要区分安静治疗、主动训练、辅助转移和安全看护。, 家属等候与无障碍动线会影响陪同、观察、休息和转移动作是否互相干扰。]
          emphasis: high
        - title: 安全与恢复边界
          body: 康复训练空间的安全不是单一无障碍参数，而是训练强度、人员辅助和突发风险的综合边界。
          items: [先确认评估、治疗、器械训练和休息恢复是否需要连续动线。, 先确认轮椅、助行器、担架或家属陪同会不会在高峰时交叉拥堵。, 先确认哪些区域需要治疗师近距离看护，哪些区域可以独立训练。]
          emphasis: medium
      slots:
        core_tension: 评估治疗、器械训练、无障碍安全和家属陪同之间的张力
        recommended_brief_focus: 先冻结康复训练链路、人员辅助方式、器械配置和无障碍安全边界
  hospitality_specialties:
