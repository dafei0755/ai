        core_tension: 家庭关系、生活节奏和空间表达之间的张力
        recommended_brief_focus: 先冻结使用者支持、家庭恢复、安全边界和日常动线
      next_question: 这个住宅最先要解决生活节奏、家庭关系，还是隐私和安全边界
  healthcare_specialties:
    dental_clinic:
      trigger_terms: [牙科, 口腔, 诊疗椅, 拍片室, 消毒室, 候诊, 儿童安抚, 种植牙, 种植牙手术间, 洁牙区, 器械清洗, 影像检查]
      task_reframe: 这不是单纯改造医疗空间的问题，而是把前台接待、候诊、诊疗椅、消毒室、拍片室和儿童安抚重构成一条可运营的牙科诊疗链路。
      viability: 项目可以进入需求重构，但必须先确认诊疗流程、洁污边界、设备房间和患者安抚优先级，不能按普通照护空间或普通门店逻辑展开。
      primary_risk: 头号风险是只改善等候体验，却没有处理诊疗椅周转、拍片动线、器械消毒和儿童安抚之间的硬冲突。
      key_forks: [前台接待和候诊优先，还是诊疗椅周转效率优先？, 拍片室、消毒室和诊疗椅之间是否需要独立洁污回路？, 儿童安抚是独立区域，还是嵌入候诊和诊疗沟通流程？]
      unknowns: [诊疗椅数量、医生排班和单次诊疗时长尚未确认。, 拍片频率、消毒室工作方式和器械回收路径尚未确认。, 儿童患者占比、陪同人数和安抚方式尚未确认。]
      sections:
        - title: 诊疗链路
          body: 牙科诊所首先要把接待、候诊、拍片、诊疗、消毒和安抚串成稳定流程，而不是套用泛医疗照护逻辑。
          items: [前台接待和候诊区决定患者到达后的焦虑缓冲与分诊效率。, 诊疗椅、拍片室和消毒室需要形成清晰的诊疗链路，避免洁污、等待和设备使用互相打架。, 儿童安抚不是装饰主题，而是会改变等候、陪同、诊疗沟通和动线停顿的实际变量。]
          emphasis: high
        - title: 洁污与安抚边界
          body: 口腔医疗的关键不是把空间做得更温和，而是让洁污边界、设备节奏和患者情绪同时成立。
          items: [先确认消毒室、拍片室和诊疗椅之间是否需要独立回路或半独立回路。, 先确认儿童患者、成人患者和陪同家属是否共用候诊区。, 先确认前台、候诊和诊疗区之间的信息可见性与隐私边界。]
