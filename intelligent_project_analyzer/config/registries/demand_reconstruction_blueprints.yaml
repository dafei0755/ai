version: "v1.0"
description: >
  需求重构规则蓝图碎片 registry。这里保存可被 LLM Semantic Router 检索和约束的稳定结构资产，
  不再与方案高参通用语义轴 registry 混放。

demand_reconstruction_blueprint_fragments:
  research_phrase_extractors:
    cultural_research:
      subject_start_terms: [研究]
      subject_end_markers: [对, 如何影响, 如何启发, 启发]
      target_start_marker: 对
      target_end_markers: [的启发, 的影响, 如何, ，, ",", 。, ；, ";"]
  subject_phrase_mapping:
    default: 使用者
    text_rules:
      - all_terms: [设计师]
        any_terms: ["50", 50岁]
        label: 50岁专业设计师
      - all_terms: [设计师]
        label: 专业设计师
      - all_terms: [业主]
        label: 业主
    axis_rules:
      - subject_profiles: [elderly_users, elderly, senior, aging_users]
        label: 老年使用者
      - subject_profiles: [children, children_family, child_family]
        label: 儿童与家庭成员
      - subject_profiles: [family, family_multi_generation, multi_generation]
        label: 家庭成员
      - subject_profiles: [founder_owner, owner_operator, entrepreneur]
        label: 创始人业主
      - subject_profiles: [professional_user, design_professional, professional]
        label: 专业使用者
      - subject_profiles: [public_users, community_users, visitors]
        label: 公众使用者
  primary_archetypes:
    style_semantics:
      task_reframe: 这不是寻找风格标签的问题，而是把模糊审美词拆成可控制、可验证、可执行的空间语义边界。
      viability: 项目成立先看语义边界能否被收住，再看材料、形式和图像参考是否匹配。
      primary_risk: 头号风险是用风格词替代空间判断，最后得到一套看似统一但无法指导使用、材料和运营的氛围包装。
      key_forks: [东方感来自文化母题、空间比例，还是材料触感？, 不老气是减少符号，还是提升构造和光线的现代性？, 茶空间主要服务独处、社交、零售展示还是接待？]
      unknowns: [目标客群会改变表达强度。, 茶空间使用方式会改变停留机制。, 已有品牌或场地条件会改变可用语义。]
      sections:
        - title: 语义边界
          body: 风格需求重构要先防止词语滑向符号堆叠。
          items: [“东方感”需要拆成比例、光线、材质、留白或仪式感中的具体来源。, “不老气”通常不是去掉传统元素，而是控制符号密度和材料年代感。, 茶空间还要判断是社交、独处、展示，还是生活方式消费。]
          emphasis: high
        - title: 表达禁区
          body: 需求重构会明确哪些表达方式必须先被排除，避免审美词直接变成图像拼贴。
          items: [直接堆中式符号，容易让东方感变成仿古感。, 只追求极简，可能丢掉茶空间应有的停留层次。, 只看参考图，会掩盖真实使用、品牌调性和维护边界。]
          emphasis: medium
      slots:
        core_tension: 文化语义与现代使用之间的张力
        recommended_brief_focus: 优先冻结风格边界、使用场景和符号禁区
    commercial_operation:
      task_reframe: 这不是先给{space_label}做风格包装的问题，而是先确认商业模型、顾客路径、服务方式和运营边界能否共同成立。
      viability: 项目可以进入需求重构，但需要先确认收入机制、客群路径和运营责任，再决定空间表达。
      primary_risk: 头号风险是用某个熟悉业态的模板替代真实商业模型，导致动线、服务和后台边界一开始就错位。
      key_forks: [项目首先靠高频交易、低频高客单，还是品牌信任建立成立？, 顾客路径优先服务转化、停留、展示，还是服务效率？, 运营压力主要来自人流、人员服务、库存补给，还是活动管理？]
      unknowns: [核心客群、客单价和访问频率尚未确认。, 前场展示、后台补给和人员服务边界尚未确认。, 高峰时段、活动频率和运营维护方式尚未确认。]
      sections:
        - title: 商业成立方式
          body: 商业类需求重构要先确认项目靠什么成立，而不是直接把所有商业空间都写成单一业态的效率问题。
          items: [确认收入来自高频交易、低频高客单、会员复购，还是品牌信任建立。, 确认空间首先解决转化、停留、展示、服务，还是运营效率。, 确认经营模型会不会反向改变入口、动线、收纳和人员配置。]
          emphasis: high
        - title: 运营边界
          body: 没有命中特定商业碎片时，需求重构应先保持中性，避免把项目错写成餐饮、零售或展陈单一模板。
          items: [先确认顾客进入、停留、咨询、成交和离开的完整路径。, 先确认前场展示、后台补给、人员服务和维护管理是否互相穿越。, 先确认高峰压力来自人流、服务、库存、设备，还是品牌活动。]
          emphasis: medium
      slots:
        project_object: 商业空间
        core_tension: 商业模型、顾客路径、服务方式和运营边界之间的张力
        recommended_brief_focus: 先冻结商业模型、客群路径、服务边界和运营维护方式
      next_question: 这个商业空间首先靠高频交易、低频高客单、会员复购，还是品牌信任建立成立
    public_cultural_experience:
      task_reframe: 这不是先给{space_label}做展示或活动包装的问题，而是先确认公共文化空间如何同时承接人群、内容、停留和开放管理。
      viability: 项目可以进入需求重构，但要先确认核心受众、内容理解路径、活动组织和开放责任是否能共同成立。
      primary_risk: 头号风险是把公共文化项目写成单一展示或单一活动空间，忽略不同人群、内容深度、运营维护和安全边界之间的冲突。
      key_forks: [核心受众是公众、居民、学生、会员还是专业访客？, 空间首先服务内容理解、教育互动、公共停留还是运营活动？, 开放程度、安全责任和维护强度谁先决定空间边界？]
      unknowns: [受众结构会改变内容深度和动线组织。, 活动频率会改变家具、收纳、声学和管理责任。, 开放策略会改变安全、导视和人员配置。]
      sections:
        - title: 公共成立边界
          body: 公共文化类需求重构要先确认谁进入、为什么停留、如何理解内容，以及开放管理责任由谁承担。
          items: [确认核心受众是公众、专业访客、居民、学生、会员，还是合作伙伴。, 确认空间首先服务展陈理解、教育互动、公共停留、品牌信任，还是运营活动。, 确认开放程度、安全责任、维护强度和人员管理是否支撑公共使用。]
          emphasis: high
        - title: 内容与运营边界
          body: 默认公共文化蓝图应保持中性底盘，只在有证据时再命中更具体的展陈、社区、博物馆或非遗活动片段。
          items: [先确认内容由谁维护，更新周期和展示深度如何决定。, 先确认活动是日常开放、预约制，还是阶段性策展。, 先确认管理、导视、排队、应急和清洁维护责任。]
          emphasis: medium
      slots:
        project_object: 公共文化空间
        core_tension: 公共理解、教育互动、开放运营和安全维护之间的张力
        recommended_brief_focus: 先冻结受众结构、内容理解、活动组织、开放管理和安全维护边界
      next_question: 这个公共文化空间首先服务内容理解、教育互动，还是日常公共停留和运营活动
    life_identity:
      task_reframe: 这不是先给{space_label}贴上生活风格或身份标签的问题，而是先判断{owner_profile}的真实生活秩序、家庭关系、照护需求和精神寄托如何同时成立。
      viability: 项目可以进入需求重构，但必须先确认真实使用者、长期生活强度、隐私与接待边界、以及身份表达能否服务真实生活。
      primary_risk: 头号风险是把生活身份类项目写成单一风格叙事或住宅表达，忽略真实生活、家庭成员、维护能力和安全边界之间的长期冲突。
      key_forks: [真实生活优先，还是身份表达优先？, 私密恢复优先，还是接待和展示优先？, 家庭关系是稳定底盘，还是需要被空间重新调和？]
      unknowns: [真实使用者和日常居住频率尚未确认。, 家庭成员、照护责任和隐私等级尚未确认。, 身份表达和长期维护能力之间的边界尚未确认。]
      sections:
        - title: 生活身份底盘
          body: 生活身份类需求重构要先确认真实使用者如何生活、恢复、照护和长期维护，而不是直接套身份叙事或住宅风格。
          items: [确认日常居住、照护支持、家庭关系、工作身份或精神寄托谁是底盘。, 确认使用者画像是否会改变私密、接待、恢复和安全边界。, 确认空间表达是否会牺牲长期生活韧性、维护能力或家庭成员的真实需求。]
          emphasis: high
      slots:
        project_object: 生活身份类空间
        core_tension: 生活真实性与身份表达之间的张力
        recommended_brief_focus: 先冻结真实使用者、生活频率、家庭关系和身份表达边界
      next_question: 这个{space_label}更应优先服务谁的日常生活，以及哪一种身份表达不能压过真实使用？
    media_production:
      task_reframe: 这不是先给{space_label}做布景或视觉主题的问题，而是先确认内容如何被策划、拍摄、直播、录制、管理和复盘。
      viability: 项目可以进入需求重构，但要先确认内容生产模式、设备与声光网络条件、真实使用与镜头呈现的切换规则。
      primary_risk: 头号风险是把媒体生产空间写成单一视觉包装，忽略拍摄节奏、设备收纳、声光控制、人员协作和后期复盘的真实成本。
      key_forks: [镜头呈现优先，还是真实使用效率优先？, 内容生产是单一模式，还是直播、拍摄、录制并行？, 设备、灯光、声学和收纳哪个最先改变平面组织？]
      unknowns: [内容类型和生产频率尚未确认。, 设备、灯光、声学、网络和布线要求尚未确认。, 现场运营与镜头管理是否同时发生尚未确认。]
      sections:
        - title: 内容生产底盘
          body: 媒体生产类需求重构要先确认内容如何被策划、拍摄、直播、录制、管理和复盘，而不是先做布景或视觉主题。
          items: [确认核心内容是直播、短视频、录制、拍摄、内容策划，还是多种模式并行。, 确认设备、灯光、声学、网络、收纳和人员协作是否会改变平面组织。, 确认内容生产与真实运营同时发生时的切换规则和管理责任。]
          emphasis: high
      slots:
        project_object: 媒体内容生产空间
        core_tension: 镜头呈现与真实生产效率之间的张力
        recommended_brief_focus: 先冻结内容生产模式、声光设备条件和场景切换规则
      next_question: 这个{space_label}首先要服务哪一种内容生产，以及哪些声光设备条件会改变平面组织？
    hard_constraint:
      task_reframe: 这不是把{space_label}的技术问题放到后期深化阶段再解决，而是先判断哪些硬性条件会直接决定项目能否成立。
      viability: 项目可以进入需求重构，但必须先确认法规、安全、结构、机电、环境控制或无障碍中哪些是不可突破的成立边界。
      primary_risk: 头号风险是把硬性约束当成后期技术补丁，等方案成型后才发现平面、层高、动线、材料或预算已经被重写。
      key_forks: [哪个约束是不可突破的成立边界？, 哪些参数已经确定，哪些需要专项顾问或检测？, 硬约束与体验目标冲突时谁拥有优先级？]
      unknowns: [已确定的技术参数和待测参数尚未区分。, 是否需要消防、结构、机电、声学或无障碍专项顾问尚未确认。, 硬约束与预算、工期、体验目标的冲突边界尚未确认。]
      sections:
        - title: 技术成立边界
          body: 硬性约束类需求重构要先确认哪些条件会决定项目能否成立，而不是把技术问题后置成深化阶段补丁。
          items: [确认法规、安全、结构、机电、环境控制或无障碍中哪些是不可突破条件。, 确认哪些参数已经确定，哪些需要专项顾问、检测或设备清单才能判断。, 确认硬约束与体验目标冲突时，谁拥有优先级和决策权。]
          emphasis: high
      slots:
        project_object: 硬性约束类项目
        core_tension: 硬性成立边界与体验目标之间的张力
        recommended_brief_focus: 先冻结不可突破条件、待测参数和专项顾问分工
      next_question: 这个{space_label}里哪一个硬性约束会最先改变平面、层高、动线或材料决策？
    general_project:
      task_reframe: 这个问题还处在前结构化阶段，关键是先把真实目标、使用者和约束条件分清。
      viability: 当前已有项目苗头，但还不足以直接冻结设计任务书。
      primary_risk: 头号风险是过早给方案，掩盖真正决定项目方向的未知条件。
      key_forks: [目标优先级, 使用者结构, 场地与资源边界]
      unknowns: [空间对象, 使用方式, 预算与落地条件]
      sections:
        - title: 先抓变量
          body: 当前还不能直接进入方案，应先把影响判断的变量排出来。
          items: [使用者是谁会影响后续任务书的目录重心。, 项目为什么成立会影响后续任务书的目录重心。, 哪些条件会改变判断会影响后续任务书的目录重心。]
          emphasis: medium
      slots:
        core_tension: 模糊目标与可执行项目定义之间的张力
        recommended_brief_focus: 先补齐项目对象、目标和约束
    healthcare_care:
      task_reframe: 这不是单纯改造医疗照护空间的问题，而是把患者尊严、家属陪伴、医护效率和感染控制重新排成可执行的照护秩序。
      viability: 项目可以进入需求重构，但必须先确认医疗安全边界和照护行为优先级，不能直接按普通住宿或住宅逻辑展开。
      primary_risk: 头号风险是把安静、温暖或人文关怀当成装饰语，忽略医护观察、感染控制和陪伴支持之间的硬冲突。
      key_forks: [患者尊严优先，还是医护观察效率优先？, 家属陪伴是短暂停留、过夜陪护，还是情绪支持空间？, 感染控制、洁污分流和安静休息哪一个会最先改变平面？]
      unknowns: [床位或服务单元数量、陪护人数和探视制度尚未确认。, 医护观察方式、呼叫系统和设备介入程度尚未确认。, 感染控制等级、洁污路径和可消杀材料边界尚未确认。]
      sections:
        - title: 照护秩序
          body: 医疗照护空间首先不是风格问题，而是患者、家属和医护三条行为线能否同时成立。
          items: [患者尊严需要安静、隐私、可呼叫和被观察之间取得平衡。, 家属陪伴需要停留、收纳、休息和情绪缓冲位置。, 医护观察需要把可达性、视线、应急和夜间工作纳入空间组织。]
          emphasis: high
        - title: 安全边界
          body: 感染控制、洁污分流和设备介入会直接改变房间尺度与动线，不应放到后期补丁处理。
          items: [先确认洁污路径、探视路径和医护路径是否会交叉。, 先确认哪些空间必须可消杀，哪些区域要降低医疗感。, 先确认观察、陪护和安静休息之间的优先级。]
          emphasis: medium
      slots:
        core_tension: 患者尊严、家属陪伴、医护观察和感染控制之间的张力
        recommended_brief_focus: 先建立照护行为、医疗安全和情绪支持的任务书框架
    cultural_research:
      task_reframe: 这不是可以直接给{target_space}空间灵感的题，而是需要先建立{research_subject}的文化、行为和场景证据。
      viability: 当前适合生成研究路径，不适合把未经验证的文化判断直接写成空间结论。
      primary_risk: 头号风险是把{research_subject}直接装饰化，导致{target_space}看似有文化来源，却没有行为依据和证据边界。
      key_forks: [研究目标是文化解释、空间转译，还是汇报论证？, 使用证据来自文献、案例、图像，还是当代行为观察？, "{target_space}更重日常使用、公共停留，还是商业/运营转化？"]
      unknowns: [证据来源会改变结论可靠性。, "{target_space}使用方式会改变可转译变量。", 输出用途会决定研究深度。]
      sections:
        - title: 研究对象边界
          body: 文化研究类需求重构要先明确研究对象、证据层级和可转译范围。
          items: ["需要确认{research_subject}中的人物、活动、空间和礼仪结构。", 需要区分可转译的行为机制和不可直接借用的文化符号。, 没有证据时，最多提出假设，不能输出确定设计依据。]
          emphasis: high
        - title: 转译证据
          body: 这些缺口决定是否应进入深度研究，以及能否回填到任务书。
          items: [原始文本、图像、案例或可靠二手研究来源。, "{research_subject}的行为结构与空间组织证据。", "{target_space}的目标客群与使用场景。"]
          emphasis: medium
      slots:
        core_tension: 文化证据与当代空间转译之间的张力
        recommended_brief_focus: 先进入深度研究，再决定是否回填任务书
  style_specialties:
    wabi_sabi_relaxation:
      trigger_terms: [侘寂, 松弛感, 破旧, 廉价, 民宿接待区, 入住等候, 拍照打卡, 材料耐维护]
      task_reframe: 这不是把民宿接待区做成侘寂风格的问题，而是松弛感、入住等候、拍照打卡和材料耐维护能否被同一套空间语义控制住。
      viability: 项目可以进入需求重构，但要先确认侘寂表达的边界、接待运营和材料维护强度，不能只按参考图复制粗粝质感。
      primary_risk: 头号风险是把侘寂和松弛感做成破旧、廉价或难维护的表面质感，反而削弱民宿接待的信任感。
      key_forks: [侘寂来自材料时间感、留白比例，还是低照度氛围？, 松弛感服务入住等候、拍照打卡，还是长期停留？, 材料耐维护优先，还是更强的粗粝手作感优先？]
      unknowns: [入住等候时长和高峰人数尚未确认。, 拍照打卡是否是核心传播动作尚未确认。, 材料耐磨、清洁和维修周期尚未确认。]
      sections:
        - title: 松弛感边界
          body: 侘寂和松弛感要先被拆成比例、光线、材质和使用节奏，而不是直接套旧木、灰墙或低饱和图片。
          items: [民宿接待区需要建立抵达后的信任感，不能让粗粝质感被误读为破旧或廉价。, 入住等候、拍照打卡和前台服务对明暗、停留点和视线焦点的要求不同。, 侘寂表达应控制在可维护、可清洁、可更新的材料边界内。]
          emphasis: high
        - title: 维护与传播
          body: 接待区既是运营节点，也是传播界面，材料和造型必须能承受高频使用。
          items: [先确认哪些界面承担拍照传播，哪些界面承担行李、等候和服务摩擦。, 先确认低照度、旧化肌理和自然材料是否会影响清洁、耐污和维修。, 先确认松弛感来自空间节奏，而不是降低接待效率或导视清晰度。]
          emphasis: medium
      slots:
        project_object: 民宿接待区
        core_tension: 侘寂松弛感、入住等候、拍照打卡和材料耐维护之间的张力
        recommended_brief_focus: 先冻结侘寂表达边界、入住等候、拍照传播和材料维护规则
      next_question: 这个民宿接待区的松弛感首先服务入住等候、拍照传播，还是长期停留体验
  life_identity_specialties:
    returning_home_residence:
      trigger_terms: [返乡, 老家, 背井离乡, 离家, 乡土, 故乡]
      task_reframe: 这不是先做{space_label}风格的问题，而是{owner_profile}如何把生活、身份和原乡关系重新安放到一栋房子里。
      viability: 项目能否成立，取决于它是否先回答“我要如何回来生活”，再回答“我要如何表达设计”。
      primary_risk: 头号风险是作品化住宅压过真实生活，导致房子成为专业表达而不是可长期居住的家。
      key_forks: [长期自住、阶段性返乡，还是精神据点？, 亲友和家族关系是被纳入日常，还是只被纳入节庆接待？, 设计表达是克制地服务生活，还是成为这栋房子的主角？]
      unknowns: [真实居住频率会改变空间的日常强度。, 家庭成员结构会改变公共区、卧室和接待边界。, 宅基地环境和当地施工能力会改变设计语言可实现的程度。, 是否保留工作/会客功能会改变动线和私密层级。]
      sections:
        - title: 真实需求重构
          body: 这个题目的重心不在“老家建房”的类型判断，而在回乡之后要把哪一种自我关系安放进去。
          items: [长期离乡的人回到原乡，面对的不是单纯居住问题，而是身份回收、生活重建和家族位置重排。, 职业设计师会天然想把房子做成一次审美表达，但自用住宅首先要承接漫长、重复、琐碎的日常。, 如果这栋房子只被当成“人生作品”，它可能很完整，却不一定能让人真正住下来。]
          emphasis: high
        - title: 四个结构轴
          body: 后续任务书应优先围绕这四条轴收敛，而不是先收集风格图。
          items: [人生结构轴：退休前过渡、职业后半段自我安置、家族角色恢复。, 功能结构轴：长期自住、阶段性返乡、家族节庆聚会、轻工作/会客是否并存。, 乡土语境轴：宅基地、地方施工能力、邻里观看和家族习惯会反向塑造设计边界。, 审美实现轴：是克制生活空间，还是带有展示属性的作品化住宅。]
          emphasis: medium
        - title: 路径分流
          body: 三条路会导向完全不同的任务书重心。
          items: [生活优先型：强调日常、适老、维护和家庭秩序。, 生活+工作混合型：保留设计师身份，但把展示性控制在可生活范围内。, 作品化住宅型：表达最强，但维护、家庭使用和乡土关系风险最高。]
          emphasis: medium
      slots:
        project_object: 自建住宅
        core_tension: 专业表达与长期真实生活之间的张力
        recommended_brief_focus: 先冻结生活方式、家庭关系和作品化边界
      next_question: 这栋民居更像长期居所、阶段性返乡居所，还是带有工作室/接待属性的精神据点
    blended_family_privacy:
      trigger_terms: [再婚家庭, 无血缘, 青春期, 公共交流区, 绝对隐私, 独立性, 冲突缓冲, 心理安全边界, 共居边界]
      task_reframe: 这不是给再婚家庭住宅做功能分区的问题，而是把无血缘青春期孩子、公共交流区、绝对隐私、独立性、冲突缓冲和心理安全边界排成可长期共居的家庭秩序。
      viability: 项目可以进入需求重构，但必须先确认家庭成员关系、隐私等级和冲突缓冲机制，不能只按普通家庭住宅或儿童支持逻辑展开。
      primary_risk: 头号风险是把所有成员放进同一套家庭叙事，结果无血缘关系、青春期独立性、公共交流和绝对隐私互相压迫。
      key_forks: [公共交流优先，还是个人绝对隐私优先？, 青春期孩子的独立性靠房间边界、动线边界，还是家庭规则共同完成？, 冲突缓冲是通过中性公共区、双动线，还是可关闭的个人领域实现？]
      unknowns: [家庭成员数量、年龄和亲密程度尚未确认。, 无血缘成员之间的日常交集和冲突风险尚未确认。, 公共交流区、独立房间和卫生间使用边界尚未确认。]
      sections:
        - title: 共居边界
          body: 再婚家庭住宅需求重构要先确认成员如何安全共处，而不是直接套普通家庭亲密叙事。
          items: [无血缘青春期孩子需要被看见的是独立性、尊重感和可退出的个人边界，而不是单纯儿童房配置。, 公共交流区要承担低压相遇，不应强迫所有成员持续共享亲密关系。, 绝对隐私、卫生间、收纳和回房路径会决定冲突是否被空间放大。]
          emphasis: high
        - title: 冲突缓冲
          body: 家庭关系复杂时，空间的价值在于降低摩擦频率，而不是制造表面团圆感。
          items: [先确认哪些活动必须共享，哪些活动应允许错峰或隔离。, 先确认成员进入公共区、厨房、卫生间和卧室的路径是否互相侵扰。, 先确认家长陪伴、孩子独处和家庭沟通各自需要什么尺度和可见性。]
          emphasis: medium
      slots:
        project_object: 再婚家庭住宅
        core_tension: 无血缘共居、青春期独立、公共交流、绝对隐私和冲突缓冲之间的张力
        recommended_brief_focus: 先冻结家庭成员关系、公共交流区、绝对隐私、独立性和冲突缓冲机制
      next_question: 这个住宅首先要保护个人绝对隐私，还是建立低压公共交流和冲突缓冲机制
    residential_child_support:
      trigger_terms: [儿童, 孩子, 自闭症, 感统, 感觉统合, 低龄使用者]
      semantic_axis_matches:
        subject_profiles: [children]
      task_reframe: 这不是先做{space_label}风格的问题，而是家庭成员的生活秩序、安全边界和恢复能力能否被同一套住宅机制承接。
      viability: 项目成立先看真实使用者的日常压力是否被看见，再看功能和风格能否跟上。
      primary_risk: 头号风险是把特殊使用需求做成局部功能，结果训练、照护、休息和普通生活互相挤压。
      key_forks: [儿童支持、父母休息和普通生活谁是第一优先级？, 哪些区域需要可视照护，哪些区域必须保护隐私和安静？, 安全边界靠空间分区、材料细节，还是行为管理共同完成？]
      unknowns: [儿童年龄、感统训练方式和触发风险会改变空间细节。, 父母照护节奏会改变卧室、客厅和训练区关系。, 安全、收纳和清洁标准会改变材料与构造选择。]
      sections:
        - title: 生活秩序
          body: 居住类需求重构要先看谁每天如何使用，而不是先套住宅风格或身份叙事。
          items: [儿童的感统训练、安全边界和情绪稳定应先进入空间秩序，而不是被当作附加功能。, 父母休息、照护视线和普通家庭生活需要同时成立，不能让训练功能吞掉日常。, 材料、收纳、转角、门锁和动线要先服务安全与可恢复的生活节奏。]
          emphasis: high
        - title: 边界确认
          body: 后续任务书应把照护、休息、训练、社交和收纳边界分清楚。
          items: [哪些活动需要被看见，哪些活动需要被隔离。, 哪些空间需要高频清洁、耐碰撞或低刺激。, 哪些家庭成员需要独处、恢复或稳定陪伴。]
          emphasis: medium
      slots:
        project_object: 居住空间
        core_tension: 儿童支持、父母恢复和普通家庭生活之间的张力
        recommended_brief_focus: 先冻结使用者支持、家庭恢复、安全边界和日常动线
      next_question: 这个住宅首先要解决儿童训练支持、家庭日常恢复，还是安全照护边界
    accessible_residence:
      trigger_terms: [轮椅, 无障碍, 转弯半径, 洗浴安全, 收纳可达, 独立起居, 厨房操作, 扶手, 坡道, 助行]
      task_reframe: 这不是给住宅补无障碍参数的问题，而是轮椅使用者如何在独立起居、洗浴安全、厨房操作、收纳可达和家人陪伴之间建立稳定生活秩序。
      viability: 项目可以进入需求重构，但必须先确认轮椅使用者的日常动作、独立程度和家人协助边界，不能只按普通住宅或通用规范展开。
      primary_risk: 头号风险是把无障碍做成局部尺寸补丁，结果转弯、洗浴、厨房、收纳和陪伴关系仍然互相打架。
      key_forks: [独立生活优先，还是家人协助优先？, 洗浴安全、厨房操作和卧室转移谁是第一风险点？, 无障碍改造靠空间重排、家具定制，还是辅助设备共同完成？]
      unknowns: [轮椅类型、使用者上肢能力和转移动作尚未确认。, 洗浴、如厕、厨房操作和收纳拿取的独立程度尚未确认。, 家人陪伴、夜间照护和紧急呼叫方式尚未确认。]
      sections:
        - title: 无障碍生活链路
          body: 轮椅住宅需求重构要从每天的起居、转移、洗浴、烹饪和收纳动作出发，而不是只检查通道宽度。
          items: [转弯半径、门洞、床边转移和卫生间进入方式会共同决定轮椅使用者能否独立起居。, 洗浴安全需要同时处理防滑、扶手、坐姿转移、排水和紧急呼叫，不能只放大卫生间。, 厨房操作和收纳可达会改变台面高度、柜体开启方式、插座位置和家人协作方式。]
          emphasis: high
        - title: 独立与陪伴边界
          body: 无障碍住宅不是把所有动作交给照护者，而是确认哪些动作应支持独立，哪些需要安全协助。
          items: [先确认使用者希望独立完成哪些高频动作，哪些动作接受家人协助。, 先确认家人陪伴是日常共处、夜间看护，还是仅在风险动作中介入。, 先确认辅助设备、家具定制和空间重排是否会影响普通家庭生活。]
          emphasis: medium
      slots:
        project_object: 无障碍住宅
        core_tension: 轮椅使用者独立生活、洗浴厨房安全、收纳可达和家人陪伴之间的张力
        recommended_brief_focus: 先冻结轮椅使用者日常动作、转弯半径、洗浴安全、厨房操作和家人协助边界
      next_question: 这个住宅最先要保障轮椅使用者独立完成哪些日常动作，哪些动作需要家人协助
