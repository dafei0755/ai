      slots:
        project_object: 酒店大堂
        core_tension: 接待效率、停留体验、服务补给和文化表达之间的张力
        recommended_brief_focus: 先冻结抵达办理、行李寄存、早餐外摆、商务等候和文化展示边界
    long_term_apartment_amenity:
