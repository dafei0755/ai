      task_reframe: 这不是给录音室做一间安静房间的问题，而是把双人访谈、远程连线、声学隔音、导播控制、设备走线和后期剪辑排成稳定的音频生产链路。
      viability: 项目可以进入需求重构，但要先确认录音工作流、声学边界、导播控制和后期协作方式，再决定空间与设备配置。
      primary_risk: 头号风险是只处理隔音和设备采购，却没有解决访谈、远程连线、导播监听、线缆管理和后期剪辑之间的协同。
      key_forks: [录音室首先服务双人访谈、多人圆桌，还是远程连线节目？, 导播控制和后期剪辑是否需要与录音间实时可视或可听？, 声学隔音靠房中房、软包吸声，还是设备与流程共同控制？]
      unknowns: [单期节目人数、录音频率和远程连线比例尚未确认。, 隔声目标、混响控制和外部噪声源尚未确认。, 导播台、监听、线缆、剪辑和素材存储方式尚未确认。]
      sections:
        - title: 录音工作流
          body: 播客录音室要先确认声音如何被采集、监听、切换和后期处理，而不是只追求安静和漂亮背景。
          items: [双人访谈、多人圆桌和远程连线对座位关系、麦克风距离、视线交流和导播控制要求不同。, 录音、监听、导播和后期剪辑如果共用空间，要先确认噪声、视线和设备操作是否互相干扰。, 设备走线、耳机分配、摄像补充和素材备份会反向决定桌面、墙面和机柜位置。]
          emphasis: high
        - title: 声学与后期边界
          body: 声学隔音不是孤立技术参数，它会和节目形式、远程连线、导播监听和后期剪辑共同决定空间机制。
          items: [先确认隔声目标是屏蔽外部噪声，还是控制室内反射、混响和脚步设备噪声。, 先确认导播控制区是否需要看见录音区、实时监听并介入远程连线。, 先确认后期剪辑是同场完成、独立房间完成，还是只需要素材整理与备份节点。]
          emphasis: medium
      slots:
