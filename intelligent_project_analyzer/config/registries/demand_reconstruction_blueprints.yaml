      key_forks: [公共区优先服务住户日常，还是服务社群活动和品牌运营？, 共享厨房、健身和社交活动是否可以共享同一套时间与管理规则？, 快递收纳和运营维护是前场可见，还是需要独立后台路径？]
      unknowns: [住户规模、峰值使用时段和公共区开放规则尚未确认。, 共享厨房、健身和活动的管理责任尚未确认。, 快递收纳容量、清洁巡检和维修路径尚未确认。]
