          items: [共享厨房、健身和社交活动会在时间段、噪声和清洁责任上互相影响。, 快递收纳、访客停留和住户社交需要明确权限、可见性和管理边界。, 公共区不是住宅客厅放大版，它必须能支撑高频使用、巡检、清洁和运营维护。]
