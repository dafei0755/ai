        core_tension: 文化来源、品牌识别、空间层级与用户理解之间的张力
        recommended_brief_focus: 先冻结文化来源、命名规则、空间层级和识别系统
      next_question: 这套餐厅包房命名更想强调文化出处、品牌性格，还是空间记忆点
