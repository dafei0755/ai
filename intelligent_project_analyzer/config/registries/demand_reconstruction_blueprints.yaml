        - title: 表达边界
          body: 文化感成立的关键是克制、解释和一致性，而不是符号密度。
          items: [先确认目标客群能否读懂这套语言，再决定典故深度。, 高频出现的文字、纹样和材料应服务识别，不应压过就餐体验。, 每个包房名称最好对应清晰的空间差异，否则命名会变成孤立文案。]
          emphasis: medium
      slots:
