          body: 这类空间的关键是把住户体验、社区活动和物业运营放在同一套规则里，而不是只看氛围。
          items: [先确认社交活动是日常自发、定期运营，还是品牌社群活动。, 先确认共享厨房和健身区的高峰时段、清洁方式和安全责任。, 先确认快递收纳、维修巡检和后台补给是否会穿越住户停留区。]
          emphasis: medium
      slots:
        project_object: 长租公寓公共区
        core_tension: 住户体验、共享功能、社交活动和运营维护之间的张力
        recommended_brief_focus: 先冻结共享厨房、健身、社交活动、快递收纳和运营维护边界
