      unknowns: [护理房数量、入住周期和夜间响应方式尚未确认。, 婴儿护理模式、护士站可视范围和护理人员班次尚未确认。, 家属探访制度、营养餐配送频率和后勤路径尚未确认。]
      sections:
        - title: 母婴护理链路
          body: 月子中心的核心不是住宿感，而是产妇休息、婴儿护理、护士站响应和服务配送能否稳定衔接。
          items: [产妇休息需要安静、隐私、恢复节奏和护理可达性同时成立。, 婴儿护理需要与护士站、探访边界和夜间响应形成清晰关系。, 营养餐配送会改变公共区、后勤路径、送餐停靠和异味控制。]
          emphasis: high
        - title: 探访与后勤边界
          body: 家属探访、公共活动和护理后勤如果不先分层，会让恢复、卫生和运营效率互相干扰。
          items: [先确认家属探访是开放型、预约型，还是只在固定区域完成。, 先确认公共区承担社交、宣教、会客还是短暂停留。, 先确认护士站需要看见哪些区域、快速到达哪些房间、避开哪些家属动线。]
          emphasis: medium
      slots:
        core_tension: 产妇恢复、婴儿护理、家属探访和后勤配送之间的张力
        recommended_brief_focus: 先冻结母婴护理链路、探访制度、护士站响应和营养餐配送方式
    rehabilitation_center:
      trigger_terms: [康复中心, 康复训练, 物理治疗, 器械训练, 评估室, 无障碍动线, 康复科, 步态训练, 作业治疗, 助行训练]
      task_reframe: 这不是单纯配置康复器械的问题，而是把评估室、物理治疗、器械训练、家属等候和无障碍动线重构成一条可恢复、可看护、可运营的康复训练链路。
      viability: 项目可以进入需求重构，但必须先确认评估流程、训练强度、安全看护和家属陪同边界，不能只按设备摆放或通用无障碍参数展开。
