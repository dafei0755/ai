      viability: 项目成立先看真实使用者的日常压力是否被看见，再看功能和风格能否跟上。
      primary_risk: 头号风险是把住宅做成效果图完整的空间，却没有承接真实生活节奏、家庭关系和长期维护压力。
      key_forks: [生活节奏、家庭关系和隐私边界谁是第一优先级？, 公共区更偏向亲友接待、家庭陪伴，还是安静恢复？, 安全与维护靠空间分区、收纳系统，还是日常行为规则共同完成？]
      unknowns: [真实居住频率和家庭成员结构会改变空间日常强度。, 亲友来访、安静休息和收纳需求会改变公共区与私密区边界。, 安全、照明、收纳和维护标准会改变材料与构造选择。]
      sections:
        - title: 生活秩序
