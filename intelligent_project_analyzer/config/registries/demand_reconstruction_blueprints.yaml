          items: [选手训练需要专注和低干扰，赛事直播需要可控画面、灯光、收音和导播链路。, 战术复盘如果与直播共用空间，要确认屏幕、白板、保密和内容化传播的边界。, 粉丝互动会改变入口、镜头背景、展示陈列和选手休息的隐私边界。]
          emphasis: high
        - title: 设备与环境边界
          body: 电竞设备、网络、灯光、隔音和散热会共同决定空间是否稳定，而不是单独采购设备。
          items: [先确认主机、服务器、外设和网络设备是否需要独立散热、检修和降噪。, 先确认直播灯光、显示屏和摄像机是否会干扰选手视线、训练节奏和复盘观看。, 先确认隔音目标是控制外部噪声，还是控制内部语音、键鼠声和设备风噪。]
