      key_forks: [入住接待效率优先，还是大堂停留体验优先？, 早餐外摆是高频运营功能，还是低频氛围补充？, 城市文化展示服务品牌记忆，还是承担明确导览与传播任务？]
      unknowns: [入住、退房和早餐高峰时段尚未确认。, 行李寄存规模、服务台位置和后台补给方式尚未确认。, 商务等候、文化展示和临时会客是否共享空间尚未确认。]
