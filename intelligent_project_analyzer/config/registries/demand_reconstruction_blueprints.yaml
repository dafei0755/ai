      primary_risk: 头号风险是把旗舰店做成好看的陈列展厅，却没有形成试用、咨询、信任和购买的闭环。
      key_forks: [顾客进店首先被品牌故事吸引，还是被产品体验吸引？, 试闻/试用是自由探索、导购陪同，还是会员活动的一部分？, 高客单转化依赖安静咨询、产品教育，还是社群活动带动？]
      unknowns: [核心客群和客单价会改变停留深度。, 试用方式会改变陈列、材料、通风和清洁维护。, 会员活动频率会改变可变家具、收纳和小型聚集区需求。]
      sections:
        - title: 品牌转化
          body: 零售型商业需求重构要先判断顾客为什么进店、停留、理解并购买。
          items: [入口和第一视线应先回答品牌是谁，而不是只堆满产品陈列。, 产品试用、比较和咨询需要稳定节奏，否则高客单转化会被动线和信息噪声稀释。, 会员活动、复购和社群关系会改变空间是否需要可停留、可讲解、可小型聚集的区域。]
          emphasis: high
        - title: 体验边界
          body: 体验不是装饰，它会直接改变陈列密度、服务半径和库存后台。
          items: [试闻、试用或体验桌要和收银、咨询、等候形成清晰顺序。, 高客单产品需要更低的信息噪声和更强的信任建立，不适合只按快周转陈列。, 品牌故事、产品教育和成交动作要分层组织，避免顾客只逛不买。]
          emphasis: medium
      slots:
        project_object: 零售体验空间
        core_tension: 品牌体验、产品试用与成交转化之间的张力
        recommended_brief_focus: 优先冻结客群、产品体验方式、会员活动和成交路径
      next_question: 这个旗舰店首先靠品牌故事、产品试用，还是会员活动推动高客单转化
    naming_language:
