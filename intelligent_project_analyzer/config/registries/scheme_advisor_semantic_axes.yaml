    material_sustainability_value:
      terms: [材料替换, 环保回收材料, 回收材料, 天然大理石, 水磨石, 造价, 长期运营价值, 品牌溢价, 可持续形象, 材料数据库, 碳足迹, 维护成本]
    family_privacy_boundary:
