  founding_drivers:
    identity_expression:
      terms: [身份, 成就象征, 成就沉淀, 事业成功, 精神结构, 权力, 地位, 体面感, 价值感]
    family_legacy:
      terms: [家族传承, 传承, 家族, 代际, 游子, 回归]
    business_roi:
      terms: [回本, 坪效, 客流, 入住率, 定价, 租金, 商业成功, 运营效率]
    brand_differentiation:
      terms: [品牌, 旗舰, 差异化, 辨识度, 形象店, 品牌精神]
    cultural_translation:
      terms: [文化, 在地, 文脉, 诗词, 传统, 民族, 乡愁, 地域]
    healing_support:
      terms: [疗愈, 情绪, 焦虑, 恐惧, 修复, 尊严, 心理]
    operational_efficiency:
      terms: [运营效率, 高峰, 7×24, 冷链, 自助, 出杯, 点单, 取餐, 翻台, 外卖自提]

  spatial_design_drivers:
    social_solitude_balance:
      terms: [社交与独处, 独处, 独立精神, 自律, 轻盈, 空间比例, 动线组织]
    memory_object_integration:
