inference_rules:
  - id: founder_story_private_owner
    description: 创业经历与私宅/业主语境共现时，推断为创始人业主画像。
    when:
      all:
        - any_terms: [创始人, 白手起家, 一路打拼, 打拼, 小工厂, 行业龙头, 创业经历, 事业沉淀, 事业有成, 从无到有]
        - any:
            - any_terms: [私宅, 别墅, 住宅, 大平层, 家宅, 这个家, 新家]
            - any_terms: [业主, 主人, 男主人, 女主人, 家]
    append_axes:
      - axis: subject_profiles
        id: founder_owner
  - id: founder_story_identity_expression
    description: 创业经历与事业/回归/成就语境共现时，推断为空间身份表达。
    when:
      all:
        - any_terms: [创始人, 白手起家, 一路打拼, 打拼, 小工厂, 行业龙头, 创业经历, 事业沉淀, 事业有成, 从无到有]
        - any_terms: [家族, 传承, 内心, 安定, 回归, 沉淀, 成就, 事业]
    append_axes:
      - axis: founding_drivers
        id: identity_expression
  - id: private_carrier_family_legacy
    description: 私宅载体与家族/代际语境共现时，推断为家族传承驱动。
    when:
      all:
        - any_terms: [私宅, 别墅, 住宅, 大平层, 家宅, 这个家, 新家]
        - any_terms: [家族, 传承, 代际, 家人]
    append_axes:
      - axis: founding_drivers
        id: family_legacy
  - id: private_carrier_residential_domain
    description: 私宅载体出现时，补充居住空间领域。
    when:
      any_terms: [私宅, 别墅, 住宅, 大平层, 家宅, 这个家, 新家]
    append_axes:
      - axis: space_domains
        id: residential
  - id: water_edge_view_resource
    description: 湖畔、水岸等非海景表述出现时，补充滨水景观资源。
    when:
      any_terms: [湖畔, 湖边, 湖岸, 湖景, 水岸]
    append_axes:
      - axis: site_resources
        id: waterfront_view
  - id: commercial_carrier_roi_or_traffic
    description: 商铺载体与投资或流量压力共现时，推断为商业转化空间。
    when:
      all:
        - any_terms: [小铺, 店铺, 铺位, 商铺, 档口, 门店, 零售项目, 商业项目, 商业空间]
        - any:
            - any_terms: [租金, 回本, 回收投资, 收回投资, 收回成本, 投资回报, 低投入, 成本压力]
            - any_terms: [人流, 人流量, 客流, 快周转, 高周转, 高峰, 排队, 动线, 换乘]
    append_axes:
      - axis: space_domains
        id: retail_commercial
  - id: investment_pressure_roi
    description: 投资回收、租金或成本压力出现时，补充商业成立与回报驱动。
    when:
      any_terms: [租金, 回本, 回收投资, 收回投资, 收回成本, 投资回报, 低投入, 成本压力]
    append_axes:
      - axis: founding_drivers
        id: business_roi
  - id: commercial_or_transit_operation_efficiency
    description: 流量/高峰/动线信号与商业或交通语境共现时，补充运营效率驱动。
    when:
      all:
        - any_terms: [人流, 人流量, 客流, 快周转, 高周转, 高峰, 排队, 动线, 换乘]
        - any:
            - any_terms: [小铺, 店铺, 铺位, 商铺, 档口, 门店, 零售项目, 商业项目, 商业空间]
            - any_terms: [租金, 回本, 回收投资, 收回投资, 收回成本, 投资回报, 低投入, 成本压力]
            - any_terms: [地铁, 换乘, 通道, 交通节点, 连接处, 站厅, 高铁]
    append_axes:
      - axis: founding_drivers
        id: operational_efficiency
  - id: transit_node_resource
    description: 交通节点语境出现时，补充交通节点资源。
    when:
      any_terms: [地铁, 换乘, 通道, 交通节点, 连接处, 站厅, 高铁]
    append_axes:
      - axis: site_resources
        id: transit_node
  - id: public_learning_domain
    description: 学习/参观/信息节奏与公众或儿童语境共现时，推断为公共教育服务。
    when:
      all:
        - any_terms: [认知空间, 公众学习, 学习路径, 互动实验, 观察点, 参观路线, 参观路径, 参观, 信息节奏]
        - any:
            - any_terms: [市民, 公众, 居民, 社区, 参观者, 访客]
            - any_terms: [中小学生, 学生, 孩子, 儿童, 青少年, 亲子]
    append_axes:
      - axis: space_domains
        id: education_public
  - id: public_user_profile
    description: 公众、居民或访客语境出现时，补充公众使用者画像。
    when:
      any_terms: [市民, 公众, 居民, 社区, 参观者, 访客]
    append_axes:
      - axis: subject_profiles
        id: public_users
  - id: child_user_profile
    description: 儿童、学生或亲子语境出现时，补充儿童使用者画像。
    when:
      any_terms: [中小学生, 学生, 孩子, 儿童, 青少年, 亲子]
    append_axes:
      - axis: subject_profiles
        id: children

