default_description: 会影响方案主轴、追问顺序和后续目录重心。

descriptions:
  identity_expression: 先判断空间要表达什么身份、精神和价值，而不是先堆风格。
  family_legacy: 先确认家庭、代际和长期记忆如何被空间承载。
  business_roi: 先校准商业成立逻辑、投入边界和运营回报。
  brand_differentiation: 先判断品牌如何形成差异，而不是复制流行符号。
  cultural_translation: 先把文化线索转成空间秩序，避免符号堆砌。
  healing_support: 先确认情绪支持、尊严和安全感如何落到空间。
  operational_efficiency: 先判断动线、效率和使用压力是否成立。
  social_solitude_balance: 先判断社交、独处、日常节奏和自我表达如何互相支撑。
  memory_object_integration: 先判断旧物如何从杂乱收藏变成有秩序的生活记忆。
  art_living_balance: 先判断艺术展陈、收藏保护与日常生活如何共存。
  methodology_discussion: 先把抽象观点转成可迁移的方法框架、适用边界和验证方式。
  analogy_translation: 先判断外部体系中哪些原则可转译，哪些只能作为启发。
  value_argument: 先判断要说服谁、用什么证据证明长期价值，以及哪些成本边界不能被美化。
  material_sustainability_value: 先把材料替换从审美偏好转成成本、性能、维护、证据链和品牌价值判断。
  family_privacy_boundary: 先判断家庭成员、隐私、公共交流和心理安全边界如何共存。
  extreme_resilience_prototype: 先判断极端环境、地下空间、生命支持系统和长期运行冗余是否成立。
  flexible_scene_switching: 先判断多个使用场景如何快速切换，以及哪些系统必须固定、哪些可以可变。

tension_priority:
  identity_expression:
    base_weight: 90
    title: 先确认空间真正要表达什么
    prompt: 这个项目的关键不是先选风格，而是先确认空间要承载的身份、精神和分寸。
  family_legacy:
    base_weight: 86
    title: 先确认家人和来客的关系
    prompt: 需要先判断家庭传承、日常生活和待客场景之间如何分层。
  founder_owner:
    base_weight: 85
    title: 先确认主人真正想被如何看见
    prompt: 需要先判断创业经历、成就沉淀、内心回归和家庭安住之间的主次关系。
  family_multi_generation:
    base_weight: 83
