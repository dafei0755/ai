version: "v1.0"
description: >
  方案高参入口与压力测试共用的语义轴注册表。这里定义的是稳定的识别框架，
  不是单个问题的答案模板；业务新增、术语补充和误判修正应优先改本文件，
  不应在服务代码里新增一次性分支。

axes:
  space_domains:
    residential:
      terms: [住宅, 别墅, 大平层, 公寓, 主卧, 卧室, 书房, 衣帽间, 家庭, 家中, 新家, 日常居住, 四合院, 民居, 儿童房]
    hospitality:
      terms: [酒店, 民宿, 旅舍, 客房, 度假, 公寓品牌, 月子中心]
    retail_commercial:
      terms: [商场, 商业街区, 商业综合体, 商业空间, 商铺, 买手店, 旗舰店, 花店, 咖啡店, 茶饮, 奶茶, 餐厅, 门店]
    workplace:
      terms: [办公室, 总部, 研发中心, 律所, 工作室, 直播基地, 办公中心]
    cultural_exhibition:
      terms: [展厅, 展馆, 美术馆, 博物馆, 记忆馆, 展示中心, 艺术, 书法]
    healthcare_wellness:
      terms: [医院, 诊所, 牙科, 病房, 康养, 养老, 心理干预, 医疗]
    education_public:
      terms: [学校, 幼儿园, 图书馆, 课堂, 培训中心, 社区活动中心, 服务中心]
    urban_renewal:
      terms: [城市更新, 公共再生, 城市公共客厅, 旧厂, 老街, 老码头, 码头区域, 历史建筑, 历史建筑保护, 文保, 活化, 废弃, 老旧, 粮仓, 防空洞, 滨水界面重构]
    technical_special:
      terms: [实验室, 声学, 杜比, 洁净, AI, 智能, 供氧, 低能耗, 避难, 零碳, 地下居住, 地下生活, 光井, 空气循环, 极端气候, 极端地质]

  input_intents:
    complete_design_framework:
      terms: [完整, 设计框架, 设计概念, 设计方案, 空间策略]
    methodology:
      terms: [方法论, 系统分析, 模型, 框架, 启发维度, 应用路径]
    naming:
      terms: [命名, 门牌, 候选词, 四字]
    competition_strategy:
      terms: [竞标, 赢得竞标, 对手包括, 突破]
    technical_solution:
      terms: [构造, 系统, 标准, 声学, 新风, 供氧, 防腐, 结构, 设备]

  problem_modes:
    methodology_discussion:
      terms: [方法论, 系统分析, 应用模型, 应用路径, 启发维度, 实践框架, 方法论框架]
    analogy_translation:
