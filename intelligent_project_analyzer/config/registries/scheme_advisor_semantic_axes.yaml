    extreme_resilience_prototype:
      terms: [地下居住单元, 地下生活社区, 地下生活, 地下居住, 极端气候, 极端地质, 火山活跃带, 光井系统, 光井结构, 空气循环, 空气净化, 人口过密, 生命支持, 灾害冗余]
    flexible_scene_switching:
      terms: [流动式生活空间, 可快速调整, 快速调整, 可移动家具, 模块化家具, 灯光模块化, 派对, 拍摄, 居住, 社交展示, 场景切换, 多场景, 可变空间, 灵活切换]

  site_resources:
    waterfront_view:
      terms: [海景, 湖景, 江景, 河景, 水景, 深圳湾, 海边, 滨海, 滨水, 一线海景]
    mountain_nature:
      terms: [山地, 山景, 乡村, 自然, 森林, 悬崖, 田园]
    heritage_context:
      terms: [历史, 传统, 老房, 老街, 旧厂, 老码头, 城市记忆, 场地记忆, 故居, 梁架, 弄堂]
    transit_node:
      terms: [地铁, 高铁, 通道, 交通节点, 连接处]

  lifecycle:
    new_build:
      terms: [新建, 建设, 打造, 计划建设]
    renovation:
      terms: [改造, 更新, 升级, 翻新, 换装, 旧]
    soft_furnishing:
      terms: [软装, 陈设, 家具, 艺术陈设]
