# ============================================================================
# B9: 角色置信度连续谱 (Role Confidence Spectrum)
# 替代原"是否选择"二值决策，改为连续置信度分级
# 每个角色在组建时被分配一个 0-1 的置信度得分，决定其参与深度
# ============================================================================
role_confidence_spectrum:
  version: "B9.0"
  description: |
    角色不再是"选中/未选中"的二值状态，而是以置信度连续谱参与协作。
    置信度决定角色的输出深度权重和交付物优先级。

  # -----------------------------------------------------------------------
  # 置信度分级定义
  # -----------------------------------------------------------------------
  tiers:
    primary:
      score_range: [0.8, 1.0]
      label_zh: 主力角色
      participation: full      # 完整分析 + 全部交付物
      deliverable_weight: 1.0
      description: "核心问题直接命中该角色专业领域，必须深度输出"
      trigger_rules:
        - "该角色的 core_keywords 与项目命题重叠度 ≥ 3 个"
        - "该角色是 cross_mode_rules 中被指定 max_p0_tasks 的主角色"
        - "该角色交付物被 confirmed_proposition 直接关联"

    supporting:
      score_range: [0.4, 0.79]
      label_zh: 辅助角色
      participation: focused   # 聚焦分析 + 核心交付物（省略低优先级）
      deliverable_weight: 0.6
      description: "角色能力与项目有关联，但非核心驱动，聚焦贡献关键维度"
      trigger_rules:
        - "该角色 recommended_perspectives 中有 2 个以上匹配当前动机类型"
        - "该角色在雷达图评分中有 1 个以上维度得分 ≥ 0.6"
        - "跨模式规则 cross_mode_rules 中被作为辅助合并角色"

    observer:
      score_range: [0.2, 0.39]
      label_zh: 观察角色
      participation: signal    # 背景信号监测，不独立输出，仅触发补充注释
      deliverable_weight: 0.2
      description: "边缘相关，仅在主力角色输出中以补充注释形式呈现，不单独占用 token"
      trigger_rules:
        - "该角色有 1 个命题关联关键词，但核心专业不匹配"
        - "该角色在 motivation_perspective_mapping 中为 recommended 而非 mandatory"

    excluded:
      score_range: [0.0, 0.19]
      label_zh: 排除角色
      participation: none      # 不参与本次分析
      deliverable_weight: 0.0
      description: "与当前命题和 confirmed_exclusions 无关联，明确排除"

  # -----------------------------------------------------------------------
  # 置信度得分计算规则（供代码参考）
  # -----------------------------------------------------------------------
  scoring_formula:
    base_score_from_keyword_overlap:
      description: "角色核心关键词 ∩ 项目关键词 / max(5, 项目关键词数) × 0.5"
      max_contribution: 0.5
    proposition_direct_match:
      description: "confirmed_proposition 文本包含角色标签词时额外 +0.3"
      max_contribution: 0.3
    motivation_alignment:
      description: "perspective_weights_by_motivation 中该角色视角得分折算 × 0.2"
      max_contribution: 0.2
    exclusion_penalty:
      description: "confirmed_exclusions 涉及该角色专业领域时 -0.5（强惩罚）"
      max_contribution: -0.5

  # -----------------------------------------------------------------------
  # 各 V 层典型置信度阈值
  # -----------------------------------------------------------------------
  layer_defaults:
    V2_设计总监:
      default_score: 0.85  # 几乎所有项目的主力
      can_be_observer: false
    V3_人物及叙事专家:
      default_score: 0.6   # 文化/品牌项目升为主力，功能型项目为辅助
      can_be_observer: true
    V4_设计研究员:
      default_score: 0.7   # 需求分析型项目的主力
      can_be_observer: true
    V5_场景与行业专家:
      default_score: 0.65  # 商业/多业态项目的主力
      can_be_observer: true
    V6_专业总工程师:
      default_score: 0.55  # 工程合规项目的主力，纯概念项目可降至观察
      can_be_observer: true

# =========================================================================
# v8.2 Phase 2: 质量评分阈值配置
# =========================================================================
quality_thresholds:
  # 合成角色质量阈值 (SynthesisQualityValidator.validate_synthesis)
  synthesis_minimum: 6.0     # 合成角色加权总分最低要求
  synthesis_warning: 7.0     # 低于此值触发警告

  # 全局角色选择质量阈值 (validate_overall_quality)
  overall_minimum: 0.5       # 全局质量评分最低要求 (0-1)
  overall_warning: 0.7       # 低于此值触发警告日志

  # 子维度权重
  alignment_weight: 0.6      # 任务-角色对齐度权重
  coverage_weight: 0.4       # 交付物覆盖度权重