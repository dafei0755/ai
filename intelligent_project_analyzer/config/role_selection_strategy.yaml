# ============================================================================
# 角色选择策略配置 v7.4 (目标导向与声明式结构版 + v7.19对齐)
# Role Selection Strategy v7.4 (Goal-Oriented & Declarative Structure)
# ============================================================================
# 版本: v7.4
# 更新日期: 2025-12-17
#
# 本文件是AI总参谋长的作战手册，定义了如何以解决问题为最终导向，智能地组建团队。
#
# 🔧 v7.4 更新:
# - 与 v7.19 专家工厂 ROLE_LLM_PARAMS 对齐
# - 确认 role_gene_pool 为 strategy_manager.py 提供角色元数据
# - 与 roles/*.yaml 分工: 本文件定义选择策略，roles/*.yaml 定义完整角色配置
#
# 🔗 代码引用:
# - services/role_weight_calculator.py: 加载权重配置
# - core/strategy_manager.py: 加载选择策略
# ============================================================================

version: "7.4"

# 默认策略
default_strategy:
  name: "goal_oriented_adaptive_collaboration_v7.2"
  description: "以最终输出结构为导向，自适应选择协同模式，并强制生成和应用动态角色名称。"
  min_roles: 2
  max_roles: 10

# 自定义策略 (Custom Strategies)
custom_strategies:
  goal_oriented_adaptive_collaboration_v7.2:
    name: "goal_oriented_adaptive_collaboration_v7.2"
    description: "以最终输出结构为导向，自适应选择协同模式，并强制生成和应用动态角色名称。"
    min_roles: 2
    max_roles: 10
    selection_rules:
      required_categories: []
      priority_weights:
        V2_设计总监: 1.0
        V3_人物及叙事专家: 0.8
        V4_设计研究员: 0.9
        V5_场景与用户生态专家: 0.85
        V6_专业总工程师: 1.0
        V7_社会关系与心理洞察专家: 0.75

# ============================================================================
# 0. 自适应协同策略引擎 (Adaptive Collaboration Strategy Engine)
# ============================================================================
adaptive_strategy_engine:
  description: "这是一个决策树，指导AI如何根据问题选择最合理的协同模式。"
  decision_logic:
    - "第一步：深度分析需求，识别所有核心关键词和任务领域。"
    - "第二步：评估协同模式优先级。严格按照以下顺序进行判断："
    - "  优先级1 - 判断是否适用【单一专家深潜】模式：如果需求高度聚焦，关键词与基因库中某一个子角色的匹配度极高（>0.9），则选择此模式。"
    - "  优先级2 - 判断是否适用【多专家并行】模式：如果无法满足优先级1，且需求关键词明确指向同一战略角色下的多个不同子角色，则选择此模式。这是解决复杂问题的首选方案。"
    - "  优先级3 - 判断是否适用【动态角色合成】模式：如果以上两种模式均不适用，且需求具有高度的跨界性和新颖性，则启动此最终模式，合成新角色。"
  
  justification_principle: "在'decision_explanation'中，必须首先声明选择了哪种协同模式，并详细阐述理由。然后，在介绍每个角色时，必须使用你在`selected_roles`中为`dynamic_role_name`字段定义的那个精准名称。"
  
  # 🆕 v7.4新增：同层去重规则 (Same-Layer Deduplication Rules)
  same_layer_deduplication:
    description: "同一V战略层下的子角色选择约束，避免能力重叠导致的冗余输出。适用于所有V层级。"
    applies_to: ["V2", "V3", "V4", "V5", "V6", "V7"]  # 适用于所有战略层
    rules:
      - rule_id: "DEDUP-1"
        name: "同层单选原则"
        description: "同一V层级下(如V2-1/V2-2、V3-1/V3-2/V3-3、V5-1/V5-2等)，默认最多选择1个子角色。"
        exception: "如果需求明确需要该层级内的不同能力组合，且任务目的不同，可选择2个子角色，但需在decision_explanation中明确论证各自的独立任务边界。"
      - rule_id: "DEDUP-2"
        name: "同层多选合理性判断"
        description: "同一V层级下选择多个子角色时，必须满足以下条件之一："
        valid_conditions:
          - "任务目的明确不同：如V2-1负责'住宅空间设计'，V2-2负责'商业空间设计'"
          - "交付物类型不同：如V4-1产出'用户研究报告'，V4-2产出'材料趋势分析'"
          - "专题探讨需要：需要从不同专业视角对同一主题进行深度碰撞"
          - "业态确实不同：如V5-1处理'居住场景'，V5-2处理'商业场景'（仅当项目确实涉及多业态）"
        invalid_patterns:
          - "任务描述高度相似或重叠（如两个V6角色都被分配'成本估算'任务）"
          - "缺乏明确的任务边界划分"
          - "单一业态项目却激活多个场景专家（如纯住宅项目同时激活V5-1和V5-2）"
      - rule_id: "DEDUP-3"
        name: "交付物驱动优选"
        description: "当存在多个候选子角色时，优先选择与primary_deliverables的deliverable_owner_suggestion匹配度最高的那个。"
      - rule_id: "DEDUP-4"
        name: "各层级典型场景指引"
        layer_guidance:
          V2: "V2-1(住宅)与V2-2(商业)通常互斥，除非项目是住商混合体"
          V3: "V3-2(文化IP)与V3-3(品牌命名)可共存，但需明确各自交付物边界"
          V4: "V4-1(用户研究)与V4-2(趋势分析)可共存，服务于不同研究维度"
          V5: "V5-1(居住)与V5-2(商业)与V5-3(办公)按实际业态选择，单业态项目只选1个"
          V6: "V6-1(结构)、V6-2(机电)、V6-3(室内工艺)、V6-4(成本)、V6-5(灯光)、V6-6(可持续)、V6-7(功能优化)、V6-8(资本策略)、V6-9(技术整合)、V6-10(运营分析)可按需组合，但每个工程专业最多1个"
          V7: "V7-1(社会关系·家庭)与V7-2(组织心理·社会结构)按分析尺度选择，家庭/个人层面选7-1，组织/社区层面选7-2"

# ============================================================================
# 1. 输出结构强制声明 (Output Structure Mandate) - v7.2核心
# ============================================================================
output_structure_mandate:
  description: "这是最终输出的黄金规则。你必须严格按照此结构生成`selected_roles`数组中的每一个对象。"
  role_object_structure:
    - "role_id: (String) 必须是来自基因库的原始ID，如 '2-1'。"
    - "role_name: (String) 必须是来自基因库的原始名称，如 '居住空间设计总监'。"
    - "dynamic_role_name: (String) **[核心必填项]** 你必须为这个角色创造一个能精准反映其在本次具体任务中核心职责的、全新的动态名称。例如：'山地别墅内外总设计师'、'多代家庭生活方式策略师'。"
    - "tasks: (Array of Strings) 必须是为这个动态角色量身定制的具体任务列表。"
    - "focus_areas: (Array of Strings) 必须是这个动态角色的核心关注点。"
    - "expected_output: (String) 必须是这个动态角色的预期交付物。"
    - "dependencies: (Array of Strings) 必须是这个动态角色的启动依赖。"

# ============================================================================
# 1.5. 动态角色合成协议 (Dynamic Role Synthesis Protocol) - v7.3新增
# ============================================================================
dynamic_role_synthesis_protocol:
  description: "当且仅当【动态角色合成】模式被激活时,必须遵循此协议来创造一个全新的角色。"
  
  activation_condition: "只有当adaptive_strategy_engine判定需启动优先级3模式时,才能使用此协议。禁止在其他情况下合成角色。"
  
  synthesis_steps:
    - "第一步：确定父角色。选择2个(最多不超过3个)最相关的现有角色作为'父角色'。优先选择不同战略层(V2-V7)的角色进行跨界融合。"
    - "第二步：创造新ID和名称。新role_id应为父角色的组合,如'2-1+5-1'。新role_name应体现其混合特性,如'生活方式驱动的居住设计专家'。dynamic_role_name应更加具体地反映本次任务,如'三代同堂居住空间与生活模式总设计师'。"
    - "第三步：融合关键词。将所有父角色的'keywords'进行合并和去重,保留最能体现跨界融合特性的关键词。"
    - "第四步：构建新System Prompt。以主导父角色的system_prompt为框架,将其'核心专业领域(你的工具箱)'部分与其他父角色的内容进行融合,创造出新的能力组合。必须保留标准结构(身份与任务/团队协作接口/核心专业领域/本次任务核心/工作方法/输出格式)。"
    - "第五步：定义新输出结构。在新的system_prompt中,综合父角色的输出字段,定义一个新的、更有针对性的输出JSON结构。必须保留'custom_analysis'和'confidence'字段。"
  
  # v8.1 新增: 融合深度要求（防止任务堆叠）
  fusion_depth_requirements:
    description: "合成角色的任务必须体现深度融合，而非将两个角色的任务简单拼接。"
    fusion_patterns:
      - pattern: "X逻辑驱动Y决策"
        example: "以运营逻辑驱动设计决策"
        quality: "优秀 - 明确展示了跨领域驱动关系"
      - pattern: "在X视角下重构Y方案"
        example: "在家庭动力学视角下重构空间布局方案"
        quality: "优秀 - 深度融合两个专业视角"
      - pattern: "平衡X需求与Y目标"
        example: "平衡代际隐私需求与空间利用效率目标"
        quality: "良好 - 体现了多目标协调"
      - pattern: "将X洞察嵌入Y过程"
        example: "将用户心理洞察嵌入动线规划过程"
        quality: "优秀 - 嵌入式融合"
    anti_patterns:
      - pattern: "先做X分析，再做Y设计"
        problem: "纯顺序堆叠，无融合"
      - pattern: "X负责A任务，Y负责B任务"
        problem: "分工式拆分，未产生新能力"
      - pattern: "分别从X和Y角度分析"
        problem: "并列而非融合，缺乏化学反应"

  # v8.1 新增: 合成触发条件精细化
  synthesis_triggers:
    description: "更精确的合成模式触发条件，避免不必要的合成或遗漏必要的合成"
    should_synthesize:
      - condition: "需求核心意图同时深度依赖两个不同战略层的专业能力"
        example: "三代同堂空间设计 → V2设计+V5运营+V7家庭关系，三者缺一不可"
      - condition: "关键词跨越多个角色且无法通过任务分工解耦"
        example: "文化疗愈空间 → 文化转译+心理洞察，需在同一框架下协同思考"
      - condition: "存在明确的'X驱动Y'跨领域逻辑关系"
        example: "运营坪效驱动空间设计，而非两者独立"
    should_not_synthesize:
      - condition: "两个角色的任务可以通过依赖关系解耦（A先做→B用A的结果）"
        alternative: "使用多专家并行模式，设置正确的dependencies"
      - condition: "需求本身是多个独立子任务的组合"
        alternative: "使用多专家并行模式，各自负责独立子任务"
      - condition: "合成的复杂性超过收益（3个以上父角色融合）"
        alternative: "分解为2个合成角色或保持多专家并行"
  
  synthesis_constraints:
    - "约束1：父角色必须来自不同的战略层(V2-V7),以保证跨界融合的价值。例如V2+V5, V3+V4+V6, V2+V7。禁止选择同一层的多个角色(如V2-1+V2-2)。"
    - "约束2：合成角色的tasks必须是深度融合的,而非简单的任务堆叠。使用融合性动词：驱动、整合、协同、平衡、贯穿、嵌入。禁止使用堆叠性表述：先做X再做Y、分别负责、各自分析。"
    - "约束3：合成角色的dependencies应尽量减少,因为它已经融合了多个角色的能力。如果必须有依赖,应仅依赖于未被合成的其他战略层角色。"
    - "约束4(v8.1新增)：合成角色的dynamic_role_name必须体现融合特征，格式为'{项目特征}+{融合专业}+{职责}'，如'三代同堂居住空间与生活模式总设计师'。禁止简单拼接父角色名称。"
    - "约束5(v8.1新增)：合成角色的每个task至少包含一个融合性关键动词（驱动/整合/协同/平衡/贯穿/嵌入/联动），确保任务描述体现跨界思维。"
  
  # v8.1: 扩展合成示例库（从1个→4个典型场景）
  synthesis_examples:
    - scenario: "三代同堂居住空间"
      user_request: "为一个三代同堂的150㎡房子设计,需要解决代际关系和日常生活流线问题"
      synthesis_decision: "核心意图同时涉及居住空间设计(V2-1)和居住场景运营(V5-1),且高度跨界,启动合成模式。"
      result:
        role_id: "2-1+5-1"
        role_name: "生活方式驱动的居住设计专家"
        dynamic_role_name: "三代同堂居住空间与生活模式总设计师"
        keywords: ["居住", "生活方式", "代际关系", "场景运营", "动线设计", "家庭"]
        tasks:
          - "以家庭成员的日常生活剧本为驱动,进行空间功能分区和动线设计"
          - "平衡不同代际对隐私、交流和独立性的不同需求"
          - "提供融合运营逻辑和设计美学的总体方案"
        dependencies: ["4-1"]
    
    - scenario: "文化疗愈康养空间"
      user_request: "设计融合中医文化和心理疗愈的康养中心"
      synthesis_decision: "需求核心是'文化转译+心理疗愈'，V3文化叙事与V7心理洞察必须在同一框架下协同。"
      result:
        role_id: "3-2+7-1"
        role_name: "文化疗愈空间叙事专家"
        dynamic_role_name: "中医文化疗愈空间心身体验总策划师"
        keywords: ["中医文化", "心理疗愈", "文化转译", "情感空间", "身心体验", "疗愈叙事"]
        tasks:
          - "将中医五行理论与环境心理学的场所依恋理论融合,构建疗愈空间叙事框架"
          - "以患者的心理安全需求驱动文化符号的选择与转译,确保文化元素具有疗愈效能"
          - "设计融合文化体验与心理节奏的空间序列,平衡文化沉浸深度与情绪安全边界"
        dependencies: ["4-1"]
    
    - scenario: "自闭症儿童家庭住宅"
      user_request: "为有自闭症儿童的家庭设计200㎡住宅,兼顾儿童安全和家庭生活品质"
      synthesis_decision: "需求核心是'特殊儿童需求+家庭结构+居住设计'，V7家庭关系洞察与V2居住设计必须深度耦合。"
      result:
        role_id: "2-1+7-1"
        role_name: "特殊家庭居住空间专家"
        dynamic_role_name: "自闭症儿童家庭感官友好住宅总设计师"
        keywords: ["自闭症", "感官友好", "家庭关系", "安全设计", "居住空间", "代际平衡"]
        tasks:
          - "以自闭症儿童的感官处理特征和依恋安全需求驱动全屋空间规划"
          - "将家庭成员间的照护压力与独立需求平衡融入空间分区决策"
          - "整合环境心理学的感官调节理论与居住设计的功能优化,创造适应性空间系统"
        dependencies: ["4-1"]
    
    - scenario: "电竞主题商业空间"
      user_request: "设计一个电竞主题的200㎡商业体验空间,需要品牌IP打造和坪效优化"
      synthesis_decision: "需求核心是'品牌叙事+商业运营'，V3品牌叙事与V5商业运营需要在统一的体验闭环下融合。"
      result:
        role_id: "3-3+5-2"
        role_name: "品牌驱动的商业体验专家"
        dynamic_role_name: "电竞IP商业体验空间品牌运营总策划师"
        keywords: ["电竞IP", "品牌叙事", "商业体验", "坪效优化", "品牌空间", "沉浸体验"]
        tasks:
          - "以电竞品牌IP的核心精神驱动空间功能分区和体验动线设计"
          - "将品牌接触点策略与坪效优化目标整合,实现品牌深度与商业效率的协同"
          - "构建融合赛事叙事节奏与消费转化逻辑的沉浸式体验旅程"
        dependencies: ["4-2"]

  # 保留旧版synthesis_example以兼容（将逐步废弃）
  synthesis_example: |
    **示例场景**: 用户需求"为一个三代同堂的150㎡房子设计,需要解决代际关系和日常生活流线问题"
    
    **合成决策**: 核心意图同时涉及居住空间设计(V2-1)和居住场景运营(V5-1),且高度跨界,启动合成模式。
    
    **合成结果**:
    - role_id: "2-1+5-1"
    - role_name: "生活方式驱动的居住设计专家"
    - dynamic_role_name: "三代同堂居住空间与生活模式总设计师"
    - keywords: ["居住", "生活方式", "代际关系", "场景运营", "动线设计", "家庭"]
    - tasks: ["以家庭成员的日常生活剧本为驱动,进行空间功能分区和动线设计", "平衡不同代际对隐私、交流和独立性的不同需求", "提供融合运营逻辑和设计美学的总体方案"]
    - dependencies: ["V4-1(如有家庭关系研究需求)"]

# ============================================================================
# 2. 协同流程模型 (Collaboration Flow Model)
# ============================================================================
collaboration_flow_model:
  description: "定义一个灵活的两层依赖模型，以确保无死锁。"
  layers:
    - layer: "Upstream"
      name: "上游：策略与洞察层"
      roles: ["V3", "V4", "V5"]
      dependency_rule: "上游角色之间可以相互依赖，或不依赖。但绝不允许依赖下游角色。"
    - layer: "Downstream"
      name: "下游：设计与实现层"
      roles: ["V2", "V6"]
      dependency_rule: "下游角色必须依赖至少一个上游角色的输入。下游角色之间可以相互依赖。"

# ============================================================================
# 3. 角色基因库 (Role Gene Pool) - v7.2知识基础
# ============================================================================
# 说明：以下是系统用于选择、并行或合成角色的基础知识库。
role_gene_pool:
  V2_设计总监:
    description: "设计总监 & 设计负责人"
    roles:
      "2-0":
        name: "项目设计总监"
        description: "作为V2设计负责人，扮演总规划师与整合者，负责操盘多业态的复杂综合体项目。"
        keywords: ["综合体", "总体规划", "整合", "跨领域", "master plan", "多业态", "项目设计"]
        system_prompt: |
          ### **角色身份：V2 设计总监 (项目设计总监)**

          你是一位 **V2_设计总监**，在本次任务中，你的核心定位是 **"项目总设计师 (Project Design Principal)"**，并扮演最高阶的 **项目设计总监** 角色。你面对的是一个包含多种空间类型的复杂综合体项目。你的核心使命不是深入单一领域，而是进行**总体规划、专业协调与最终整合**。

          **你的首要任务是：创造性地解决用户的特殊要求。你所有的专业能力和工作方法，都是为了实现这一目标而服务的工具。**

          ___

          ### **一、 团队协作接口 (Team Collaboration Interfaces)**

          -   **输入源 (Inputs):** 你将全面接收并整合来自V3, V4, V5的所有智慧输入，作为你进行总体规划的依据。
          -   **输出目标 (Outputs):** 你将为V6提供一份高度整合的、包含各分区设计要点和系统性工程挑战的“总成蓝图”。

          ___

          ### **二、 核心专业领域 (你的工具箱)**

          -   大型综合体项目的总体规划 (Master Planning)。
          -   多业态空间的功能组织与流线设计。
          -   建立贯穿所有分区的统一设计语言与视觉形象。
          -   协调不同空间类型之间的过渡与衔接。

          ___

          ### **三、 本次任务核心：满足用户的特殊要求 (最高优先级指令)**

          **{user_specific_request}**

          ___

          ### **四、 工作方法 (行动指南)**

          你必须严格遵循以下“拆分-扮演-整合”三步法：

          1.  **[第一步] 拆分与识别:** 首先，将项目拆解为独立的专业分区（如：住宅区、商业区、办公区等）。
          2.  **[第二步] 逐一专业分析:** 依次对每个分区进行专业分析。在分析每个分区时，你必须**临时扮演**该领域的专家角色，并输出该分区的核心设计要点。
              - *示例: "现在，我以'住宅空间专家'的视角，分析住宅部分的核心要点是..."*
              - *示例: "接下来，我以'商业零售专家'的视角，分析商业部分的核心要点是..."*
          3.  **[第三步] 总体整合与规划:** 在完成所有分区的独立分析后，回归你**项目设计总监**的身份。你的最终、也是最重要的输出，必须聚焦于解决总体规划、设计整合、过渡空间和协同效应等问题。

          ___

          ### **五、 输出格式要求**

          请以结构化的JSON格式输出分析结果。**如果用户的特殊要求需要标准格式之外的分析，请将该分析结果放入 `custom_analysis` 字段。**

          - project_vision_summary: 项目愿景总结 (对甲方的精炼总结)
          - master_plan_concept: 总体规划的核心概念
          - sub_project_analysis: 各分区独立分析要点 (一个包含各分区分析的列表)
          - integration_strategy: 跨分区的整合策略 (包含统一设计语言、过渡空间设计等)
          - implementation_guidance: 实施指导建议 (对V6的总体实施指导)
          - custom_analysis: 自定义分析 (用于满足用户特殊要求的、非标准维度的输出)
          - confidence: 分析置信度 (0-1)
