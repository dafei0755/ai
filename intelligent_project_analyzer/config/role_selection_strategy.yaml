    置信度体系说明:
    1. 角色选择置信度: 评估"是否选对了合适的角色组合"(本阶段输出)
    2. 角色执行置信度: 评估"每个角色是否能高质量完成任务"(角色工作时输出)
    
    两层置信度相互独立但互补:
    - 选择置信度高 + 执行置信度高 = 理想状态
    - 选择置信度高 + 执行置信度低 = 选对人但信息不足,需补充输入
    - 选择置信度低 + 执行置信度高 = 角色选择可能冗余,但仍能产出价值
  
  explanation_template: |
    ## 角色选择决策说明 (v7.3 目标导向与输入验证增强版)\n    \n    ### 1. 协同模式决策 (Collaboration Model Decision)\n    - **核心需求**: {{user_request_summary}}\n    - **决策结论**: 系统判定当前最合理的协同模式为 **{{chosen_collaboration_model}}**。\n    - **决策理由**: {{reasoning_for_model_choice}}\n    \n    ### 2. 团队角色构成与职责\n    | 角色ID | 原始名称 | 动态角色名称 (本次任务) |\n    | :--- | :--- | :--- |\n    | **{{role_1_id}}** | {{role_1_base_name}} | **{{role_1_dynamic_name}}** |\n    | **{{role_2_id}}** | {{role_2_base_name}} | **{{role_2_dynamic_name}}** |\n    | ... | ... | ... |\n\n    ### 3. 最终团队组合与置信度\n    - **团队成员**: **{{final_team_list}}**\n    - **角色选择置信度**: {{confidence_score}}% (评估角色组合的合理性)\n    - **协作说明**: 团队将按照 **{{chosen_collaboration_model}}** 模式高效协作。每个角色的具体身份已通过"动态角色名称"精准定义，确保以最具针对性的方式解决问题。\n    \n    ### 4. 输入完整性评估 (v7.3新增)\n    - **用户输入评估**: {{input_completeness_assessment}}\n    - **潜在风险**: {{potential_input_gaps}}\n    - **建议**: 所选角色均内置输入验证机制,如信息不足会在执行时给出 missing_inputs_warning。

    ### 3. 最终团队组合与置信度
    - **团队成员**: **{{final_team_list}}**
    - **整体置信度**: {{confidence_score}}%

# ============================================================================
# 5. 标签驱动的权重计算规则 (Tag-Based Weight Calculation Rules)
# ============================================================================
# 用于 RoleWeightCalculator 根据需求文本动态计算角色权重
# 权重越高的角色应承担更多任务（差异化任务分配，避免平均主义）
tag_based_rules:
  # 基础权重：每个角色类别的默认权重
  base_weights:
    V2_设计总监: 1.5
    V3_叙事与体验专家: 1.3
    V4_设计研究员: 1.8  # 默认较高，因为几乎所有项目都需要研究支持
    V5_场景与行业专家: 1.2
    V6_专业总工程师: 1.0
    V7_社会关系与心理洞察专家: 0.9  # 社会关系与心理洞察，需求较专
    V8_政策与治理顾问: 0.8  # 政策对齐与治理结构，按需激活
