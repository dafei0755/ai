        tags_all: ["community"]
    - variant: office
      when:
        tags_all: ["office"]
    - variant: campus
      when:
        tags_all: ["campus"]
    - variant: tourism
      when:
        tags_all: ["tourism"]
    - variant: competition
      when:
        tags_all: ["competition"]
    - variant: payback
      when:
        tags_all: ["payback"]
