      title: "再确认铺位能不能成立"
      prompt_text: "第二轮只确认会改变能不能推进的底线，不把不确定条件包装成方案。"
      pages:
        - page_title: "先保硬条件"
          prompt_text: "如果只能先确认一组底线，你最担心哪一类条件不成立？"
          response_mode: "multi_select"
          max_select: 2
          helper_text: "这些条件不清楚时，只能做条件判断，不能直接定平面和设备落位。"
          allow_freetext: true
          options:
            - id: "water_power_fire"
