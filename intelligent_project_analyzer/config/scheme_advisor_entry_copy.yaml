  signals:
    commuter: ["通勤", "地铁", "快成交", "高频", "transit", "office"]
    mall_conversion: ["商场", "顺手", "转化", "路过", "门头"]
    delivery: ["外卖", "自提", "骑手", "取餐", "delivery"]
    high_ticket: ["高客单", "毛利", "客单"]
    low_investment: ["低投入", "投入控制", "平衡投入", "投入边界", "预算"]
    peak_output: ["出杯", "高峰", "吧台", "效率", "peak_output", "operational_diagnostic"]
    property_order: ["物业", "排队", "通道", "秩序", "外溢", "上下水", "给排水", "电量", "排烟", "消防", "property_order", "hard_boundary"]
    payback: ["回本", "租金", "月租", "现金回收"]
    brand_trust: ["品牌", "信任", "灯光", "体验"]

  model_label_rules:
    - when: ["commuter", "mall_conversion"]
      text: "地铁通道口高频转化型茶饮空间"
    - when: ["delivery", "peak_output"]
      text: "小面积外带与外卖解耦型茶饮空间"
    - when: ["low_investment", "payback"]
      text: "高租金快回本压力型茶饮空间"
    - default: true
      text: "小面积高频外带型茶饮空间"

  model_sentence_rules:
    - when: ["mall_conversion", "low_investment"]
      text: "这不是靠大投入堆体验的店，而是要用有限投入抓住商场通道人流的即时转化。"
    - when: ["commuter", "peak_output"]
      text: "这更像通勤客即买即走模型，真正压力在识别够快、出杯够稳、排队不乱。"
    - when: ["delivery"]
      text: "这不是单纯到店生意，外卖/自提会把取餐口、等待区和后场组织推到关键位置。"
    - when: ["high_ticket"]
      text: "你在尝试用客单和毛利修正小面积模型，但这会反过来要求菜单、设备和品牌信任一起成立。"
    - default: true
      text: "它不是普通茶饮装修，而是高租金、小面积、无座外带条件下的回本模型验证。"

  lever_sentence_rules:
    - when: ["mall_conversion"]
      text: "真正决定成败的是路过的人能不能在几秒内看懂、相信并停下，不是先讨论风格高级不高级。"
    - when: ["peak_output"]
      text: "真正决定成败的是高峰期制作、排队和取餐能不能分开跑，不是吧台做得好不好看。"
    - when: ["low_investment"]
      text: "真正决定成败的是钱先花在哪个会影响回本的界面，而不是把预算平均撒到每个部分。"
    - when: ["property_order"]
      text: "真正决定成败的是店铺效率不能和商场通道秩序冲突，否则好流量会变成运营风险。"
    - default: true
      text: "真正决定成败的是回本目标、菜单效率、通道转化和投入边界能不能被同一套空间逻辑统筹。"

  directory_focus:
    payback: ["回本支撑逻辑", "投入节奏"]
    low_investment: ["回本支撑逻辑", "投入节奏"]
    mall_conversion: ["门头识别与即时转化"]
    commuter: ["门头识别与即时转化"]
    peak_output: ["吧台出杯效率"]
    delivery: ["取餐外卖与排队边界"]
    property_order: ["取餐外卖与排队边界"]
    brand_trust: ["小面积品牌信任"]
    default: ["门头转化", "出杯效率", "排队边界", "投入控制"]

