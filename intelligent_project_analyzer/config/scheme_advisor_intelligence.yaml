version: "v1.0"
description: >
  Renderer vocabulary and scoring weights for the Scheme Advisor entry
  intelligence packet. This file is expression-layer configuration only; space
  type detection, ontology activation, and knowledge binding come from the
  classification / ontology / knowledge registries.

labels:
  project_goal: 项目目标
  users: 使用者
  spatial_scope: 空间范围
  constraints: 约束条件
  risk_validation: 风险验证
  success_metrics: 成功标准
  dining_concept_and_positioning: 餐饮定位
  customer_flow_and_seating_capacity: 客流与容量
  front_of_house_vs_back_of_house: 前后场比例
  noise_zoning_and_acoustic_comfort: 噪声与舒适度
  table_turnover_and_peak_efficiency: 翻台与高峰效率
  brand_atmosphere_and_theme: 品牌氛围
  staff_circulation_and_service_flow: 员工服务动线
  operate_model_alignment: 经营模型对齐
  queue_and_pickup_decoupling: 排队与取餐解耦
  front_back_house_boundary: 前后场边界
  safety_and_mep_feasibility: 安全与机电可行性
  brand_memory_point: 品牌记忆点
  fire_compliance: 消防合规
  mep_feasibility: 机电可行性
  queue_conflict: 排队冲突
  equipment_clearance: 设备净距
  cost_risk: 成本风险
  acoustic_discomfort: 声学不适
