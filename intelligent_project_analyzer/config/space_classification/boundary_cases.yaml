# =============================================================================
# Boundary Cases  ⭐ 空间分类的"歧义判断协议"
# =============================================================================
#
# 一句话: 当 detector 同时命中 2 个或以上 project_type 候选,
#         本文件提供"该选哪个 / 是否需要澄清"的协议。
#
# -----------------------------------------------------------------------------
# 【为什么需要本文件】
# -----------------------------------------------------------------------------
# 关键词分类有天然边界冲突 — 比如:
#   "民宿集群" 同时是 rural_construction + commercial_hospitality
#   "工业遗存" 同时是 urban_renewal_heritage + industrial_conversion
#   "养老社区" 同时是 healthcare_wellness + community_public
#
# 单纯靠"哪个 type 的关键词命中多就选哪个" 在这些场景下不可靠。
# 本文件让 detector 命中 boundary_keyword 时, **不直接加分**, 而触发本协议:
#   1. 比对两个候选 type 各自的 strong_signals 谁更强
#   2. 输出 boundary_case_ids (让 SpaceClassificationService 后续处理)
#   3. 必要时由 SpaceClassificationService 取 clarification_questions
#      生成 ClarificationRequest 让用户澄清
#
# -----------------------------------------------------------------------------
# 【与 PROJECT_TYPE_REGISTRY 的事实源边界】
# -----------------------------------------------------------------------------
# 本文件内的 strong_signals 字段**仅作 boundary 判别引用**,
# 不是 keywords 的事实源。
# 真正的 project_type keywords 仍在 project_type_detector.py::PROJECT_TYPE_REGISTRY。
# 本文件改动不影响 detector 主检测算法, 仅影响 boundary 触发后的二次判断。
#
# -----------------------------------------------------------------------------
# 【schema v2.0 说明】
# -----------------------------------------------------------------------------
# v2.0 升级 (v1.9 配套):
#   - boundary_keywords (新增): 触发本 case 的关键词清单
#   - primary_preference_rules (新增): 每个 type 的 strong_signals (倾向证据)
#   - risk_keywords (保留): 兼容 v1, 不再是新协议主字段
#
# 数量: 7 → 20 个 case (新增 13 个高风险边界对)
# =============================================================================

schema_version: boundary_cases.v2.0
version: "2026.05.v2"
description: "High-risk spatial classification boundary cases (v2.0 with primary_preference_rules)"
owner: core_team
review_status: approved
last_updated: 2026-05-20

cases:

  # ═══════════════════════════════════════════════════════════════════════════
  # 一、住宿与生活类边界 (4)
  # ═══════════════════════════════════════════════════════════════════════════

  hospitality_vs_residential:
    types: [commercial_hospitality, personal_residential]
    boundary_keywords:
      - 像家
      - 居家感
      - 生活方式酒店
      - 长住公寓
      - 度假宅
    risk_keywords: ["像家", "居家感", "生活方式", "客厅", "卧室", "温暖"]
    decision_axis:
      - success_standard
      - primary_user
      - usage_duration
      - operation_logic
    primary_preference_rules:
      commercial_hospitality:
        strong_signals: [客房, 入住, 房态, OTA, 前台, 管家, 客单价, 度假定位, 短住]
      personal_residential:
        strong_signals: [自住, 私宅, 家人, 长期居住, 户型, 业主]
    clarification_questions:
      - "这个空间主要服务短住客人，还是长期家庭生活？"
      - "项目最怕失败在住宿体验和运营，还是家庭日常不舒适？"
    risks:
      as_residential: "会忽略客群旅程、公私分区和运营弹性。"
      as_hospitality: "会过度商业化，弱化长期生活细节。"

  hospitality_vs_hybrid_residential_commercial:
    types: [commercial_hospitality, hybrid_residential_commercial]
    boundary_keywords:
      - 公寓酒店
      - 服务式公寓
      - 酒店式公寓
      - 品牌公寓
      - 雅诗阁
      - 辉盛阁
      - 馨乐庭
      - 长租公寓
    decision_axis:
      - short_stay_vs_long_stay
      - hotel_operation_vs_residential_lease
      - service_intensity
    primary_preference_rules:
      commercial_hospitality:
        strong_signals: [客房, 房态, 短住, 度假, 前台, 房价, OTA, 入住体验]
      hybrid_residential_commercial:
        strong_signals: [长租, 长期居住, 商业配套, 住商一体, 居住兼经营, 上下分层]
    clarification_questions:
      - "这个项目主要是短住经营，还是长期居住+商业服务复合？"
      - "首要锁定的是房态/OTA 房价管理，还是长租合同和居住功能？"
    risks:
      as_hospitality: "会用酒店运营逻辑套用长租公寓, 忽略居家收纳和长期生活。"
      as_hybrid: "会低估短住客群旅程和品牌服务体系。"

  hospitality_vs_rural_construction:
    types: [commercial_hospitality, rural_construction]
    boundary_keywords:
      - 民宿集群
      - 乡村民宿
      - 山地民宿集群
      - 村庄度假
      - 民宿聚落
    risk_keywords: ["乡村", "村庄", "村民", "乡建", "乡村振兴", "共创", "村集体"]
    decision_axis:
      - lodging_operation_vs_public_value
      - tourist_vs_community_primary_user
      - governance_structure
      - private_operator_vs_village_collective
    primary_preference_rules:
      commercial_hospitality:
        strong_signals: [客房, 入住, 房态, OTA, 前台, 管家, 客单价, 度假品牌, 房价]
      rural_construction:
        strong_signals: [乡村振兴, 村集体, 村民, 村民共创, 产业导入, 公共空间, 农文旅, 在地农耕]
    clarification_questions:
      - "项目成败主要取决于住宿经营，还是村庄整体更新与公共性？"
      - "主要服务对象是游客，还是村民/村集体/地方产业共同体？"
    risks:
      as_hospitality: "可能低估村民关系、公共性和产业联动。"
      as_rural_construction: "可能稀释住宿产品、客群旅程和运营回报。"

  hospitality_vs_healthcare:
    types: [commercial_hospitality, healthcare_wellness]
    boundary_keywords:
      - 疗愈酒店
      - 康养度假
      - 度假疗愈
      - 健康度假村
      - 温泉康养
    risk_keywords: ["疗愈", "康养", "修复", "冥想", "理疗", "健康餐", "泡汤", "康复"]
    decision_axis:
      - stay_experience_vs_care_result
      - medical_or_care_process
      - safety_and_accessibility_level
    primary_preference_rules:
      commercial_hospitality:
        strong_signals: [客房, 入住, OTA, 度假定位, 房价, 前台]
      healthcare_wellness:
        strong_signals: [医疗资质, 护理动线, 康复, 临终关怀, 治疗流程, 医生, 病房]
    clarification_questions:
      - "这个项目的主要成功标准是度假停留体验，还是康复照护结果？"
      - "是否涉及医疗资质、治疗流程、护理关系或持续健康管理？"
    risks:
      as_hospitality: "可能低估安全、照护、流程、伦理和技术支持。"
      as_healthcare: "可能过度制度化，压缩度假体验和情绪修复。"

  # ═══════════════════════════════════════════════════════════════════════════
  # 二、改造与更新类边界 (3) — 关键泛词"改造/活化/再生"
  # ═══════════════════════════════════════════════════════════════════════════

  urban_renewal_heritage_vs_industrial_conversion:
    types: [urban_renewal_heritage, industrial_conversion]
    boundary_keywords:
      - 工业遗存
      - 工业遗址
      - 废弃工厂
      - 老厂房
      - 旧厂区
      - 粮仓改造
      - 旧码头
    decision_axis:
      - cultural_memory_vs_production_function
      - exhibition_vs_office_production
      - heritage_protection_level
    primary_preference_rules:
      urban_renewal_heritage:
        strong_signals: [文物保护, 历史建筑, 文化记忆, 展览, 美术馆, 文创, 街区肌理, 真实性, 民国, 历史风貌]
      industrial_conversion:
        strong_signals: [产业园, 创意园, 厂房办公, 工厂改造办公, 生产, 物流, 仓储, 大跨度]
    clarification_questions:
      - "项目主要追求历史文化活化和展览价值，还是生产+办公的功能转型？"
      - "建筑本身有文物保护级别 / 历史风貌要求吗？"
    risks:
      as_heritage: "会过度保护, 压缩新的生产/办公功能空间。"
      as_industrial: "会用产业园逻辑套用, 破坏文化记忆与历史肌理。"

  renovation_vs_residential:
    types: [residential_renovation, personal_residential]
    boundary_keywords:
      - 旧宅
      - 老房
      - 翻新
      - 改造
      - 二手房
      - 原始格局
      - 老破小
    risk_keywords: ["旧宅", "老房", "翻新", "改造", "二手房", "原始格局"]
    decision_axis:
      - existing_condition_vs_lifestyle
      - structural_boundary
      - equipment_upgrade
    primary_preference_rules:
      residential_renovation:
        strong_signals: [二手房, 老房改造, 拆改, 承重墙, 原有管线, 老破小, 房龄, 翻新]
      personal_residential:
        strong_signals: [新房装修, 婚房, 大平层, 私宅, 别墅, 户型, 业主, 自住]
    clarification_questions:
      - "这个项目的第一边界是家庭生活方式，还是原始格局/结构/设备条件？"
      - "是否存在承重、管线、设备或拆改限制？"
    risks:
      as_residential: "可能过度理想化布局，低估拆改和施工代价。"
      as_renovation: "可能过度保守，弱化新的生活方式组织。"

  urban_renewal_market_vs_commercial_retail:
    types: [urban_renewal_market, commercial_retail]
    boundary_keywords:
      - 菜市场改造
      - 老百货改造
      - 商业街区升级
      - 综合体改造
      - 业态重组
      - 商业更新
    decision_axis:
      - public_livelihood_vs_commercial_revenue
      - civic_value_vs_retail_efficiency
      - state_driven_vs_market_driven
    primary_preference_rules:
      urban_renewal_market:
        strong_signals: [城市更新, 政府主导, 公共市场, 民生, 老居民, 渔村文化, 蛇口, 公共客厅, 微更新]
      commercial_retail:
        strong_signals: [坪效, 招商, 租金, 客流, 业态组合, 主力店, 主次主力, 夜经济, 生活方式中心]
    clarification_questions:
      - "项目首要目标是公共民生价值，还是商业运营效率与坪效？"
      - "决策主体是政府/财政，还是商业地产业主？"
    risks:
      as_market: "会低估商业可持续性, 长期靠财政补贴。"
      as_retail: "会过度商业化, 排斥老居民和民生属性。"

