version: "2026.04.v1"
description: >
  Type Operating Profiles connect project type classification to ontology,
  methodology, reusable capabilities, case retrieval, and downstream delivery.
  This file is intentionally small: it covers high-frequency/high-risk types
  first and falls back to the default profile for everything else.

defaults:
  profile_id: general_project_profile
  primary_bucket: general
  display_label: 项目
  ontology_framework: meta_framework
  questionnaire_profile: general
  deliverable_profile: general_deliverable_profile
  floorplan_profile: general_floorplan_reasoning
  visual_prompt_profile: general_visual_profile
  domain_framework:
    required_dimensions:
      - project_goal
      - users
      - spatial_scope
      - constraints
      - risk_validation
    required_min_coverage: 0.60
  ontology_profile:
    profile_id: general_ontology
    activated_objects:
      - user
      - space
      - constraint
      - goal
    activated_relations:
      - goal_constrains_space
      - user_uses_space
    activated_constraints:
      - scope_clarity
      - feasibility_boundary
    key_tensions:
      - ambition_vs_feasibility
      - function_vs_experience
  type_method_profile:
    profile_id: method.type.general_project.v1
    priority_sequence:
      - project_goal
      - users
      - constraints
      - success_metrics
  general_method_profile:
    profile_id: general_gap_and_tension_check.v2
    active_checks:
      - check_id: missing_goal
        severity: error
      - check_id: missing_user
        severity: error
      - check_id: missing_constraints
        severity: warning
      - check_id: goal_user_mismatch
        severity: warning
      - check_id: scope_overload
        severity: warning
      - check_id: ambiguity_blocker
        severity: blocker
  knowledge_base_binding:
    search_tags:
      - general_project
    knowledge_packages:
      - kp.general_project
  system_binding:
    target_objects:
      - AlignedBrief
      - ExecutionPlan
    required_freeze:
      - UseIntentBaseline

