# =============================================================================
# ontology.yaml — 空间设计的"通识教材"
# =============================================================================
#
# ⭐ 本文件的定位 (核心):
#   - 写"该想什么问题" (跨业态共通的设计议题)
#   - 17 个 ontology_frameworks: 按项目类型组织设计议题
#   - 16 个 activation_profiles: 推荐激活的本体维度 (粗粒度推荐)
#   - 14 个 expert_extensions: 不同专家视角的补充
#
# ⭐ 不写什么 (避免和激活包重叠):
#   - 不写"具体怎么做" (这是 activation_packs/*_pack.yaml 的事)
#   - 不写可量化参数 (通道宽 1100mm / 出杯 60-90 杯) → 激活包
#   - 不写设备清单 / 模拟模型 / 场景预设 → 激活包
#   - 不写业态专属参数 → 激活包
#
# ⭐ 与激活包的关系:
#   - 激活包通过 routing_binding.parent_project_type_id 挂在本文件
#     的某个 framework 下 (单向继承)
#   - 没有激活包时, 系统用 ontology framework 兜底 (规则 6, 70 分回答)
#   - 有激活包时, 系统在 ontology 基础上叠加激活包专属内容 (90 分回答)
#
# ⭐ 边界规则详见:
#   👉 knowledge_base/activation_packs/ACTIVATION_PACK_BOUNDARY_RULES.md
#
# -----------------------------------------------------------------------------
# v1.8 维度引用块 (Dimension References)
# -----------------------------------------------------------------------------
# E1-E9 维度的事实源已迁移到 knowledge_base/ontology_dimension_registry.yaml
# (v1.8 §12 + v1.7 §3.2)。
#
# 本文件内的 meta_framework.ontological_foundations 内嵌定义保留为
# deprecated_compat, OntologyLoader 仍可读取以维持向后兼容,
# 但新代码应通过 dimension_resolver 从 registry 加载。
#
# Framework 引用 E 维度的推荐方式 (示范, 见 commercial_dining_v18_example):
#   framework_xxx:
#     ontology_dimension_ids:
#       - E2_body_movement
#       - E6_operation_system
#       - E9_constraint_risk
#     ...
# =============================================================================
dimension_registry_source: knowledge_base/ontology_dimension_registry.yaml
dimension_loading_policy:
  primary: ontology_dimension_registry  # 新协议: 从 registry 加载
  fallback: ontological_foundations     # 旧协议: 从本文件 meta_framework 加载
  migration_status: phase_2_dual_run     # 双跑期

# =============================================================================
# v1.8 示范 framework — 用 ontology_dimension_ids 引用维度
# 仅为示范, 未替代下方 ontology_frameworks.commercial_dining
# OntologyLoader 改造后可优先读此节
# =============================================================================
ontology_framework_v18_examples:
  commercial_dining_v18:
    parent_framework: commercial_dining
    activation_pack_id: tea_drink_store_pack
    activation_pack_file: activation_packs/tea_drink_store_pack.yaml
    ontology_dimension_ids:
      - E2_body_movement
      - E3_light_material
      - E5_time_sequence
      - E6_operation_system
      - E7_social_relation
      - E8_symbol_narrative
      - E9_constraint_risk
    note: |
      此节由 OntologyLoader Layer 4 消费, 与下方 ontology_frameworks
      内的 commercial_dining 框架共存。
      内嵌字段已迁移到 ontology_dimension_registry.yaml,
      此处只引用 id。

ontology_frameworks:
  # 🆕 通用元框架 (Meta Framework) - 项目类型未识别时的回退框架
  meta_framework:
    universal_dimensions: # 通用维度 (Universal Dimensions)
      - name: "核心目标与愿景 (Core Goal & Vision)"
        description: "项目的核心目的和预期成果。回答'为什么'和'要达成什么'。"
        ask_yourself: "这个项目最终要解决什么问题？成功是什么样子？"
        examples: "提升用户体验 (Enhance User Experience), 优化空间效率 (Optimize Space Efficiency), 创造独特氛围 (Create Unique Atmosphere), 传达品牌理念 (Convey Brand Philosophy)"
      - name: "关键利益相关方 (Key Stakeholders)"
        description: "影响项目成败的关键人物、群体或实体。包括决策者、使用者、影响者。"
        ask_yourself: "谁是最终决策者？谁的需求最重要？存在哪些潜在冲突？"
        examples: "项目所有者 (Project Owner), 最终用户 (End Users), 管理团队 (Management Team), 投资方 (Investors), 监管机构 (Regulatory Bodies)"
      - name: "物理与资源约束 (Physical & Resource Constraints)"
        description: "项目面临的客观限制条件。包括空间、预算、时间、技术等。"
        ask_yourself: "有哪些不可改变的硬性限制？哪些约束可以通过创意突破？"
        examples: "固定面积 (Fixed Area), 预算上限 (Budget Cap), 交付时间 (Delivery Timeline), 结构限制 (Structural Constraints), 法规要求 (Regulatory Requirements)"
      - name: "功能需求清单 (Functional Requirements)"
        description: "空间必须支持的具体活动和功能。是设计的基础支撑。"
        ask_yourself: "这个空间需要容纳哪些活动？各功能区的优先级是什么？"
        examples: "工作区域 (Workspace), 社交空间 (Social Space), 储物需求 (Storage Needs), 技术设施 (Technical Facilities), 特殊功能区 (Special Function Zones)"
      - name: "期望氛围与调性 (Desired Atmosphere & Tone)"
        description: "空间应传达的情感特质和美学风格。是设计的精神内核。"
        ask_yourself: "希望人们在这个空间中感受到什么？温暖、冷静、激情、专业？"
        examples: "温馨舒适 (Warm & Cozy), 简约高级 (Minimal & Sophisticated), 活力创新 (Vibrant & Innovative), 沉稳专业 (Calm & Professional), 自然有机 (Natural & Organic)"
      - name: "长期适应性 (Long-term Adaptability)"
        description: "空间应对未来变化的灵活性。考虑功能升级、人员变化、技术演进。"
        ask_yourself: "未来3-5年可能发生什么变化？如何设计可扩展、可调整的空间？"
        examples: "模块化家具 (Modular Furniture), 可调整分区 (Adjustable Partitions), 预留技术接口 (Reserved Tech Interfaces), 多功能空间 (Multi-purpose Spaces)"

    contemporary_imperatives: # 当代命题 (Contemporary Imperatives) - 🆕 现代建筑设计的必答题
      - name: "可持续发展战略 (Sustainability Strategy)"
        description: "环境、社会、经济三重底线的平衡。从绿色建筑到碳中和的系统性思考。"
        ask_yourself: "这个项目的碳足迹如何？可再生材料占比？运营阶段的环境影响？社区贡献？"
        examples: "LEED认证 (LEED Certification), 零碳建筑 (Net-zero Carbon), 循环经济 (Circular Economy), 生物多样性保护 (Biodiversity Protection), 社区共益 (Community Benefit)"
      - name: "健康与幸福感 (Health & Wellbeing)"
        description: "从物理健康到心理福祉的全方位人本关怀。WELL认证的核心议题。"
        ask_yourself: "空气质量达标吗？自然光充足吗？声环境舒适吗？有促进活动的设计吗？社交连接如何？"
        examples: "空气净化 (Air Purification), 昼光设计 (Daylighting), 声学舒适 (Acoustic Comfort), 运动鼓励 (Movement Encouragement), 生物亲和 (Biophilic Design)"
      - name: "数字化与智能化 (Digitalization & Intelligence)"
        description: "物联网、AI、数据驱动的空间管理与用户体验优化。"
        ask_yourself: "智能系统的介入边界在哪？数据隐私如何保护？技术故障时的备用方案？人机交互是否友好？"
        examples: "智能楼宇管理 (Smart Building Management), 物联网传感 (IoT Sensing), AI能源优化 (AI Energy Optimization), 无接触交互 (Contactless Interaction), 数字孪生 (Digital Twin)"
      - name: "韧性与应急能力 (Resilience & Emergency Preparedness)"
        description: "应对气候变化、自然灾害、公共卫生危机等极端事件的设计韧性。"
        ask_yourself: "极端天气（暴雨、台风、热浪）如何应对？疫情隔离空间预留了吗？能源/水供应中断时的备用方案？"
        examples: "洪涝防范 (Flood Resistance), 抗震加固 (Seismic Reinforcement), 应急避难 (Emergency Shelter), 疫情隔离 (Pandemic Isolation), 备用能源 (Backup Energy)"
      - name: "文化敏感性与地域性 (Cultural Sensitivity & Place Identity)"
        description: "尊重本土文化、历史记忆、地方特色的设计态度。反对千城一面。"
        ask_yourself: "这个设计'空降'到这里合适吗？本地文化元素如何转译？历史肌理如何尊重？社区认同感如何建立？"
        examples: "历史保护 (Heritage Preservation), 本土材料 (Local Materials), 文化符号转译 (Cultural Symbol Translation), 社区参与设计 (Community Co-design), 场所精神 (Genius Loci)"
      - name: "社会公平与包容性 (Social Equity & Inclusivity)"
        description: "消除物理、经济、社会障碍，让空间真正为所有人服务。"
        ask_yourself: "不同能力的人能否平等使用？经济弱势群体被排斥了吗？多元文化是否被尊重？性别友好吗？"
        examples: "通用设计 (Universal Design), 经济可负担性 (Affordability), 多元文化空间 (Multicultural Space), 性别友好设施 (Gender-inclusive Facilities), 代际融合 (Intergenerational Integration)"

    ontological_foundations: # 本体论基础 (Ontological Foundations) - 空间设计的物质本体与关系基底
      - name: "空间体量与比例 (Spatial Volume & Proportion) [E1]"
        issue_id: E1
        description: "空间作为三维容器的物理本质：体量感、高度比例、压缩与释放的节奏、门槛与边界。这是所有设计的物质起点——先有空间容器，才有功能和意义。关注空间本身的'身体性'，而非仅将空间视为功能的载体。"
        ask_yourself: "这个空间的体量感是什么？天花高度与平面尺度的比例关系如何？从入口到核心空间，是压缩-释放还是渐进-展开？哪里是门槛（threshold）——空间性质发生质变的边界？空间的'负形'（void）与'实体'（mass）如何对话？"
        examples: "层高压缩创造亲密感 (Double-height to intimate compression), 门洞作为空间叙事的标点 (Doorway as spatial punctuation), 中庭体量锚定整体空间秩序 (Atrium volume anchoring spatial order), 走廊的窄-宽节奏引导行进体验 (Corridor width rhythm guiding movement), 结构柱网定义空间的基本韵律 (Column grid defining spatial rhythm)"
      - name: "身体体验与动觉 (Bodily Experience & Kinesthesia) [E2]"
        issue_id: E2
        description: "人体在空间中的物理存在与运动感知：行走、停留、弯腰、攀爬、视线高度、触碰距离。超越'人体工学'的工具性理解，关注身体与空间的现象学关系——人如何通过身体'理解'空间。这是E1（空间）与E6（功能）之间的关键桥梁。"
        ask_yourself: "人的身体在这个空间中如何被'接收'？行走时地面材质的变化是否暗示了区域转换？坐下时的视线高度看到什么？楼梯的踏步尺度是邀请还是阻断？身体的紧张（狭窄处）与放松（开阔处）节奏如何编排？老人、儿童、轮椅使用者的身体经验是否被同等考虑？"
        examples: "踏步比例影响攀爬的身体节奏 (Step proportions affecting climbing rhythm), 吧台高度决定社交的身体关系 (Bar height defining social body relationship), 窗台高度决定坐/倚/望的身体姿态 (Sill height determining sit/lean/gaze posture), 走道宽度编码'擦肩'或'并行'的社交距离 (Corridor width encoding shoulder-brushing or side-by-side social distance), 地面高差作为空间界定的身体信号 (Floor level change as bodily spatial delimiter)"
      - name: "光作为设计材料 (Light as Design Material) [E3]"
        issue_id: E3
        description: "自然光与人工光的物质性：方向、强度、色温、阴影图案、昼夜节律、季节变化。光不是'照明设施'的附属品，而是与材料、空间并列的核心设计材料。光的变化赋予空间时间性（连接E5），光与材料的相遇定义表面品质（连接E4）。"
        ask_yourself: "主要自然光从哪个方向、以什么角度进入？一天中这个空间的光影戏剧如何展开（晨光-正午-黄昏）？北向漫射光与南向直射光分别适合什么活动？人工照明的层次（环境光-重点光-任务光-氛围光）如何组织？有没有'黑暗'也是设计语言的区域？色温变化是否呼应昼夜节律？"
        examples: "天窗创造的光井效果 (Skylight creating a light well), 百叶控制的光影图案随时间移动 (Louvre shadow patterns moving with time), 北向窗为画室提供稳定漫射光 (North window providing stable diffuse light for studio), 壁灯的间接光洗墙创造漂浮感 (Wall sconce indirect light wash creating floating effect), 烛光尺度的低色温光源营造亲密氛围 (Candlelight-scale warm light creating intimacy), 深檐口过滤的光线在白墙上书写季节 (Deep eave filtering light writing seasons on white wall)"
      - name: "材料物性与时间性 (Material Physicality & Temporality) [E4]"
        issue_id: E4
        description: "材料超越'表面装饰'的深层物理属性：热质量（蓄热/散热）、声学特性（吸音/反射）、触觉品质（温润/冰冷/粗糙/光滑）、老化轨迹（铜绿/木纹灰化/石材包浆）。材料的'诚实性'——它是什么就表现为什么，还是被涂层掩盖了本质？材料的时间性与E5直接关联。"
        ask_yourself: "这种材料的触感传达什么情感？它的热导率如何影响体感舒适（赤脚走在石材vs木地板上的差异）？它的声学特性是吸收还是反射（混凝土教堂的回响vs织物包裹的私密感）？十年后它会变成什么样子——是优雅的铜绿(patina)还是廉价的老化(decay)？材料之间的接缝如何处理——是坦诚的缝隙还是精密的对接？"
        examples: "夯土墙的蓄热性能平衡昼夜温差 (Rammed earth thermal mass balancing day-night temperature), 橡木地板随年月形成的脚步磨痕 (Oak floor footpath patina over years), 耐候钢的锈蚀层作为时间叙事 (Corten steel rust layer as time narrative), 手工砖的微差异创造表面活力 (Handmade brick micro-variation creating surface vitality), 混凝土的模板肌理记录建造过程 (Concrete formwork texture recording construction process), 铜扶手被手掌触摸后的光泽变化 (Copper handrail patina from palm contact)"
      - name: "时间与时序动态 (Time & Temporal Dynamics) [E5]"
        issue_id: E5
        description: "空间的第四维度：日内节律（晨-昼-暮-夜的使用模式变化）、季节循环（光照角度、温湿度、景观状态）、生命周期（从新建到老化到再生）、使用节奏（工作日vs周末、淡季vs旺季）。时间不是设计之外的变量，而是需要被主动编排的设计材料。"
        ask_yourself: "这个空间在凌晨5点和下午5点分别是什么状态？夏至和冬至的光线入射角如何改变空间体验？五年内哪些元素会先老化？使用高峰与低谷如何转换？空间能否支持'分时复用'？有没有为未来的功能变化预留弹性？这个设计如何优雅地老去而非过时？"
        examples: "落叶树在夏遮阳冬透光 (Deciduous trees shading in summer, transmitting light in winter), 可翻转的季节性家具布局 (Reversible seasonal furniture layout), 预留管线通道支持未来技术升级 (Reserved service channels for future tech upgrades), 材料选择考虑20年老化轨迹 (Material selection considering 20-year aging trajectory), 分时照明场景对应昼夜使用模式 (Time-based lighting scenes matching day-night use patterns), 模块化隔墙支持家庭结构变化 (Modular partitions supporting family structure changes)"
      - name: "场所精神与叙事建构 (Place Spirit & Narrative Construction) [E6]"
        issue_id: E6
        description: "空间的记忆性、身份认同与故事层：场地历史如何沉淀为可被感知的氛围？设计如何在无需文字说明的情况下'讲述'一个地方的故事？场所精神（Genius Loci）不是抽象概念，而是材料选择、空间序列、光线节奏共同构成的叙事系统。E6是E4（材料时间性）和E5（时序动态）的意义升华——物质和时间叠加后产生的场所认同感。"
        ask_yourself: "这个地方原来是什么？那段历史如何在当下设计中留下可被感知的痕迹而非博物馆式的展陈？如果拆掉所有标牌，人们还能从空间本身'读出'这是什么地方、发生过什么吗？设计是在强化场所记忆还是在擦除它？'文脉'是表面的形式借用（贴传统符号）还是深层的空间逻辑传承？如何区分'在地性表达'与'地域风情的表演'？"
        examples: "保留工厂锯齿屋顶成为展览空间的光源叙事 (Sawtooth roof retained as narrative light source in gallery), 旧码头木桩暴露于新楼板之下讲述港口历史 (Old dock piles exposed beneath new floor narrating harbor history), 古树位置决定庭院中心而非被移走 (Ancient tree location determining courtyard center instead of removal), 夯土层中夹入不同年代的碎片作为时间截面 (Rammed earth layers embedding era-specific fragments as temporal cross-sections), 原有建筑的柱网韵律延续进新加建 (Original column grid rhythm extended into new addition), 本土方言词汇转化为空间命名系统 (Local dialect terms transformed into spatial naming system)"
      - name: "社会关系与共同性 (Social Relations & Collectivity) [E7]"
        issue_id: E7
        description: "空间如何塑造和回应人与人之间的关系：公共性与私密性的梯度、权力关系的空间化表达、陌生人之间的偶遇机制、群体认同的物质基础。这不是'功能分区'的社交区/私密区划分，而是从社会学视角追问：空间在强化还是弱化社会联结？是在包容差异还是在制造隔离？E7与E2（身体体验）交叉：空间距离和身体姿态共同编码了社会关系。"
        ask_yourself: "这个空间对'陌生人相遇'持什么态度——是鼓励、容忍还是回避？'公共性'是真实的（所有人都能舒适使用）还是表演性的（看起来公共但实际设有隐性门槛）？权力关系如何在平面布局中体现——谁占据空间中心，谁被推到边缘？空间是否在无意中排斥了某些群体（老人、残障人士、低收入者、儿童）？能否识别出'反公共空间'的设计特征——驱逐长时停留者的防坐设计、让人无处停留的光滑无遮挡广场？"
        examples: "阶梯看台在非演出时成为非正式社交空间 (Amphitheater steps as informal social space between performances), 走廊加宽创造自然的停留与对话 (Widened corridor creating natural pause-and-talk moments), 共享厨房作为社区凝聚力的物质核心 (Shared kitchen as material core of community cohesion), 可见的内部工作台让顾客感到被邀请参与 (Visible work counter inviting customers into the making process), 不同收入群体共用同一门厅避免社会隔离 (Mixed-income groups sharing same lobby avoiding social segregation), 婴儿车/轮椅坡道与台阶并置而非隐藏于角落 (Pram/wheelchair ramp placed alongside steps rather than hidden in corner)"
      - name: "技术系统作为设计驱动 (Technical Systems as Design Drivers) [E8]"
        issue_id: E8
        description: "结构、机电、围护系统不是设计完成后的'填空题'，而是从概念阶段就参与塑造空间品质的核心力量：结构体系定义空间跨度与节奏，暖通决定天花空间与气流体验，围护系统平衡内外关系。技术约束往往是创意的最佳催化剂。"
        ask_yourself: "结构体系如何影响空间的开敞度与韵律感？管线走向如何与吊顶/地面设计协调——是隐藏还是暴露？空调出风方式如何影响人的体感（直吹不适vs均匀送风的舒适）？围护系统的热工性能如何平衡自然通风与节能？照明控制系统是否支持场景化切换？结构柱是障碍还是空间组织的锚点？"
        examples: "暴露的木结构桁架成为空间特色 (Exposed timber truss becoming spatial character), 地暖取消了散热器释放墙面空间 (Underfloor heating freeing wall space from radiators), 结构悬挑创造的灰空间 (Structural cantilever creating semi-outdoor space), 管线集成在家具系统中的工业风表达 (Services integrated into furniture system as industrial expression), 双层幕墙的呼吸效应与自然通风 (Double-skin facade breathing effect and natural ventilation), 薄壳结构实现无柱大跨度展览空间 (Thin-shell structure achieving column-free exhibition space)"
      - name: "经济伦理与价值分配 (Economic Ethics & Value Distribution) [E9]"
        issue_id: E9
        description: "超越'预算上限'的工具性理解，关注设计中的经济正义：预算如何在可见（表面装饰）与不可见（结构、管线、保温）之间分配？谁承担成本、谁享受价值？全生命周期成本是否优于初始投入最小化？设计师的选材是否透明地对应了价格与品质的关系？经济约束如何反向激发创意？"
        ask_yourself: "预算分配的优先级如何体现价值观——是'面子工程'还是'里子工程'？花在隐蔽工程（防水、保温、隔音）上的钱是否足够？有没有因为初期省钱而导致运营成本飙升的风险？设计方案是否存在'设计师审美溢价'——美学追求与客户可接受成本之间的诚实对话？如何用有限预算创造最大的空间品质？"
        examples: "将预算重点从表面材料转向声学处理 (Shifting budget from surface materials to acoustic treatment), 选择本地材料降低运输成本+建立地域特色 (Local materials reducing transport cost + building regional identity), 可逆性设计允许未来低成本改造 (Reversible design allowing future low-cost renovation), 标准化构件+关键节点精细化的成本策略 (Standardized components + precision at key nodes cost strategy), 被动式设计减少机电系统投入 (Passive design reducing MEP system investment), 全生命周期成本分析替代初始造价最优 (Lifecycle cost analysis replacing initial cost optimization)"

  # 个人/住宅项目框架 (Personal/Residential Framework)
  personal_residential:
    spiritual_world: # 精神世界 (Spiritual World)
      - name: "核心价值观 (Core Values)"
        description: "个体最深层次的、指导所有决策的内在准则。是设计的‘宪法’。"
        ask_yourself: "为了捍卫这个价值观，他/她愿意放弃什么？这个价值观如何在空间选择中体现？"
        examples: "家庭至上 (Family First), 个人自由 (Personal Freedom), 环保主义 (Environmentalism), 极简主义 (Minimalism), 成就导向 (Achievement-Oriented)"
      - name: "心理驱动 (Psychological Drivers)"
        description: "源自潜意识的、更底层的心理需求。如对安全感的渴望、对掌控感的需求、对自我表达的欲望。"
        ask_yourself: "这个空间需要帮助他/她对抗什么恐惧？或满足什么渴望？"
        examples: "寻求庇护 (Seeking Sanctuary), 渴望掌控 (Desire for Control), 彰显地位 (Status Display), 消除焦虑 (Anxiety Reduction)"
      - name: "身份表达 (Identity Expression)"
        description: "个体希望向自己和他人展示的‘我是谁’。空间是其身份认同的舞台和宣言。"
        ask_yourself: "他/她想通过这个空间，讲述一个关于自己的什么故事？"
        examples: "一个有品位的收藏家 (A tasteful collector), 一个自律的创作者 (A disciplined creator), 一个温暖的主人 (A warm host), 一个特立独行者 (A maverick)"
      - name: "人生追求 (Life Aspiration)"
        description: "长远的人生目标或理想生活状态。空间应是实现这一追求的‘载具’或‘训练场’。"
        ask_yourself: "五年后，他/她希望在这个空间里成为一个怎样的人？"
        examples: "实现财务自由 (Achieving financial freedom), 成为专业领域的专家 (Becoming an expert in a field), 拥有宁静的内心 (Having a peaceful inner life), 建立紧密的家庭关系 (Building close family bonds)"

    social_coordinates: # 社会坐标 (Social Coordinates)
      - name: "核心关系人 (Stakeholders)"
        description: "项目中的关键人物及其关系，是人际张力的主要来源。"
        ask_yourself: "谁拥有决策权？谁是影响者？谁是使用者？他们之间的权力结构和潜在冲突是什么？"
        examples: "决策者：女主人；影响者：设计师朋友；使用者：夫妻二人+孩子；潜在冲突：夫妻审美不一致。"
      - name: "职业身份 (Professional Identity)"
        description: "从事的职业及其在个体身份中的占比。关联工作模式、专业需求和社交圈。"
        ask_yourself: "他的职业如何塑造了他的思维方式和生活习惯？空间需要多大程度上服务于其职业？"
        examples: "律师 (Lawyer), 程序员 (Programmer), 艺术家 (Artist), 自由职业者 (Freelancer)"
      - name: "社交模式 (Social Patterns)"
        description: "社交活动的频率、规模、类型和期望氛围。决定了空间的公共性、私密性与灵活性的配比。"
        ask_yourself: "社交是能量的来源还是消耗？是正式的还是随意的？"
        examples: "每周家庭聚餐 (Weekly family dinners), 每月朋友派对 (Monthly friend parties), 不定期两人小酌 (Occasional drinks for two), 从不社交 (Never socializes)"

    material_life: # 物质生活 (Material Life)
      - name: "重要收藏品 (Important Collectibles)"
        description: "承载了个人情感、记忆或投资价值的物品。是物质世界中的‘精神图腾’。"
        ask_yourself: "这些物品是需要被‘展示’以彰显身份，还是需要被‘珍藏’以提供慰藉？"
        examples: "黑胶唱片 (Vinyl records), 限量版球鞋 (Limited edition sneakers), 艺术画作 (Art paintings), 大量书籍 (Large collection of books), 旅行纪念品 (Travel souvenirs)"
      - name: "生活方式 (Lifestyle)"
        description: "构成日常体验的关键活动和仪式感。是空间功能的直接来源。"
        ask_yourself: "他/她的一天是如何度过的？哪些活动是不可或缺的？"
        examples: "每日健身 (Daily fitness), 烹饪爱好者 (Cooking enthusiast), 宠物主人 (Pet owner), 园艺家 (Gardener), 咖啡仪式 (Coffee ritual)"
      - name: "感官偏好 (Sensory Preferences)"
        description: "在视觉、听觉、触觉、嗅觉等方面的偏好。是构建空间氛围和提升体验质感的关键。"
        ask_yourself: "他/她是被什么感觉所吸引或排斥？是喜欢温暖的木头触感，还是冰冷的金属？"
        examples: "视觉: 偏好柔和光线 (Prefers soft light); 听觉: 厌恶噪音 (Hates noise); 触觉: 喜欢天然织物 (Loves natural fabrics); 嗅觉: 喜欢木质香调 (Likes woody scents)"

  # 混合型项目框架 (Hybrid Residential-Commercial Framework)
  hybrid_residential_commercial:
    dual_identity: # 双重身份 (Dual Identity)
      - name: "居住-营业边界 (Living-Business Boundary)"
        description: "住宅功能与商业功能的物理与心理边界。是平衡私密性与商业效率的核心。"
        ask_yourself: "如何让家人感到这是'家'而不是'店'？营业时间如何保护家庭生活的完整性？"
        examples: "前店后宅 (Shop-front, Home-back), 上宅下商 (Residence above, Business below), 独立入口分区 (Separate entrances), 时间分区使用 (Time-based zoning)"
      - name: "角色切换成本 (Role-Switching Cost)"
        description: "从'居住者'到'经营者'的角色转换频率与心理成本。影响动线、隔音和视线设计。"
        ask_yourself: "能否在30秒内从'睡衣状态'切换到'接待状态'？家人是否会意外闯入营业区？"
        examples: "高频切换 (每天多次), 中频切换 (每天1-2次), 低频切换 (每周1-2次), 零切换 (完全分离)"
      - name: "家庭成员参与度 (Family Involvement)"
        description: "家庭其他成员在商业活动中的角色定位。决定了空间的共享程度与功能整合度。"
        ask_yourself: "孩子/配偶是否参与经营？他们需要独立的生活空间吗？"
        examples: "全员参与 (家族企业), 部分协助 (配偶帮忙), 完全独立 (互不干扰), 冲突共存 (抱怨营业影响生活)"

    financial_operational: # 财务与运营逻辑 (Financial & Operational Logic)
      - name: "双重成本结构 (Dual Cost Structure)"
        description: "居住成本与运营成本共用同一物理容器时的财务分摊逻辑。房租/折旧/水电如何在'家用'与'商用'之间合理分配。"
        ask_yourself: "哪些费用能计入经营成本抵税？居住与运营的用电/用水如何分表计量？装修投资的商业回报周期是多少？"
        examples: "商用水电分计 (Separate commercial utility metering), 空间折旧摊销 (Space depreciation allocation), 家用/商用面积比例登记 (Residential/commercial area ratio registration)"
      - name: "坪效与居住品质平衡 (Revenue-per-SQM vs Living Quality)"
        description: "商业区域扩张与居住舒适度之间的根本张力。每多出一平米'营业面积'就少一平米'家的空间'。"
        ask_yourself: "目前的商住面积比例是家庭满意的吗？当生意扩张时，谁的空间先被压缩？有没有未来增减的弹性预留？"
        examples: "商业优先型（经营面积>50%）, 居住优先型（经营面积<30%）, 均衡型（各占约一半）, 弹性转换型（旺季扩商/淡季收商）"
      - name: "生命周期演变规划 (Life Cycle Evolution Planning)"
        description: "随家庭结构和事业阶段变化，空间功能比例的长期动态调整能力。"
        ask_yourself: "孩子出生/长大后商业区域如何收缩？老人入住后空间如何适应？事业成功后是否会独立选址迁出商业？"
        examples: "模块化隔断支持比例调整 (Modular partition for ratio change), 商业区域独立结构（未来可整体出租）, 居住区域独立卫浴（商业区退出后仍完整）"

    regulatory_livability: # 法规与宜居性 (Regulatory & Livability)
      - name: "规划法规合规性 (Zoning & Regulatory Compliance)"
        description: "混合用途在当地规划法规中的合法性边界。商业活动是否需要营业执照、消防分区、无障碍出口等。"
        ask_yourself: "目前的用地性质允许经营吗？营业时噪音扰民的法律边界在哪？消防分区要求是否已满足？有没有被投诉或整改的风险？"
        examples: "住改商申报 (Residential-to-commercial application), 消防独立分区 (Fire zone separation), 无障碍出入口要求 (Accessible entrance requirement), 噪音时段限制 (Noise curfew compliance)"
      - name: "安全与隐私保护 (Security & Privacy Protection)"
        description: "对外开放的商业属性带来的安全隐患，以及客户/访客与家庭私密生活的物理隔离。"
        ask_yourself: "陌生顾客能轻易进入家庭生活区吗？监控摄像如何避开家庭空间？儿童活动区与对外营业区如何隔离？"
        examples: "门禁系统区分商住入口 (Access control for dual entrance), 单向玻璃隔断 (One-way mirror partition), 独立监控系统 (Independent CCTV system), 儿童安全区隔离 (Child safe zone isolation)"
      - name: "邻里关系与社区影响 (Neighborhood Relations & Community Impact)"
        description: "商业活动对周边住户和社区环境的影响，以及由此产生的社会关系管理需求。"
        ask_yourself: "营业带来的人流/噪音/气味对邻居影响程度如何？是否需要与物业/邻居提前沟通？有没有共同利益（如带动周边人气）？"
        examples: "错峰营业降低扰邻 (Off-peak business hours reducing disturbance), 气味管理（排烟/香氛方向）, 停车占用协商 (Parking usage negotiation), 社区共建合作 (Community partnership)"

  # 商业/企业项目框架 (Commercial/Enterprise Framework)
  commercial_enterprise:
    business_positioning: # 商业定位 (Business Positioning)
      - name: "品牌定位 (Brand Positioning)"
        description: "品牌在市场和消费者心智中占据的独特位置。是空间设计的‘北极星’，决定了气质、调性和价值感。"
        ask_yourself: "如果品牌是一个人，他/她的性格是什么？我们希望顾客离开时，如何向朋友描述这个地方？"
        examples: "高端奢侈 (High-end Luxury), 大众快消 (Mass-market Fast-moving), 小众精品 (Niche Boutique), 科技先锋 (Tech Pioneer), 人文艺术 (Arts & Culture)"
      - name: "目标市场 (Target Market)"
        description: "品牌希望吸引和服务的核心客户群体。不仅是人口统计学，更是心理和行为特征的集合。"
        ask_yourself: "我们的‘理想客户’是谁？他/她有什么‘待办任务(JTBD)’需要我们的空间来完成？他/她在哪消费？受什么影响？"
        examples: "高净值人群 (High-Net-Worth Individuals), Z世代学生 (Gen Z Students), 新中产家庭 (New Middle-Class Families), 城市潮流青年 (Urban Trendsetters)"
      - name: "竞争优势 (Competitive Advantage)"
        description: "品牌区别于竞争对手的独特价值主张。空间设计必须是这一优势的物理体现和放大器。"
        ask_yourself: "我们凭什么赢？是极致的体验、无与伦比的效率、独特的产品组合，还是强大的社区？空间如何强化这一点？"
        examples: "极致体验 (Unmatched Experience), 最高性价比 (Best Value for Money), 独家产品组合 (Exclusive Product Mix), 强大社群链接 (Strong Community Connection)"

    operational_strategy: # 运营策略 (Operational Strategy)
      - name: "坪效要求 (Sales per Square Meter / Efficiency)"
        description: "单位面积的营收或服务效率目标。是商业空间的核心约束，直接影响布局、动线和功能密度。"
        ask_yourself: "空间的首要任务是最大化交易，还是延长停留时间？哪些区域是高价值区，哪些是体验区？"
        examples: "高周转率零售 (High-turnover retail), 长时停留餐饮 (Long-dwell-time dining), 高效服务窗口 (Efficient service counter)"
      - name: "客流动线 (Customer Flow)"
        description: "引导顾客在空间中移动的预设路径。是编排顾客体验、优化运营效率和最大化商业价值的‘剧本’。"
        ask_yourself: "我们希望顾客的‘探索之旅’是怎样的？是清晰引导，还是自由发现？关键节点和高光时刻在哪里？"
        examples: "强制单向动线 (Forced one-way path), 自由环形动线 (Free-flow loop), 目的地驱动型动线 (Destination-driven path)"
      - name: "停留时长 (Dwell Time)"
        description: "期望顾客在空间内停留的平均时间。是衡量空间吸引力和体验丰富度的关键指标。"
        ask_yourself: "我们希望顾客‘逛完就走’还是‘流连忘返’？通过什么设计（如座位、充电口、互动装置）来鼓励停留？"
        examples: "快速交易 (<5 mins), 短暂停留 (15-30 mins), 深度体验 (>1 hour)"
      - name: "业态协同 (Business Mix Synergy)"
        description: "不同商业功能（零售、餐饮、娱乐等）之间的相互作用。目标是 1+1>2。"
        ask_yourself: "不同业态如何相互引流？它们的客群是否重叠？在空间上如何布局以促进互动？"
        examples: "书店+咖啡馆 (Bookstore + Café), 服装店+造型工作室 (Apparel + Styling Studio), 超市+社区厨房 (Supermarket + Community Kitchen)"

    brand_experience: # 品牌体验 (Brand Experience)
      - name: "空间叙事 (Spatial Narrative)"
        description: "空间通过设计语言讲述的品牌故事。它赋予空间意义，使其不仅仅是功能的容器。"
        ask_yourself: "我们想让顾客走进一个怎样的故事？是‘探索者的奇幻之旅’，还是‘艺术家的私人客厅’？"
        examples: "寻宝之旅 (Treasure Hunt), 制造工厂 (Manufacturing Factory), 未来实验室 (Future Lab), 自然绿洲 (Natural Oasis)"
      - name: "关键触点 (Key Touchpoints)"
        description: "顾客与品牌在空间中发生互动的所有关键时刻。是塑造品牌记忆和情感连接的决定性瞬间。"
        ask_yourself: "从入口、问询台，到试衣间、收银台、出口，每个触点的体验目标是什么？如何设计才能超出预期？"
        examples: "入口的震撼装置 (Striking entrance installation), 试衣间的灯光和音乐 (Fitting room lighting and music), 结账时的告别语 (Checkout farewell message)"
      - name: "感官印记 (Sensory Signature)"
        description: "品牌在视觉、听觉、嗅觉、触觉上统一且独特的感官标识。是品牌植入消费者潜意识的强大工具。"
        ask_yourself: "我们的‘品牌颜色’是什么？‘品牌声音’是什么？‘品牌气味’是什么？这些元素在空间中是否一致和突出？"
        examples: "特定的潘通色号 (Specific Pantone color), 定制的背景音乐列表 (Custom background music playlist), 独家调制的香氛 (Exclusive signature scent), 标志性的材料触感 (Iconic material texture)"
      - name: "情感连接 (Emotional Connection)"
        description: "品牌通过空间体验与顾客建立的深层情感共鸣。是超越功能和价格，建立品牌忠诚度的终极目标。"
        ask_yourself: "我们希望顾客离开时带走什么样的情感？是愉悦、被激励、归属感，还是智识上的满足？"
        examples: "惊喜与愉悦 (Surprise & Delight), 归属感与认同 (Sense of Belonging & Recognition), 灵感与启发 (Inspiration & Enlightenment), 尊贵与优越 (Exclusivity & Superiority)"

  # 文化/公共/展馆项目框架 (Public Cultural/Exhibition Framework)
  public_cultural:
    mission_core: # 使命核心 (Mission Core)
      - name: "教育使命 (Educational Mission)"
        description: "空间承载的知识传播、文化传承或社会教化功能。是文化类项目的灵魂。"
        ask_yourself: "我们希望参观者离开时，对世界的理解有何改变？这个空间要回答什么终极问题？"
        examples: "历史记忆 (Historical Memory), 科学启蒙 (Scientific Enlightenment), 艺术审美 (Artistic Appreciation), 社会议题 (Social Issues), 文化认同 (Cultural Identity)"
      - name: "策展逻辑 (Curatorial Logic)"
        description: "内容组织的叙事结构与展示策略。决定了空间序列、动线编排和高光时刻的设置。"
        ask_yourself: "叙事是线性的（时间轴）还是网状的（主题群）？参观者应该自由探索还是被引导？"
        examples: "时间线叙事 (Timeline Narrative), 主题式群落 (Thematic Clusters), 沉浸式体验 (Immersive Experience), 对话式探索 (Dialogic Exploration)"
      - name: "知识传递层级 (Knowledge Transfer Hierarchy)"
        description: "目标受众的知识基础与接受能力分层。影响展示深度、互动复杂度和辅助说明系统。"
        ask_yourself: "内容是面向专家、爱好者还是大众？如何让10岁孩子和60岁学者都有收获？"
        examples: "专业研究型 (Scholarly Research), 爱好者深度型 (Enthusiast Deep-dive), 大众科普型 (Public Education), 儿童启蒙型 (Children's Enlightenment)"

    visitor_experience: # 参观者体验 (Visitor Experience)
      - name: "参观节奏 (Visit Pacing)"
        description: "理想的参观时长、停留点密度与疲劳管理策略。是编排体验强度与休息节点的依据。"
        ask_yourself: "希望参观者停留多久？哪些区域是'必看'，哪些是'深度体验'？如何防止博物馆疲劳？"
        examples: "快速浏览型 (<30mins), 标准参观型 (1-2hrs), 深度沉浸型 (3-4hrs), 多次回访型 (会员制)"
      - name: "互动参与度 (Interaction Level)"
        description: "从被动观看到主动参与的体验光谱。决定了装置类型、技术投入和空间灵活性。"
        ask_yourself: "参观者是观众、参与者还是共创者？互动是身体的、认知的还是情感的？"
        examples: "纯观看 (Observation Only), 触摸体验 (Tactile Experience), 数字互动 (Digital Interaction), 创作参与 (Co-creation)"
      - name: "社交动态 (Social Dynamics)"
        description: "参观者以何种社交组合到访及其互动模式。影响空间尺度、座位设置和私密性需求。"
        ask_yourself: "主要是个人沉思、情侣约会、家庭教育还是团队建设？需要'安静区'吗？"
        examples: "独自沉思 (Solo Contemplation), 情侣/朋友 (Couples/Friends), 家庭教育 (Family Learning), 团队活动 (Group Events)"

    operational_sustainability: # 运营可持续性 (Operational Sustainability)
      - name: "内容更新机制 (Content Refresh Mechanism)"
        description: "展示内容的更新频率、成本与空间适应性。是保持吸引力的关键。"
        ask_yourself: "常设展vs临展的比例？空间是否支持低成本快速换展？"
        examples: "永久固定 (Permanent Fixed), 年度更新 (Annual Refresh), 季度轮换 (Quarterly Rotation), 灵活模块 (Flexible Modules)"
      - name: "收入模型 (Revenue Model)"
        description: "门票、衍生品、会员、赞助等收入来源及其对空间设计的影响。"
        ask_yourself: "免费开放还是付费？商店/咖啡馆是'必经之路'还是可选？如何让非门票收入最大化？"
        examples: "纯门票 (Ticket-only), 门票+商店 (Ticket + Shop), 免费+捐赠 (Free + Donation), 会员制 (Membership)"
      - name: "社区关系 (Community Relations)"
        description: "与本地社区、学校、研究机构的共生关系。决定了空间的开放性与社会价值。"
        ask_yourself: "本地居民能'占便宜'吗？学校能免费来吗？空间能承载社区活动吗？"
        examples: "游客导向 (Tourist-focused), 本地友好 (Local-friendly), 学术合作 (Academic Partnership), 社区中心 (Community Hub)"

  # 医疗/康养/养老项目框架 (Healthcare/Wellness/Senior Living Framework)
  healthcare_wellness:
    care_philosophy: # 照护哲学 (Care Philosophy)
      - name: "医患关系模型 (Patient-Provider Relationship)"
        description: "从'权威-服从'到'伙伴-共创'的关系光谱。决定了空间的权力感、透明度和赋权程度。"
        ask_yourself: "患者/住户是被'治疗'的对象，还是健康管理的'主角'？如何通过空间赋权？"
        examples: "权威医疗模式 (Authoritative Medical), 家庭式照护 (Family-style Care), 自主康复模式 (Autonomous Recovery), 社区共生模式 (Community Co-living)"
      - name: "康复/疗愈路径 (Recovery/Healing Journey)"
        description: "从入院/入住到康复/安享的完整旅程及其关键节点。是组织功能分区与动线的核心。"
        ask_yourself: "康复的里程碑是什么？空间如何见证并庆祝进步？如何避免'永久病人'的标签？"
        examples: "急症救治→康复→出院 (Acute Care Path), 入住→适应→活力老化 (Senior Living Path), 治疗→康复→回归社会 (Rehabilitation Path)"
      - name: "尊严与隐私边界 (Dignity & Privacy Boundaries)"
        description: "在医疗必要性与个人尊严之间的微妙平衡。是人文关怀的试金石。"
        ask_yourself: "如何让病床不像'展品'？如何让护理动作不损害尊严？失禁/疼痛时的隐私如何保护？"
        examples: "开放监护 (Open Monitoring), 可调节隐私 (Adjustable Privacy), 私人套间 (Private Suite), 家庭陪护 (Family Caregiving)"

    functional_healing: # 功能性疗愈 (Functional Healing)
      - name: "治疗性环境要素 (Therapeutic Environment Elements)"
        description: "自然光、景观、色彩、声音等环境因素对康复的积极影响。是循证设计的核心。"
        ask_yourself: "每个病床能看到自然景观吗？色彩是舒缓的还是刺激的？噪音控制达标了吗？"
        examples: "自然光疗愈 (Natural Light Therapy), 园艺疗法空间 (Horticultural Therapy), 艺术疗愈 (Art Therapy), 动物辅助治疗 (Animal-assisted Therapy)"
      - name: "无障碍与适老化 (Accessibility & Age-Friendly)"
        description: "从轮椅通行到认知障碍友好的全方位无障碍设计。是基本人权的体现。"
        ask_yourself: "失智老人会迷路吗？视障者能独立使用洗手间吗？轮椅能到达所有区域吗？"
        examples: "物理无障碍 (Physical Accessibility), 认知友好 (Dementia-friendly), 感官补偿 (Sensory Compensation), 跌倒防护 (Fall Prevention)"
      - name: "家庭参与空间 (Family Involvement Space)"
        description: "家属陪护、探视、情感支持的空间配置。是患者/住户情感安全感的来源。"
        ask_yourself: "家属能24小时陪护吗？有没有'家庭厨房'让家属做碗家乡菜？孩子来探视时能玩耍吗？"
        examples: "全天陪护床 (24hr Caregiver Bed), 家庭厨房 (Family Kitchen), 儿童友好探视 (Child-friendly Visit), 多代共享空间 (Multigenerational Space)"

    operational_care: # 运营照护 (Operational Care)
      - name: "护理效率与人文关怀平衡 (Efficiency-Care Balance)"
        description: "护理动线优化与患者体验之间的权衡。是管理哲学的体现。"
        ask_yourself: "护士站是'监控塔'还是'社区客厅'？效率提升是否以患者舒适为代价？"
        examples: "集中式护士站 (Centralized Station), 分散式护理点 (Decentralized Care Points), 隐形护理 (Invisible Care), 管家式服务 (Butler-style Service)"
      - name: "感染控制与开放性 (Infection Control vs Openness)"
        description: "后疫情时代的卫生标准与空间开放感、社交需求的矛盾。"
        ask_yourself: "如何在严格消毒的前提下避免'无菌仓'的压抑感？户外空间如何安全使用？"
        examples: "负压隔离 (Negative Pressure Isolation), 过渡缓冲区 (Transition Buffer), 户外疗愈花园 (Outdoor Healing Garden), 紫外线消毒系统 (UV Disinfection)"
      - name: "临终关怀空间 (End-of-Life Care Space)"
        description: "生命最后阶段的尊严、安宁与告别仪式的空间支持。是人文医疗的最高体现。"
        ask_yourself: "有没有让家人围聚的'告别室'？能否让患者看到日出/日落？宗教仪式能进行吗？"
        examples: "安宁病房 (Hospice Room), 家庭告别室 (Family Farewell Room), 宗教/冥想空间 (Spiritual Space), 纪念花园 (Memorial Garden)"

  # 商业办公项目框架 (Commercial Office Framework)
  commercial_office:
    work_culture: # 工作文化 (Work Culture)
      - name: "协作-专注光谱 (Collaboration-Focus Spectrum)"
        description: "从高度协作到深度专注的工作模式分布。决定了开放/封闭空间的配比。"
        ask_yourself: "团队主要是'头脑风暴'还是'深度思考'？如何让创意碰撞与专注工作共存？"
        examples: "极度协作型 (Hyper-collaborative), 平衡混合型 (Balanced Hybrid), 深度专注型 (Deep Focus), 灵活切换型 (Flexible Switching)"
      - name: "层级与权力表达 (Hierarchy & Power Expression)"
        description: "组织结构在空间中的显性/隐性表达。反映企业文化的本质。"
        ask_yourself: "CEO要独立办公室吗？会议室分等级吗？如何让'扁平化'不只是口号？"
        examples: "传统层级 (Traditional Hierarchy), 弱化层级 (Flattened), 完全平等 (Fully Egalitarian), 任务导向 (Task-based)"
      - name: "远程-现场混合策略 (Remote-Onsite Hybrid Strategy)"
        description: "后疫情时代的办公模式与空间利用效率。影响工位数量、预约系统和灵活性。"
        ask_yourself: "工位与员工的比例是多少？如何让远程员工'到访'时有归属感？家庭办公与公司办公的边界在哪？"
        examples: "全员现场 (Full Onsite), 轮换工位 (Hot-desking), 周期性到访 (Periodic Visit), 完全远程+临时空间 (Fully Remote + Pop-up)"

    productivity_environment: # 生产力环境 (Productivity Environment)
      - name: "工作模式多样性支持 (Work Mode Diversity Support)"
        description: "从独立工作到团队协作、从正式会议到非正式交流的空间类型丰富度。"
        ask_yourself: "有没有'打电话不被打扰'的空间？头脑风暴时有白板和舒适座椅吗？午休能躺平吗？"
        examples: "专注工作舱 (Focus Pod), 协作会议室 (Collaboration Room), 休闲社交区 (Social Lounge), 冥想/午休室 (Meditation/Nap Room)"
      - name: "技术基础设施 (Technology Infrastructure)"
        description: "从WiFi、视频会议到智能控制的技术支撑水平。是现代办公的基本保障。"
        ask_yourself: "视频会议的音视频质量能让远程同事'在场'吗？无纸化办公落实了吗？IoT设备能提升效率吗？"
        examples: "基础连接 (Basic Connectivity), 智能会议室 (Smart Meeting Room), IoT办公 (IoT Office), 沉浸式远程协作 (Immersive Remote Collaboration)"
      - name: "健康与福祉配套 (Health & Wellbeing Amenities)"
        description: "从人体工学到心理健康的全方位福祉支持。是吸引人才的竞争力。"
        ask_yourself: "久坐有提醒吗？自然光充足吗？有健身房或瑜伽室吗？压力大时有'心理急救'空间吗？"
        examples: "人体工学家具 (Ergonomic Furniture), 健身设施 (Fitness Facilities), 自然采光+绿植 (Natural Light + Greenery), 心理健康支持 (Mental Health Support)"

    brand_talent: # 品牌与人才 (Brand & Talent)
      - name: "雇主品牌空间表达 (Employer Brand Spatial Expression)"
        description: "企业文化、价值观在空间中的物化呈现。是吸引与留住人才的隐形武器。"
        ask_yourself: "访客/候选人一走进来，能感知到我们的'不同'吗？空间如何讲述我们的故事？"
        examples: "创新科技感 (Innovative Tech), 人文关怀感 (Humanistic Care), 环保责任感 (Environmental Responsibility), 创意自由感 (Creative Freedom)"
      - name: "偶遇与知识流动 (Serendipity & Knowledge Flow)"
        description: "促进跨部门、跨层级偶遇与非正式交流的空间设计。是创新的催化剂。"
        ask_yourself: "不同部门的人会在哪'偶遇'？咖啡机旁的闲聊能变成创意吗？如何让知识'传染'？"
        examples: "中央楼梯 (Central Staircase), 共享茶水间 (Shared Pantry), 跨部门协作区 (Cross-functional Zone), '偶遇'走廊 (Serendipity Corridor)"
      - name: "灵活扩展性 (Scalability & Flexibility)"
        description: "应对团队快速增长、重组或业务调整的空间适应能力。"
        ask_yourself: "3个月内团队翻倍怎么办？项目结束后大会议室能干什么？模块化家具能快速重组吗？"
        examples: "固定布局 (Fixed Layout), 模块化家具 (Modular Furniture), 可移动隔断 (Movable Partitions), 完全灵活 (Fully Flexible)"

  # 商业酒店/餐饮/文旅项目框架 (Commercial Hospitality Framework)
  commercial_hospitality:
    guest_journey: # 宾客旅程 (Guest Journey)
      - name: "到达与第一印象 (Arrival & First Impression)"
        description: "从预订确认到踏入大堂的完整体验链。决定了品牌调性的第一次传达。"
        ask_yourself: "从看到建筑外观的那一刻，我们想让他们感受到什么？办理入住是效率优先还是仪式感优先？"
        examples: "震撼式入口 (Grand Entrance), 隐秘式入口 (Discreet Entrance), 自助式入住 (Self Check-in), 管家式迎宾 (Butler Welcome)"
      - name: "客房作为'第二个家' (Guestroom as 'Home Away')"
        description: "从功能满足到情感共鸣的客房定位。是住宿体验的核心。"
        ask_yourself: "客人会想'赖着不走'吗？哪些细节让人感到被照顾？本地文化如何不着痕迹地融入？"
        examples: "标准商务 (Standard Business), 精品设计 (Boutique Design), 沉浸式主题 (Immersive Theme), 本地生活方式 (Local Lifestyle)"
      - name: "公共空间的社交动力学 (Social Dynamics in Public Spaces)"
        description: "大堂、餐厅、泳池等公共区域的社交氛围营造。影响宾客停留时长与复购率。"
        ask_yourself: "宾客会在大堂'闲逛'吗？陌生宾客会自然交流吗？如何平衡社交与私密？"
        examples: "社交型大堂 (Social Lobby), 安静型图书馆 (Quiet Library), 活力型泳池吧 (Lively Pool Bar), 私密型花园 (Private Garden)"

    place_identity: # 地域身份 (Place Identity)
      - name: "在地性表达 (Sense of Place)"
        description: "本地文化、自然景观、历史记忆在空间中的转译。是差异化竞争的核心。"
        ask_yourself: "离开酒店后，宾客对这座城市的理解加深了吗？设计是'空降'的还是'生长'出来的？"
        examples: "表面符号化 (Superficial Symbols), 材料在地化 (Local Materials), 叙事深度化 (Narrative Depth), 体验沉浸化 (Experiential Immersion)"
      - name: "文旅融合深度 (Tourism-Culture Integration)"
        description: "从'住宿+观光'到'住宿即体验'的融合程度。决定了项目的文化厚度。"
        ask_yourself: "酒店本身是否值得'打卡'？宾客能在酒店内完成哪些文化体验？如何与周边景点协同？"
        examples: "纯住宿功能 (Pure Accommodation), 景点配套 (Attraction Support), 酒店即景点 (Hotel as Attraction), 文化浸润式 (Cultural Immersion)"
      - name: "季节性与可持续性 (Seasonality & Sustainability)"
        description: "应对淡旺季波动与生态责任的策略。影响运营模型与空间灵活性。"
        ask_yourself: "淡季如何吸引本地客群？能源消耗能否降低50%？如何让'绿色'成为卖点而非负担？"
        examples: "全年平衡 (Year-round Balance), 淡季转型 (Off-season Pivot), 生态优先 (Eco-priority), 碳中和目标 (Carbon Neutral)"

    service_model: # 服务模式 (Service Model)
      - name: "服务可见度 (Service Visibility)"
        description: "从'隐形服务'到'表演式服务'的光谱。反映品牌哲学与目标客群偏好。"
        ask_yourself: "宾客希望看到服务过程吗？管家应该'无处不在'还是'召之即来'？"
        examples: "隐形服务 (Invisible Service), 低调高效 (Discreet Efficiency), 互动式服务 (Interactive Service), 表演式服务 (Performative Service)"
      - name: "标准化与个性化平衡 (Standardization-Personalization Balance)"
        description: "品牌一致性与客人独特需求之间的权衡。是连锁与精品的分水岭。"
        ask_yourself: "每家店都一样是优势还是劣势？如何记住回头客的偏好？个性化成本能否控制？"
        examples: "完全标准化 (Fully Standardized), 有限定制 (Limited Customization), 深度个性化 (Deep Personalization), 共创式体验 (Co-created Experience)"
      - name: "技术赋能程度 (Technology Empowerment)"
        description: "从智能客房到AI礼宾的技术应用深度。是效率与体验的双刃剑。"
        ask_yourself: "技术是'炫技'还是'解决痛点'？宾客能否选择'有人服务'？数据隐私如何保护？"
        examples: "传统人工 (Traditional Manual), 辅助性技术 (Assistive Tech), 智能化主导 (Smart-led), 无人化未来 (Unmanned Future)"

  # 体育/娱乐/艺术项目框架 (Sports/Entertainment/Arts Framework)
  sports_entertainment_arts:
    core_experience: # 核心体验 (Core Experience)
      - name: "表演-观众关系 (Performer-Audience Relationship)"
        description: "从传统'舞台-观众席'到沉浸式'共创'的体验模式。决定了空间的开放性与互动性。"
        ask_yourself: "观众是'旁观者'还是'参与者'？表演者与观众的边界在哪里？"
        examples: "传统镜框式 (Traditional Proscenium), 环绕式 (Surround), 沉浸式 (Immersive), 参与式共创 (Participatory Co-creation)"
      - name: "竞技/演出标准 (Competition/Performance Standards)"
        description: "国际赛事、专业演出的技术标准与认证要求。是硬性约束条件。"
        ask_yourself: "场地符合国际认证吗？声学/灯光达到专业级吗？运动员/演员的后台需求满足了吗？"
        examples: "国际赛事级 (International Event), 国家级专业 (National Professional), 区域业余 (Regional Amateur), 社区参与 (Community Participation)"
      - name: "高峰体验设计 (Peak Experience Design)"
        description: "比赛/演出的'高光时刻'如何通过空间放大。是情感记忆的锚点。"
        ask_yourself: "进球/谢幕的瞬间，空间如何'爆发'？观众的欢呼如何被声学放大？"
        examples: "视觉震撼 (Visual Impact), 声学共鸣 (Acoustic Resonance), 灯光叙事 (Lighting Narrative), 多感官沉浸 (Multi-sensory Immersion)"

    audience_experience: # 观众体验 (Audience Experience)
      - name: "可达性与包容性 (Accessibility & Inclusivity)"
        description: "从轮椅席位到感官友好的全方位包容设计。是社会责任的体现。"
        ask_yourself: "视障者能'听'比赛吗？听障者能'看'音乐会吗？轮椅观众的视线被遮挡了吗？"
        examples: "基础无障碍 (Basic Accessibility), 感官辅助 (Sensory Assistance), 包容性设计 (Inclusive Design), 通用设计 (Universal Design)"
      - name: "社交与氛围营造 (Social Atmosphere Creation)"
        description: "从安静欣赏到狂热助威的氛围控制。影响座位布局、声学处理和安全管理。"
        ask_yourself: "需要'死忠看台'吗？家庭观众需要安静区吗？赛后/演后如何疏导情绪？"
        examples: "安静欣赏型 (Quiet Appreciation), 礼貌互动型 (Polite Interaction), 热烈助威型 (Enthusiastic Cheering), 狂热庆典型 (Ecstatic Celebration)"
      - name: "配套服务与停留时长 (Ancillary Services & Dwell Time)"
        description: "餐饮、周边商店、互动装置等延长停留时间的策略。是非门票收入的来源。"
        ask_yourself: "观众会提前1小时到吗？中场休息能消费吗？赛后/演后愿意逗留吗？"
        examples: "纯观赛/演出 (Event Only), 基础配套 (Basic Amenities), 体验式配套 (Experiential Amenities), 目的地化 (Destination-ization)"

    operational_unique: # 运营特殊性 (Operational Uniqueness)
      - name: "赛事/演出转换灵活性 (Event Conversion Flexibility)"
        description: "从篮球场到演唱会的快速转换能力。是多功能场馆的核心竞争力。"
        ask_yourself: "24小时内能完成场地转换吗？声学/灯光系统能适配不同需求吗？"
        examples: "单一功能 (Single Function), 有限转换 (Limited Conversion), 快速转换 (Rapid Conversion), 模块化万能 (Modular Universal)"
      - name: "安全与应急管理 (Safety & Emergency Management)"
        description: "大规模人群聚集的安全风险与应急预案。是底线要求。"
        ask_yourself: "紧急疏散时间达标吗？医疗急救点够吗？恐慌踩踏如何防范？"
        examples: "基础消防 (Basic Fire Safety), 人群管理 (Crowd Management), 医疗配套 (Medical Support), 反恐预案 (Anti-terrorism Plan)"
      - name: "可持续运营与社区共享 (Sustainable Operation & Community Sharing)"
        description: "赛后场馆的日常开放、社区活动承载与经济可持续性。决定了'白象工程'还是'城市客厅'。"
        ask_yourself: "非赛事日如何盈利？本地居民能免费使用吗？场馆能承载婚礼/毕业典礼吗？"
        examples: "赛事专用 (Event-only), 有限开放 (Limited Public Access), 社区共享 (Community Sharing), 混合运营 (Mixed-use Operation)"

  # 工业转换/制造项目框架 (Industrial Conversion/Manufacturing Framework)
  industrial_conversion:
    production_core: # 生产核心 (Production Core)
      - name: "生产工艺流程 (Production Process Flow)"
        description: "从原料进入到成品出库的完整生产链路。是工业建筑布局的决定性因素。"
        ask_yourself: "物料流向是线性、环形还是网状？哪些工序必须相邻？哪些需要隔离？"
        examples: "线性流水线 (Linear Assembly Line), U型布局 (U-shaped Layout), 蜂窝式工作站 (Cellular Workstation), 柔性制造系统 (Flexible Manufacturing System)"
      - name: "设备承载与振动控制 (Equipment Load & Vibration Control)"
        description: "大型设备的结构承载、振动隔离与地基处理。是工业建筑的特殊技术挑战。"
        ask_yourself: "重型设备的楼板承载多少吨？精密仪器如何隔振？设备基础如何处理？"
        examples: "轻型设备区 (<5t/㎡), 中型设备区 (5-20t/㎡), 重型设备区 (>20t/㎡), 精密仪器区 (微振动控制)"
      - name: "人机工效与作业安全 (Ergonomics & Operational Safety)"
        description: "操作工人的舒适性、安全性与效率优化。是人本主义工业设计的核心。"
        ask_yourself: "作业高度是否符合人体工学？重复性劳动如何减轻？危险区域如何防护？"
        examples: "可调高度工作台 (Adjustable Workbench), 辅助搬运设备 (Material Handling Aids), 防护栏杆/围栏 (Safety Barriers), 防滑地面 (Anti-slip Flooring)"

    logistics_efficiency: # 物流效率 (Logistics Efficiency)
      - name: "物料流向优化 (Material Flow Optimization)"
        description: "原材料、半成品、成品的移动路径与储存策略。决定运营效率。"
        ask_yourself: "物料搬运距离能否最小化？临时储存点设置合理吗？叉车通道宽度够吗？"
        examples: "直通式物流 (Flow-through Logistics), JIT准时制 (Just-In-Time), 立体仓储 (Vertical Warehousing), 自动化输送 (Automated Conveying)"
      - name: "货物进出管理 (Cargo Access Management)"
        description: "卸货区、装载区、周转区的空间配置与交通组织。"
        ask_yourself: "货车能否直接倒车入库？卸货平台高度标准吗？高峰期会塞车吗？"
        examples: "平台式卸货 (Dock-level Loading), 坡道式卸货 (Ramp Loading), 内部循环 (Internal Circulation), 外部周转 (External Staging)"
      - name: "库存管理策略 (Inventory Management Strategy)"
        description: "原料库、成品库、周转库的容量设计与管理模式。"
        ask_yourself: "库存周转率是多少？先进先出如何保证？温湿度控制需求？"
        examples: "高周转小库存 (High Turnover), 战略储备 (Strategic Reserve), 温控仓储 (Climate-controlled), 危化品专库 (Hazardous Material Storage)"

    environmental_compliance: # 环境合规 (Environmental Compliance)
      - name: "废气废水处理 (Emission & Wastewater Treatment)"
        description: "生产过程的污染控制与达标排放。是环保红线和社会责任。"
        ask_yourself: "废气处理设施的处理能力够吗？废水是否分类处理？排放标准达标吗？"
        examples: "集中除尘 (Centralized Dust Collection), VOCs处理 (VOC Treatment), 废水多级处理 (Multi-stage Wastewater), 零排放目标 (Zero Discharge)"
      - name: "职业健康防护 (Occupational Health Protection)"
        description: "噪音、粉尘、有害气体的控制与工人健康保护。"
        ask_yourself: "噪音区是否隔音？粉尘作业有除尘设备吗？有害气体浓度监测了吗？"
        examples: "隔音房 (Soundproof Room), 负压除尘 (Negative Pressure Dust Control), 强制通风 (Forced Ventilation), 个人防护装备 (PPE Requirements)"
      - name: "能源使用效率 (Energy Efficiency)"
        description: "工业生产的能耗优化与清洁能源替代。"
        ask_yourself: "能耗最大的环节在哪？余热能否回收？可再生能源占比？"
        examples: "余热回收 (Waste Heat Recovery), 变频节能 (Variable Frequency Drive), 光伏屋顶 (Rooftop Solar), 能源管理系统 (Energy Management System)"

  # 教育设施/科研项目框架 (Educational Facility/Research Framework)
  educational_facility:
    learning_paradigm: # 学习范式 (Learning Paradigm)
      - name: "教学模式定位 (Pedagogical Approach)"
        description: "从传统讲授到主动学习的教学理念光谱。决定空间的灵活性和互动性。"
        ask_yourself: "以教师为中心还是以学生为中心？学习是'接受'还是'探索'？"
        examples: "传统讲授式 (Traditional Lecture), 讨论式学习 (Discussion-based), 项目式学习 (Project-based Learning), 混合式学习 (Blended Learning)"
      - name: "空间类型多样性 (Space Type Diversity)"
        description: "从正式教室到非正式学习空间的完整生态系统。"
        ask_yourself: "除了教室，还需要哪些学习场景？学生在哪'偶遇'知识和灵感？"
        examples: "标准教室 (Standard Classroom), 阶梯教室 (Lecture Hall), 研讨室 (Seminar Room), 创客空间 (Makerspace), 非正式学习区 (Informal Learning Zone)"
      - name: "可重构性 (Reconfigurability)"
        description: "空间快速适应不同教学场景的能力。"
        ask_yourself: "一个空间能否在10分钟内从讲座模式变为小组讨论？家具能否快速重组？"
        examples: "固定座位 (Fixed Seating), 活动家具 (Movable Furniture), 可折叠隔断 (Foldable Partitions), 全灵活空间 (Fully Flexible Space)"

    knowledge_infrastructure: # 知识基础设施 (Knowledge Infrastructure)
      - name: "技术赋能程度 (Technology Enablement)"
        description: "从黑板粉笔到AR/VR的技术工具丰富度。"
        ask_yourself: "每个学习空间的技术配置标准是什么？远程学习如何支持？"
        examples: "基础投影 (Basic Projection), 互动白板 (Interactive Whiteboard), 双向视频 (Two-way Video), 沉浸式XR (Immersive XR)"
      - name: "馆藏资源可达性 (Collection Accessibility)"
        description: "图书、期刊、数字资源的物理和虚拟可及性。"
        ask_yourself: "学生能否24小时访问数字资源？实体馆藏的开架比例？特藏如何平衡保护与使用？"
        examples: "传统闭架 (Closed Stack), 开架借阅 (Open Shelf), 数字优先 (Digital First), 智慧图书馆 (Smart Library)"
      - name: "实验/实践设施 (Lab & Practice Facilities)"
        description: "动手实践、实验探究的专业空间配置。"
        ask_yourself: "实验室的开放时间？设备共享机制？安全防护措施？跨学科实验室如何设计？"
        examples: "专业实验室 (Specialized Lab), 开放实验室 (Open Lab), 虚拟仿真实验室 (Virtual Lab), 跨学科实验室 (Interdisciplinary Lab)"

    campus_life: # 校园生活 (Campus Life)
      - name: "社交与协作空间 (Social & Collaborative Space)"
        description: "促进学生、教师、学科之间非正式互动的'第三空间'。"
        ask_yourself: "不同专业的学生在哪'偶遇'？师生非正式对话在哪发生？"
        examples: "中庭休息区 (Atrium Lounge), 咖啡社交区 (Café Social Zone), 户外讨论区 (Outdoor Discussion), 学科交叉中心 (Interdisciplinary Hub)"
      - name: "身心健康支持 (Physical & Mental Wellbeing)"
        description: "运动设施、心理咨询、健康服务的空间配置。"
        ask_yourself: "体育设施是否便捷？心理咨询空间是否私密？冥想/减压空间有吗？"
        examples: "综合体育馆 (Sports Complex), 心理咨询室 (Counseling Room), 冥想室 (Meditation Room), 健康中心 (Wellness Center)"
      - name: "包容性与无障碍 (Inclusivity & Accessibility)"
        description: "特殊需求学生的学习和生活支持。"
        ask_yourself: "残障学生能独立到达所有区域吗？神经多样性学生有合适的学习空间吗？"
        examples: "物理无障碍 (Physical Accessibility), 感官友好 (Sensory-friendly), 学习差异支持 (Learning Differences Support), 多语言标识 (Multilingual Signage)"

  # 交通/市政基础设施项目框架 (Transportation/Civic Infrastructure Framework)
  transportation_civic:
    flow_dynamics: # 流动动态 (Flow Dynamics)
      - name: "客流/车流预测 (Passenger/Vehicle Flow Forecast)"
        description: "高峰时段、常态时段的人流/车流量预测与空间容量匹配。"
        ask_yourself: "高峰时段每小时有多少人/车？瓶颈在哪？极端情况（如春运）如何应对？"
        examples: "常态负荷 (Normal Load), 高峰负荷 (Peak Load), 极端负荷 (Extreme Load), 应急疏散 (Emergency Evacuation)"
      - name: "换乘/转运效率 (Transfer/Transit Efficiency)"
        description: "不同交通方式之间的衔接便捷性与时间成本。"
        ask_yourself: "换乘距离最短多少米？标识系统够清晰吗？行李搬运方便吗？"
        examples: "同站台换乘 (Same-platform Transfer), 垂直换乘 (Vertical Transfer), 长距离换乘 (Long-distance Transfer), 无缝衔接 (Seamless Connection)"
      - name: "动线分流与冲突消解 (Flow Segregation & Conflict Resolution)"
        description: "不同速度、不同方向人流/车流的分离管理。"
        ask_yourself: "快速通道与慢速观光如何分离？进站与出站人流有冲突吗？非机动车与行人如何分流？"
        examples: "上下分层 (Vertical Separation), 左右分道 (Lateral Separation), 时间错峰 (Temporal Separation), 智能引导 (Smart Guidance)"

    user_experience: # 用户体验 (User Experience)
      - name: "等待体验优化 (Waiting Experience Optimization)"
        description: "减少等待焦虑、提供舒适等待环境的设计策略。"
        ask_yourself: "等待时间是否可视？有座位吗？有娱乐/信息设施吗？"
        examples: "实时信息显示 (Real-time Information), 舒适座椅 (Comfortable Seating), 商业配套 (Retail Amenities), 互动装置 (Interactive Installations)"
      - name: "寻路清晰度 (Wayfinding Clarity)"
        description: "从入口到目的地的导航系统完整性与直观性。"
        ask_yourself: "第一次来的人能否不问路找到目的地？多语言/图形标识够吗？弱视者能导航吗？"
        examples: "多层级标识 (Hierarchical Signage), 地标设计 (Landmark Design), 数字导航 (Digital Navigation), 无障碍导航 (Accessible Wayfinding)"
      - name: "服务设施配套 (Service Facility Amenities)"
        description: "洗手间、饮水、充电、商业、行李寄存等配套完善度。"
        ask_yourself: "高峰期洗手间会排长队吗？行李寄存安全便捷吗？母婴室够吗？"
        examples: "基础设施 (Basic Facilities), 商业服务 (Commercial Services), 特殊需求 (Special Needs), 增值服务 (Value-added Services)"

    operational_resilience: # 运营韧性 (Operational Resilience)
      - name: "应急与灾害响应 (Emergency & Disaster Response)"
        description: "火灾、恐怖袭击、自然灾害等极端情况的预案与空间支持。"
        ask_yourself: "紧急疏散路径清晰吗？避难区域够大吗？应急广播覆盖吗？"
        examples: "疏散预案 (Evacuation Plan), 避难区域 (Refuge Area), 应急指挥中心 (Emergency Command Center), 备用系统 (Backup Systems)"
      - name: "维护与可持续运营 (Maintenance & Sustainable Operation)"
        description: "设施维护的便捷性与长期运营成本控制。"
        ask_yourself: "关键设备能否不停运维护？清洁效率如何？能耗能否持续优化？"
        examples: "模块化设备 (Modular Equipment), 预防性维护 (Preventive Maintenance), 能源管理 (Energy Management), 智能运维 (Smart O&M)"
      - name: "未来扩展性 (Future Scalability)"
        description: "应对客流增长、技术升级的预留能力。"
        ask_yourself: "10年后客流翻倍怎么办？自动驾驶时代的空间如何改造？"
        examples: "预留扩建空间 (Reserved Expansion), 模块化设计 (Modular Design), 技术接口预留 (Tech Interface Reserve), 功能转换能力 (Function Conversion)"

  # ====================================
  # 新农村/美丽乡村/城市更新项目框架
  # ====================================
  rural_regeneration_urban_renewal:
    place_identity: # 场所身份 (Place Identity)
      - name: "历史记忆保护 (Historical Memory Preservation)"
        description: "地方历史建筑、文化符号、集体记忆的识别与保护策略。"
        ask_yourself: "什么建筑/空间承载着居民的集体记忆？如何保护而非冻结它们？微改造还是完全保留？"
        examples: "祠堂/老街保护 (Ancestral Halls/Old Streets), 工业遗产活化 (Industrial Heritage Adaptive Reuse), 口述史记录 (Oral History), 记忆地图绘制 (Memory Mapping)"
      - name: "地域文化表达 (Regional Cultural Expression)"
        description: "本土建筑语言、传统工艺、地方材料的当代转译。"
        ask_yourself: "如何用现代手法表达传统建筑的精神？本地材料能否可持续获取？传统工艺能否传承？"
        examples: "本土材料再生 (Local Material Regeneration), 传统构造现代化 (Traditional Construction Modernization), 地域符号抽象化 (Regional Symbol Abstraction), 工艺传承计划 (Craft Inheritance)"
      - name: "社区认同建构 (Community Identity Building)"
        description: "通过设计强化居民归属感与社区凝聚力。"
        ask_yourself: "什么空间能成为新的社区地标？如何让居民参与设计？改造后老居民会回来吗？"
        examples: "居民参与工作坊 (Participatory Workshop), 共创空间设计 (Co-creation Space), 社区营造活动 (Community Building Events), 文化节庆场所 (Cultural Festival Venue)"

    livelihood_economy: # 生计经济 (Livelihood & Economy)
      - name: "产业植入策略 (Industry Implantation Strategy)"
        description: "文旅、民宿、特色农业、文创等新产业的空间支持。"
        ask_yourself: "什么产业适合这里？空间如何支持新业态？本地居民能就业吗？"
        examples: "民宿集群 (Guesthouse Cluster), 文创工坊 (Cultural Creative Workshop), 农产品加工 (Agricultural Processing), 研学基地 (Study Tour Base)"
      - name: "原住民生计保障 (Indigenous Livelihood Security)"
        description: "确保改造不导致原住民被迫迁出或经济边缘化。"
        ask_yourself: "改造后房租会涨多少？本地人还住得起吗？老居民如何参与新经济？"
        examples: "租金管控 (Rent Control), 优先就业政策 (Priority Employment), 技能培训 (Skill Training), 集体经济分红 (Collective Profit Sharing)"
      - name: "公共空间经济价值 (Public Space Economic Value)"
        description: "广场、街道、绿地等公共空间的经济赋能而非纯消费。"
        ask_yourself: "集市能在哪摆？农产品展销需要什么空间？社区经济如何孵化？"
        examples: "周末集市 (Weekend Market), 农产品展销中心 (Agricultural Product Center), 手工艺品街 (Handicraft Street), 社区合作社空间 (Cooperative Space)"

    infrastructure_equity: # 基础设施公平 (Infrastructure Equity)
      - name: "基础设施补齐 (Infrastructure Gap Closure)"
        description: "水电气网、污水处理、垃圾分类、消防等基础设施达标。"
        ask_yourself: "雨污是否分流？消防通道能进车吗？网络覆盖吗？垃圾收运系统完善吗？"
        examples: "雨污分流改造 (Sewage Separation), 消防通道拓宽 (Fire Lane Widening), 光纤入户 (Fiber Optic), 垃圾分类站 (Waste Sorting Station)"
      - name: "公共服务可达性 (Public Service Accessibility)"
        description: "医疗、教育、养老、文化设施的均衡配置。"
        ask_yourself: "老人看病要走多远？孩子上学安全吗？有文化活动空间吗？"
        examples: "社区卫生站 (Community Health Center), 儿童活动中心 (Children's Center), 长者食堂 (Elder Canteen), 文化礼堂 (Cultural Hall)"
      - name: "无障碍与适老化 (Accessibility & Age-friendliness)"
        description: "考虑农村/老城老龄化现状的无障碍与适老设计。"
        ask_yourself: "坡道够缓吗？扶手连续吗？地面防滑吗？标识字够大吗？"
        examples: "无障碍坡道 (Accessible Ramps), 连续扶手系统 (Continuous Handrails), 防滑地面 (Anti-slip Flooring), 大字体标识 (Large Font Signage)"

  # ====================================
  # 宗教/精神空间项目框架
  # ====================================
  religious_spiritual:
    sacred_space: # 神圣空间 (Sacred Space)
      - name: "精神氛围营造 (Spiritual Atmosphere Creation)"
        description: "超越日常的空间体验——通过体量、光线、声学和材料唤起敬畏、沉思或超越感。是宗教/精神空间的灵魂。"
        ask_yourself: "走进这个空间的瞬间，人会自然放慢脚步、降低声音吗？空间如何引导从世俗到神圣的心理转换？"
        examples: "垂直性崇高感 (Vertical Sublimity), 水平性宁静感 (Horizontal Serenity), 黑暗-光明戏剧 (Dark-to-Light Drama), 极致留白 (Radical Emptiness)"
      - name: "神圣与世俗的阈限 (Sacred-Profane Threshold)"
        description: "从外部世界到神圣空间的过渡序列——门廊、净手池、前庭等空间如何实现心理准备。"
        ask_yourself: "入口处有让人'停下来'的仪式感吗？从街道噪音到内部静谧的声学过渡够渐进吗？"
        examples: "门廊序列 (Porch Sequence), 水景净化 (Water Purification), 光线渐变 (Light Gradient), 高度变化 (Height Transition)"
      - name: "声学品质与神圣声景 (Acoustics & Sacred Soundscape)"
        description: "混响时间、声学均匀度和背景噪音控制直接影响宗教仪式和冥想体验。"
        ask_yourself: "诵经/唱诗的混响是否增强了神圣感？冥想区足够安静吗？管风琴/钟声的声学设计到位吗？"
        examples: "长混响礼拜殿 (Long Reverb Nave), 短混响讲堂 (Short Reverb Lecture Hall), 静默冥想室 (Silent Meditation Room), 声学分区 (Acoustic Zoning)"

    ritual_experience: # 仪式体验 (Ritual Experience)
      - name: "礼拜仪式动线 (Liturgical Movement)"
        description: "宗教仪式中神职人员和信众的移动模式——游行、绕行、跪拜等对空间尺度和通道宽度的要求。"
        ask_yourself: "主要仪式的空间需求是什么？游行路线流畅吗？跪拜/礼拜方向明确吗？"
        examples: "线性游行动线 (Linear Processional), 环绕式绕行 (Circumambulation), 朝向性礼拜 (Directional Worship), 中央聚集 (Central Gathering)"
      - name: "会众动态 (Congregation Dynamics)"
        description: "信众的人数波动、社交互动模式和社区凝聚力需求。影响座位布局、集会空间和附属功能。"
        ask_yourself: "日常礼拜vs重大节日的人数差异？礼拜后的社交如何发生？社区聚餐需要什么空间？"
        examples: "固定座位堂会 (Fixed Pew Congregation), 灵活地面清真寺 (Flexible Floor Mosque), 静修小团体 (Retreat Small Group), 大型节庆集会 (Festival Gathering)"
      - name: "宗教日历与季节性 (Religious Calendar & Seasonality)"
        description: "宗教节日、斋月、圣诞季等周期性高峰对空间的弹性要求。"
        ask_yourself: "最大节日需要容纳多少人？淡季空间如何保持活力？季节性装饰如何与建筑融合？"
        examples: "年度高峰容量 (Annual Peak Capacity), 日常-节日转换 (Daily-Festival Switch), 季节性空间布置 (Seasonal Spatial Arrangement), 多功能弹性区 (Multi-use Flex Zone)"

    symbolic_system: # 象征体系 (Symbolic System)
      - name: "图像志与装饰体系 (Iconography & Ornamentation)"
        description: "宗教符号、图案、雕塑、壁画等视觉元素的神学意义与空间整合。"
        ask_yourself: "装饰是叙事性的（讲述故事）还是抽象性的（唤起情感）？传统图像志如何用当代手法诠释？"
        examples: "叙事性壁画 (Narrative Murals), 几何纹样 (Geometric Patterns), 抽象光影装置 (Abstract Light Installation), 书法艺术 (Calligraphic Art)"
      - name: "材料与光的象征性 (Material & Light Symbolism)"
        description: "石材的永恒、木材的温暖、光的神性——材料和光在宗教语境中承载的超越性意义。"
        ask_yourself: "材料选择是否回应了宗教传统？光从哪里来传达了什么神学信息？贵重材料如何象征奉献？"
        examples: "石材永恒性 (Stone Permanence), 木材有机性 (Wood Organicism), 天光神性 (Divine Zenith Light), 金箔奉献 (Gold Dedication)"
      - name: "文化延续与当代对话 (Cultural Continuity & Contemporary Dialogue)"
        description: "传统宗教建筑语言与当代设计手法的融合或张力。"
        ask_yourself: "这是一座属于这个时代的宗教建筑吗？传统要素是被复制还是被重新诠释？信众能在其中找到归属吗？"
        examples: "风格复兴 (Stylistic Revival), 批判性地域主义 (Critical Regionalism), 极简神圣 (Minimalist Sacred), 跨宗教包容 (Interfaith Inclusivity)"

  # ====================================
  # 景观/户外空间项目框架
  # ====================================
  landscape_outdoor:
    ecological_system: # 生态系统 (Ecological System)
      - name: "生物多样性策略 (Biodiversity Strategy)"
        description: "植物群落、栖息地营造和生态廊道设计。从单一绿化到多层次生态系统的光谱。"
        ask_yourself: "种植设计是否支持本地物种？能否形成自维持的生态群落？蜜蜂、蝴蝶来吗？"
        examples: "本地种优先 (Native Species Priority), 多层植物群落 (Multi-layer Plant Community), 生态跳板 (Ecological Stepping Stone), 授粉者花园 (Pollinator Garden)"
      - name: "水系统管理 (Water System Management)"
        description: "雨水收集、地表径流、水景设计和水资源循环利用的综合策略。"
        ask_yourself: "暴雨时雨水去哪？水景的水源和循环系统是什么？能否实现雨水自给？"
        examples: "雨水花园 (Rain Garden), 生态滞留池 (Bioretention Basin), 透水铺装 (Permeable Paving), 中水回用 (Greywater Recycling)"
      - name: "土壤与地形 (Soil & Terrain)"
        description: "地形塑造、土壤改良和地面系统对植物生长和空间体验的影响。"
        ask_yourself: "现有土壤能支持目标植物吗？地形设计是否利用了自然排水？填挖方量平衡吗？"
        examples: "微地形塑造 (Micro-topography), 土壤层修复 (Soil Profile Restoration), 挡土墙系统 (Retaining Wall System), 屋顶种植基质 (Roof Growing Medium)"

    spatial_experience: # 空间体验 (Spatial Experience)
      - name: "感官沉浸设计 (Sensory Immersion Design)"
        description: "超越视觉的多感官景观体验——声音、气味、触感、温度的设计性介入。"
        ask_yourself: "风吹过竹林的声音、薰衣草的气味、石板的温度——这些感官层次被设计过吗？"
        examples: "声景设计 (Soundscape Design), 芳香花园 (Aromatic Garden), 触觉步道 (Tactile Trail), 微气候舒适区 (Microclimate Comfort Zone)"
      - name: "路径与旅程设计 (Path & Journey Design)"
        description: "从入口到目的地的空间叙事——速度、方向、视线和发现时刻的编排。"
        ask_yourself: "行走节奏是快还是慢？转角处有'惊喜'吗？不同路径是否提供不同体验？"
        examples: "蜿蜒发现路径 (Meandering Discovery Path), 轴线式仪式路径 (Axial Ceremonial Path), 环路探索 (Loop Exploration), 高差体验 (Elevation Experience)"
      - name: "微气候舒适度 (Microclimate Comfort)"
        description: "遮阳、避风、降温、保暖等户外舒适性策略。决定了空间的实际使用率。"
        ask_yourself: "夏天正午有人愿意坐在这里吗？冬天的风被挡住了吗？雨天有避雨处吗？"
        examples: "树荫系统 (Shade Tree System), 风道控制 (Wind Channel Control), 水雾降温 (Misting System), 向阳暖区 (Sun Pocket)"

    maintenance_sustainability: # 维护与可持续 (Maintenance & Sustainability)
      - name: "植物生命周期管理 (Plant Life Cycle Management)"
        description: "从种植到成熟的景观演变预期和管理策略。优秀景观是'种出来'而非'装出来'的。"
        ask_yourself: "5年后景观的样子预想过吗？哪些植物会变大/消失？有继任种植计划吗？"
        examples: "速生先锋+慢生目标 (Pioneer + Target Species), 四季轮替 (Four-season Rotation), 自播繁殖策略 (Self-seeding Strategy), 修剪维护频率 (Pruning Schedule)"
      - name: "维护等级与可及性 (Maintenance Level & Accessibility)"
        description: "不同区域的维护频率/精度要求和维护人员/设备的通达性。"
        ask_yourself: "谁来维护？多久一次？除草机/洒水车能进去吗？高维护区值得吗？"
        examples: "精细园艺区 (Fine Gardening Zone), 粗放自然区 (Naturalistic Zone), 免维护硬景 (Maintenance-free Hardscape), 社区共管花园 (Community-managed Garden)"
      - name: "气候韧性与适应性 (Climate Resilience & Adaptability)"
        description: "应对极端天气、气候变化和长期环境变迁的景观韧性。"
        ask_yourself: "百年一遇暴雨能扛住吗？持续干旱两周植物还活着吗？海平面上升1米淹到哪？"
        examples: "耐旱植物配置 (Drought-tolerant Planting), 洪水缓冲带 (Flood Buffer Zone), 热岛缓解 (Heat Island Mitigation), 碳汇林 (Carbon Sink Forest)"

  # ====================================
  # 餐饮/夜生活空间项目框架
  # ====================================
  commercial_dining:
    dining_experience: # 用餐体验 (Dining Experience)
      - name: "用餐场景定义 (Dining Scene Definition)"
        description: "用餐的核心情感属性与社交语境：是快速交易、商务宴请、家庭聚会、独处享受还是打卡体验？不同场景决定了空间节奏、光线调性、声学设计和座位配置的一切选择。"
        ask_yourself: "顾客为什么来这里吃饭而不是回家或去竞品？用餐是目的还是途径（谈生意、庆生、约会）？如何在'吃饭'的功能之上叠加不可被外卖替代的空间体验？"
        examples: "快餐效率型（翻台>3次/天）, 慢食体验型（翻台<1.5次/天）, 商务宴请型（包间主导）, 网红打卡型（拍照场景驱动）, 深夜独食型（个人庇护所氛围）"
      - name: "声学氛围与噪音控制 (Acoustic Atmosphere & Noise Control)"
        description: "餐厅声学是体验设计中最常被忽视却最直接影响顾客感受的变量。嘈杂的环境会加速翻台（快餐优势），但会损害高端用餐（对话隐私）。声学不是'吸音处理'的技术问题，而是定义餐厅社交氛围的设计语言。"
        ask_yourself: "这家餐厅应该是嘈杂热闹的（信号：活跃好生意）还是私语低沉的（信号：高端私密）？什么声音是品牌体验的一部分（厨师的备餐声、音乐选曲）？什么声音是需要被吸收的噪音？"
        examples: "硬面材料回声创造热闹感（砖墙+混凝土）, 织物与绿植降低混响（地毯+吸音板）, 半开放包间提供视觉参与感+对话私密性, 背景音乐覆盖掩盖邻桌对话, 开放厨房白噪音作为氛围背景"
      - name: "灯光情境与食欲激发 (Lighting Mood & Appetite Stimulation)"
        description: "餐饮空间的灯光同时承担食欲激发、社交场景塑造和品牌调性传达三重任务。色温、显色指数、照度层级的选择在科学（食品的视觉吸引力）和美学（空间情绪）之间寻找平衡。"
        ask_yourself: "灯光让食物看起来好吃吗（色温2700-3000K+高显色指数）？桌面照度够充分阅读菜单但不刺眼吗？昼夜场景切换是否有照明脚本（午餐明亮→晚餐暧昧）？"
        examples: "烛光氛围灯（3000K以下+点状重点照明）, 北欧自然光风格（漫射光+大面积窗）, 强烈戏剧性对比（深色背景+聚光照射桌面）, 霓虹灯签名墙（打卡驱动的视觉锚点）, 户外延伸区的暖色串灯"

    operational_efficiency: # 运营效率 (Operational Efficiency)
      - name: "翻台率与动线设计 (Table Turnover & Circulation Design)"
        description: "翻台率是餐饮坪效的核心驱动。快餐追求最大翻台（座位间距小、无隐蔽角落、音乐节奏快），精品餐厅则刻意降低翻台（宽敞间距、深座位、无催离暗示）。动线设计直接影响顾客的用餐节奏感和离店意愿。"
        ask_yourself: "目标翻台率是多少？桌间距是否给顾客'被催走'的压迫感？等位区是否设计成让等待者看到座位而产生'快了快了'的心理？收银台位置是否暗示了结账离场的动作？"
        examples: "等位区可视化座位（心理加速）, 窄桌距+高亮度（快餐催离策略）, 宽敞弧形卡座（精品餐厅留客策略）, 动态预订系统对应空间灵活拼桌, 备餐动线与顾客动线完全分离"
      - name: "厨房与前厅关系 (Kitchen-Front-of-House Relationship)"
        description: "厨房的可见度与前厅体验的关联：全开放明档厨房（表演性强、卫生可见）、半开放（食物出口可见）、全封闭（神秘感、专注用餐）。厨房效率直接决定出餐速度，进而决定翻台率和顾客等待体验。"
        ask_yourself: "开放厨房的备餐噪音和气味是品牌加分还是减分？备餐区的视觉形象（厨师工装、操作台整洁度）是否愿意被顾客审视？传菜动线是否与用餐动线交叉产生碰撞？"
        examples: "寿司吧台直面顾客（食材新鲜度的视觉背书）, 玻璃隔断开放烘焙区（香气+可视化）, 明档烤鸭炉作为餐厅中央视觉焦点, 传菜口设计隐蔽但传菜效率高, 厨师操作台与顾客桌面同高（互动感）"
      - name: "包间与弹性空间配置 (Private Room & Flexible Space)"
        description: "包间是中高档餐厅的核心收入单元，但固定包间牺牲了平日散台利用率。弹性分区（可开合隔断、移动屏风）是平衡高峰/平日、散座/包厢需求的空间策略。"
        ask_yourself: "包间在周一到周五的使用率如何？散台区如何在旺季快速转化为包间区？包间是否有独立的卫生间和出入口（高端客群的基本需求）？"
        examples: "折叠隔断实现散台/包厢快速转换, 半透明屏风创造'半包'的视觉半私密感, 小包间套大包间可合并使用, VIP包间独立入口（与大厅平行的单独通道）, 宴会厅可分割为多独立包间"

    brand_culinary_identity: # 品牌与餐饮特性 (Brand & Culinary Identity)
      - name: "菜系与文化语境转译 (Cuisine & Cultural Context Translation)"
        description: "餐饮空间是菜系文化的三维载体：日料的'间'（留白与精准）、川菜的火辣红黑、法式的精致序列。空间必须与菜品建立一致的感官语境，否则会产生认知错位。但这种转译应是深层的（空间逻辑）而非表面的（堆砌文化符号）。"
        ask_yourself: "如果摘掉菜单，空间本身能传达出是什么菜系/文化吗？材料、比例、色彩、光线是否与菜品的'味觉气质'一致？'中式'空间是贴窗花、摆瓷器，还是理解了中式空间的'含蓄层次感'？"
        examples: "日料空间的桧木台面+无影漫射光+极简器物陈列, 粤菜茶楼的轻巧通透+竹影光斑+茶具展示, 新疆菜的暖土色+柔软织物+丰盛视觉堆叠, 新中式融合菜的竹钢结构+哑光黑+当代艺术插件, 分子料理实验室美学（白色+精密工具可见性）"
      - name: "品牌辨识度与打卡吸引力 (Brand Signature & Instagrammability)"
        description: "在社交媒体时代，餐厅空间的视觉传播力是核心营销资产。'签名元素'不是装饰，而是成为顾客主动传播的内容节点。但打卡设计应服务于品牌叙事而非仅仅制造网红效果。"
        ask_yourself: "空间中有没有一个让顾客不拍就走不了的'视觉时刻'？这个时刻是否真实传达了品牌的核心主张？当打卡照片在社交媒体传播时，能清晰识别这是哪家餐厅吗？"
        examples: "标志性植物墙（大量绿植=自然健康）, 定制霓虹灯品牌语句, 精心策划的厨师工作台视角, 季节性装置（每季更换的视觉记忆点）, 门头序列作为进入仪式（排队拍照机会）, 甜品区的专属灯光场景"
      - name: "时段运营与场景切换 (Time Slot Operation & Scene Switching)"
        description: "从早餐/咖啡→午餐→下午茶→晚餐→夜宵/酒吧的多时段运营模式，要求空间能支持不同时段的情绪转换——而不是靠同一套布置应付所有时段。"
        ask_yourself: "是否有多时段运营计划？各时段的客群、消费水平和停留时长差异多大？家具可以重新配置吗？灯光能切换吗？背景音乐系统支持场景编程吗？"
        examples: "全日餐厅的午间快速翻台模式→晚间精品慢食模式, 咖啡馆下午茶区域=晚间鸡尾酒吧（增设调酒台）, 日式居酒屋日间拉面→夜间下酒菜+烧酒（氛围完全不同）, 周末早午餐（brunch）的专属布置与平日差异化"

  # ====================================
  # 商业零售/品牌体验项目框架
  # ====================================
  commercial_retail:
    customer_journey: # 顾客旅程 (Customer Journey)
      - name: "入口与吸引力 (Entrance & Attraction)"
        description: "从街面到店内的吸引-进入-转换链。橱窗、入口开敞度和第一印象区的设计决定进店率。"
        ask_yourself: "路人会被吸引停下脚步吗？入口有心理门槛吗？走进来的第一印象是什么？"
        examples: "全开放式入口 (Fully Open Entrance), 橱窗叙事 (Window Storytelling), 入口引导区 (Entrance Transition Zone), 气味/音乐引流 (Scent/Music Drawing)"
      - name: "浏览动线与停留节奏 (Browsing Flow & Dwell Rhythm)"
        description: "从快速扫视到深度停留的空间编排。动线设计决定顾客看到什么、在哪停留、如何决策。"
        ask_yourself: "主动线是否经过所有高利润区？'速度减速带'设在哪？死角有没有？"
        examples: "环形主动线 (Loop Main Path), 网格自由探索 (Grid Free Exploration), 区域聚落 (Zone Cluster), 目的地锚点 (Destination Anchor)"
      - name: "决策触发区 (Decision Trigger Zone)"
        description: "商品展示、试用体验和购买决策发生的关键区域。是转化率的空间决定因素。"
        ask_yourself: "顾客在哪里'动心'？试衣间/体验区是否舒适到促进购买？收银台排队体验如何？"
        examples: "核心展示岛 (Core Display Island), 体验式试用区 (Experiential Try-on), 冲动购买区 (Impulse Buy Zone), 无压力结账 (Frictionless Checkout)"

    visual_merchandising: # 视觉营销 (Visual Merchandising)
      - name: "展示层级体系 (Display Hierarchy System)"
        description: "从旗舰展示到日常陈列的视觉力度分级。引导顾客注意力的空间策略。"
        ask_yourself: "走进来视线第一个落点在哪？主推品和常规品的展示差异够大吗？视线高度利用了吗？"
        examples: "焦点舞台 (Focal Stage), 视线高度黄金带 (Eye-level Golden Zone), 垂直层级 (Vertical Hierarchy), 留白对比 (Negative Space Contrast)"
      - name: "灯光作为销售工具 (Lighting as Sales Tool)"
        description: "重点照明、环境照明和装饰照明的商业化运用。是除商品本身外最强的销售力量。"
        ask_yourself: "重点商品的照度是环境的几倍？色温是否让商品看起来更好？试衣间的灯光'诚实'吗？"
        examples: "重点照明 (Accent Lighting), 色温分区 (Color Temperature Zoning), 戏剧性明暗 (Dramatic Contrast), 自然光模拟 (Daylight Simulation)"
      - name: "品牌空间语言 (Brand Spatial Language)"
        description: "品牌DNA在空间中的三维表达——材料、色彩、比例、气味构成的品牌识别系统。"
        ask_yourself: "蒙上眼睛走进来能猜到是哪个品牌吗？空间语言与平面VI一致吗？线上线下体验衔接吗？"
        examples: "标志性材料 (Signature Material), 品牌色彩系统 (Brand Color System), 感官标识 (Sensory Branding), 空间叙事 (Spatial Storytelling)"

    operational_commerce: # 运营商业 (Operational Commerce)
      - name: "库存与物流整合 (Stock & Logistics Integration)"
        description: "后场仓储、补货动线和线上线下库存联动。前场体验与后场效率的隐形衔接。"
        ask_yourself: "补货路线会打扰顾客吗？库存周转率与展示面积的比例合理吗？前店后仓的关系清晰吗？"
        examples: "隐蔽补货通道 (Hidden Restocking Route), 前店后仓 (Front Store Back Stock), 暗仓直发 (Dark Store Fulfillment), 展销分离 (Showroom-Warehouse Split)"
      - name: "员工动线与工作效率 (Staff Workflow & Efficiency)"
        description: "店员的服务半径、协作动线和休息-工作转换空间。员工效率直接影响顾客体验。"
        ask_yourself: "店员能在30秒内到达任何区域吗？收银/咨询台位置最优吗？员工休息区体面吗？"
        examples: "中央服务台 (Central Service Hub), 流动式服务 (Roaming Service), 后场效率优化 (Back-of-house Efficiency), 员工福祉空间 (Staff Wellbeing Space)"
      - name: "坪效与体验平衡 (Revenue per SQM & Experience Balance)"
        description: "每平方米创造的营收与顾客体验投资的动态平衡。是零售空间设计的终极方程。"
        ask_yourself: "非销售面积（休息区、体验区）的间接贡献如何量化？哪些'低坪效'区域创造了高复购率？"
        examples: "高密度陈列 (High-density Display), 体验驱动型 (Experience-driven), 社交零售 (Social Retail), 数据驱动优化 (Data-driven Optimization)"

# ============================================================
# 专家强化层 (Expert Enhancement Layer)
# ============================================================
# 说明：针对特定专家角色的额外分析维度
# 用途：在基础框架和项目类型框架之上，注入专家特有的关注点
# 原则：可选注入，仅当专家需要特殊视角时使用

expert_extensions:
  # ──────────────────────────────────────────────────────────
  # 键名与运行时 role_id 严格对应：
  #   文件名 v{N}[_{sub}]_{name}.yaml
  #   提取逻辑：split("_") → 跳过版本前缀 + 可选数字子索引 → join剩余部分
  #   例：V6_1_functional_optimization → functional_optimization
  # ──────────────────────────────────────────────────────────

  # V2 — design_director (A1 概念架构 + A2 空间建构)
  design_director:
    additional_dimensions:
      - name: "设计概念内核提炼 (Design Concept Core Extraction)"
        description: "从项目全部信息中蒸馏出统领全局的核心立意——区分'形式表象'与'立意本质'，确保每一个设计决策都指向同一个内核。"
        ask_yourself: "这个项目的'一句话立意'是什么？如果去掉所有装饰，核心概念还能被感知吗？形式是在'表达'立意还是在'炫耀'技巧？"
        examples: "A1-立意原型 (Conceptual Archetype), A1-价值观锚点 (Value Anchor), A1-概念内聚度检验 (Concept Coherence Audit)"
      - name: "空间组织逻辑校验 (Spatial Organization Logic Audit)"
        description: "审视功能分区、轴线关系与流线设计是否在逻辑上自洽——识别'方案上图好看但实际使用别扭'的空间决策陷阱。"
        ask_yourself: "主动线是否和使用频率匹配？轴线关系是权宜之计还是刻意设计？哪个功能组合在三维中碰撞了？"
        examples: "A2-功能分区逻辑 (Zoning Logic), A2-轴线层级系统 (Axes Hierarchy), A2-流线冲突诊断 (Circulation Conflict Diagnosis)"

  # V3 — narrative_expert (A3 叙事编排)
  narrative_expert:
    additional_dimensions:
      - name: "情感弧线设计 (Emotional Arc Design)"
        description: "将空间序列转化为有温度的叙事弧线——起承转合的情绪节拍植入，让空间'讲述故事'而非单纯'提供功能'。"
        ask_yourself: "进入这个空间的第一句'旁白'是什么？情绪高潮在哪里？离开时最后一个印象是什么？有没有'反转时刻'让人意外地被打动？"
        examples: "A3-渐进式揭示 (Gradual Reveal), A3-情绪节拍图 (Emotional Beat Map), A3-场景转场设计 (Scene Transition Design)"
      - name: "使用者人物志与旅程映射 (User Persona & Journey Mapping)"
        description: "为核心用户群构建立体人物志（身份/习惯/欲望/恐惧），反推空间每个触点需要传递什么感受，实现从'做给人看'到'做给人用'的跃迁。"
        ask_yourself: "谁是这个空间的'主角'？他们来这里时带着什么情绪？他们最害怕什么体验？空间如何在他们没有意识到的时刻改变了他们的状态？"
        examples: "A3-用户旅程地图 (User Journey Map), A3-触点情绪标注 (Touchpoint Emotion Tagging), A3-潜意识感知设计 (Unconscious Perception Design)"

  # V4a — design_researcher (A12 文明表达)
  design_researcher:
    additional_dimensions:
      - name: "文化基因解码 (Cultural DNA Decoding)"
        description: "从场地历史、地域气候、建造传统、社区记忆中提取可转译为当代空间语言的文化符号——区分'文化符号的表皮使用'与'文化基因的当代激活'。"
        ask_yourself: "这个地方的'文化指纹'是什么？哪些传统要素是可以剥离语境提炼的'活基因'？如何让文化表达变成内生性的，而非像是贴上去的装饰品？"
        examples: "A12-本土建造语汇 (Vernacular Construction Vocabulary), A12-历史层叠分析 (Historical Strata Analysis), A12-文化基因现代转译 (Cultural DNA Modernization)"
      - name: "跨文明案例类比框架 (Cross-Civilizational Case Analogy)"
        description: "在全球建筑史与当代实践中寻找与当前命题高度相似的先例，建立类比参照系——不是抄袭，而是寻找问题的'先验解法轨迹'。"
        ask_yourself: "全球建筑史上有哪些项目曾经面对同样的命题？他们用了什么策略？如果将先例的逻辑平移到本项目，需要做哪些在地化调整？"
        examples: "A12-类型学先例分析 (Typological Precedent Analysis), A12-命题相似度矩阵 (Problem Similarity Matrix), A12-策略迁移可行性 (Strategy Migration Feasibility)"

  # V4b — technology_consultant (A4 材料智能)
  technology_consultant:
    additional_dimensions:
      - name: "材料性能-美学-成本三角优化 (Material Performance-Aesthetics-Cost Triangle)"
        description: "在每个关键设计部位，系统性评估'性能达标/美学到位/成本可控'三角的平衡点——避免陷入'要美就贵、要省就丑'的二元思维。"
        ask_yourself: "这个部位的材料选择，性能底线是什么？'质感'来自真实材料还是视觉欺骗？有没有预算内的材料能实现70%的效果？"
        examples: "A4-材料替代可行性 (Material Substitution Feasibility), A4-触觉品质分级 (Tactile Quality Hierarchy), A4-成本-感知比 (Cost-Perception Ratio)"
      - name: "工艺创新可行性边界 (Craft Innovation Feasibility Boundary)"
        description: "区分'值得追求的工艺创新'与'超出预算控制的实验'——在创新冲动与工程理性之间找到可执行的边界。"
        ask_yourself: "这个工艺在国内有施工队做过吗？实验性节点的失败代价是什么？标准化工艺如何做出非标的效果？"
        examples: "A4-工艺成熟度评级 (Craft Maturity Rating), A4-节点施工难度评估 (Joint Construction Difficulty), A4-参数化工艺探索 (Parametric Craft Exploration)"

  # V5 — scenario_expert (A11 运营产品化)
  scenario_expert:
    additional_dimensions:
      - name: "业态运营逻辑验证 (Operational Logic Validation)"
        description: "验证空间设计是否在真实运营场景下支撑目标业态的核心KPI——将'设计方案'和'运营模型'放在同一张桌子上对齐。"
        ask_yourself: "按当前设计，高峰期每小时能接待多少人？坪效目标是多少？员工操作动线有没有和顾客动线打架？"
        examples: "A11-运营KPI空间映射 (Operational KPI Spatial Mapping), A11-高峰期容量验证 (Peak Capacity Verification), A11-员工-顾客动线分离 (Staff-Guest Circulation Separation)"
      - name: "场景产品化路径 (Scene Productization Pathway)"
        description: "将空间体验设计为可复制、可迭代、可营销的标准化产品场景——从'一次性设计作品'升级为'可持续运营的场景产品'。"
        ask_yourself: "这个空间体验有没有可以打包成'产品名称'的核心卖点？哪些场景元素是必须的标准品，哪些是灵活的定制项？如果要在三个城市复制这个概念，哪些必须保留，哪些可以本地化？"
        examples: "A11-场景IP提炼 (Scene IP Extraction), A11-标准化-定制化比例设计 (Standardization-Customization Mix), A11-可复制性评估 (Replicability Assessment)"

  # V6 — chief_engineer (A2 空间建构 实现侧)
  chief_engineer:
    additional_dimensions:
      - name: "实现工程可行性预判 (Engineering Feasibility Pre-assessment)"
        description: "在方案阶段就识别结构、机电、幕墙等专项的重大技术风险——将'方案好看但盖不起来'的问题在设计早期暴露和化解。"
        ask_yourself: "这个空间跨度需要什么结构体系？大开窗背后的幕墙荷载有没有算过？哪个节点是'理论上可行但实践中极难施工'的？"
        examples: "A2-结构体系关键风险 (Structural System Key Risk), A2-专项顾问介入时机 (Specialist Consultant Timing), A2-方案可盖度评级 (Buildability Rating)"
      - name: "价值工程优化提案 (Value Engineering Proposal)"
        description: "在不损害核心设计意图的前提下，系统性识别成本优化机会——区分'隐蔽工程的不可妥协'与'可见面的智慧替代'。"
        ask_yourself: "哪个结构或构造方案能以60%的成本实现90%的效果？预制化能节省多少工期和造价？有没有设计决策是'看起来省钱但长期维护费'的？"
        examples: "A2-价值工程杠杆点 (Value Engineering Leverage Point), A2-预制化适用范围 (Prefabrication Applicability), A2-全生命周期成本视角 (Life Cycle Cost Perspective)"

  # V6_1 — functional_optimization (A6 功能优化)
  functional_optimization:
    additional_dimensions:
      - name: "动线效率量化分析 (Circulation Efficiency Quantification)"
        description: "量化分析主要使用场景下的核心动线距离、交叉冲突点和流速瓶颈——将'感觉好走'变成可验证的数据。"
        ask_yourself: "从入口到最高频到达点的动线距离是多少？有几个交叉点？高峰期瓶颈宽度够不够？员工备餐动线和顾客动线有几处交叉？"
        examples: "A6-动线长度热力图 (Circulation Length Heatmap), A6-交叉冲突点识别 (Conflict Point Identification), A6-瓶颈截面宽度计算 (Bottleneck Width Calculation)"
      - name: "功能弹性分区策略 (Functional Flexible Zoning Strategy)"
        description: "在满足当期功能需求的前提下，预留未来转变功能组合的弹性——避免'五年后大改'的昂贵代价。"
        ask_yourself: "如果三年后扩大某个功能区，需要改动哪里？哪些功能组合可以通过简单改装实现？分区边界选在哪儿，将来改造成本最小？"
        examples: "A6-功能切换改造成本预测 (Function Switch Cost Projection), A6-可逆性改造设计 (Reversible Renovation Design), A6-模块化功能单元 (Modular Functional Unit)"

  # V6_2 — capital_strategy_expert (A7 资本策略)
  capital_strategy_expert:
    additional_dimensions:
      - name: "投资回报时序模型 (ROI Timeline Model)"
        description: "构建设计决策与投资回报周期之间的因果链——量化分析'投入更多/收回更快/长期更省'三个维度的权衡。"
        ask_yourself: "按照当前设计方案，投资回报期是几年？哪个设计决策对资产增值影响最大？提高初期投入能否缩短回收周期？"
        examples: "A7-设计决策-ROI因果链 (Design Decision-ROI Causal Chain), A7-增量投入边际回报 (Marginal Return on Incremental Investment), A7-资本回收期敏感度 (Payback Period Sensitivity)"
      - name: "资产价值锚点识别 (Asset Value Anchor Identification)"
        description: "识别对提升资产长期价值影响最大的设计要素——区分'使用价值驱动溢价'与'稀缺性驱动溢价'的不同逻辑。"
        ask_yourself: "这个资产的核心溢价来源是什么？哪些设计要素在五年后还能为资产增值？如何在设计中构建可持续的'资产护城河'？"
        examples: "A7-稀缺性要素设计 (Scarcity Factor Design), A7-使用年限价值衰减预测 (Value Depreciation Prediction), A7-资产差异化定位 (Asset Differentiation Positioning)"

  # V6_3 — technology_integration_expert (A8 技术整合)
  technology_integration_expert:
    additional_dimensions:
      - name: "智能系统层级架构 (Smart System Architecture)"
        description: "规划覆盖感知层→控制层→平台层→应用层的完整技术栈——确保各系统协议兼容、数据互通，避免形成'智能孤岛'。"
        ask_yourself: "各子系统（暖通/照明/安防/运营）能统一接入同一管控平台吗？数据采集点覆盖了哪些关键节点？技术方案能支撑未来3年的升级迭代吗？"
        examples: "A8-协议兼容性矩阵 (Protocol Compatibility Matrix), A8-数据流图 (Data Flow Diagram), A8-系统集成复杂度评级 (Integration Complexity Rating)"
      - name: "数字孪生集成度评估 (Digital Twin Integration Assessment)"
        description: "评估建筑设计支撑数字化运营和预防性维护的能力——量化从BIM模型到运营数字孪生的流转效率。"
        ask_yourself: "BIM模型能直接对接运营平台吗？哪些设备安装了可预测故障的传感器？数字孪生能反映多大比例的建筑运营状态？"
        examples: "A8-BIM-运营转化率 (BIM-to-Operations Conversion Rate), A8-预防性维护触发点设计 (Predictive Maintenance Trigger Design), A8-数字孪生精度分级 (Digital Twin Fidelity Level)"

  # V6_4 — operational_analyst (A11 运营分析)
  operational_analyst:
    additional_dimensions:
      - name: "运营KPI空间映射 (Operational KPI Spatial Mapping)"
        description: "将运营绩效指标（人效/坪效/满意度/转化率）与具体空间设计要素建立可测量的因果关系——从'看起来运营友好'变成'数据证明运营高效'。"
        ask_yourself: "哪个空间区域正在成为运营KPI的瓶颈？动线设计影响了多少%的转化率？如何用空间设计干预提升目标指标？"
        examples: "A11-坪效-空间设计因果链 (Revenue Per Sqm-Design Causal Chain), A11-转化漏斗空间优化 (Conversion Funnel Spatial Optimization), A11-人效提升动线重构 (Staff Efficiency Circulation Redesign)"
      - name: "低效空间改造优先级矩阵 (Inefficient Space Renovation Priority Matrix)"
        description: "识别当前运营中的空间痛点，按'改造投入/运营收益提升'比例排序，构建可执行的优先级矩阵。"
        ask_yourself: "哪些区域的每平米创收远低于平均值？哪个改造能以最小投入带来最大运营改善？改造期间停业损失如何最小化？"
        examples: "A11-空间效能热力图 (Space Efficiency Heatmap), A11-改造ROI排序 (Renovation ROI Ranking), A11-分阶段改造计划 (Phased Renovation Plan)"

  # V6_5 — lighting_engineer (A5 光照建筑)
  lighting_engineer:
    additional_dimensions:
      - name: "照明层次设计框架 (Lighting Layer Design Framework)"
        description: "区分环境照明/重点照明/装饰照明/情绪照明四个层次，确保每个空间的照明语言与设计意图高度一致——不只是'亮度达标'而是'光的叙事到位'。"
        ask_yourself: "这个空间的照明主角是什么？哪里需要戏剧性反差？背景光和重点光的照度比是多少？照明系统能支持一天内不同时段的场景切换吗？"
        examples: "A5-四层照明逻辑 (Four-layer Lighting Logic), A5-照度比设计 (Illuminance Ratio Design), A5-照明场景切换系统 (Lighting Scene Switching System)"
      - name: "昼夜节律照明策略 (Circadian Rhythm Lighting Strategy)"
        description: "基于使用者的活动规律和生物节律，设计支持健康昼夜节律的全天候动态照明系统——超越'照够了'进入'照得健康'。"
        ask_yourself: "这个空间的使用时段覆盖几个昼夜节律阶段？下午2-4点照明如何支持工作效率？晚间照明如何降低蓝光干扰睡眠？"
        examples: "A5-色温动态变化曲线 (Correlated Color Temperature Dynamic Curve), A5-蓝光抑制照明方案 (Blue Light Suppression Design), A5-人因照明指标 (Human-centric Lighting Metrics)"

  # V6_6 — sustainability_expert (A10 环境适应性)
  sustainability_expert:
    additional_dimensions:
      - name: "被动式优先层级策略 (Passive-first Strategy)"
        description: "在引入任何主动系统之前，最大化被动式设计的节能和舒适潜力——构建'先减少需求，再考虑供给'的可持续设计逻辑。"
        ask_yourself: "朝向优化、遮阳、自然通风、热质量等被动措施能解决多少负荷？主动系统是在弥补被动设计的缺陷，还是真正的必要补充？被动优先能把运营能耗降低多少百分比？"
        examples: "A10-被动措施减碳潜力评估 (Passive Measure Carbon Reduction Potential), A10-主被动临界点分析 (Active-Passive Threshold Analysis), A10-气候适应性建筑策略 (Climate-Responsive Design Strategy)"
      - name: "全生命周期碳足迹框架 (Life Cycle Carbon Assessment Framework)"
        description: "识别材料生产/建造施工/运营使用/拆除回收四个阶段的主要碳排放节点，构建从'绿色表皮'到'系统性低碳'的决策逻辑。"
        ask_yourself: "这个项目全生命周期碳排放的最大来源是哪个阶段？材料选择对隐含碳的影响有多大？如何实现运营碳排放到2035年的降低路径？"
        examples: "A10-隐含碳热点材料识别 (Embodied Carbon Hotspot Identification), A10-运营碳降低路径 (Operational Carbon Reduction Pathway), A10-碳中和时间线规划 (Carbon Neutrality Timeline)"

  # V7 — emotional_insight_expert (A9 社会结构建模)
  emotional_insight_expert:
    additional_dimensions:
      - name: "社会关系网络建模 (Social Relationship Network Modeling)"
        description: "识别空间中隐含的权力关系、亲密度层级和群体边界，将社会结构映射为空间设计需求——让空间成为'正义关系'的载体而非放大既有不平等。"
        ask_yourself: "谁在这个空间里有权力？谁被边缘化了？空间布局是否强化了我们想要强化的社会关系？哪些群体被无意识地设计成了'旁观者'？"
        examples: "A9-权力空间映射 (Power-Space Mapping), A9-亲密度层级分区 (Intimacy Hierarchy Zoning), A9-群体边界设计 (Group Boundary Design)"
      - name: "空间排斥与包容性审查 (Spatial Exclusion & Inclusion Audit)"
        description: "系统检视当前设计中哪些群体被无意识地排除在外——从年龄/身体能力/文化身份/经济阶层多个维度进行包容性审查。"
        ask_yourself: "一个使用轮椅的老人能独立完成所有功能吗？非主流文化背景的使用者会感到被欢迎还是被排斥？哪些'中性'设计决策实际上在隐性地筛选特定人群？"
        examples: "A9-多维度包容性矩阵 (Multi-dimensional Inclusion Matrix), A9-无障碍体验全路径检验 (Universal Design Full Path Audit), A9-文化敏感性设计评估 (Cultural Sensitivity Design Assessment)"

  # V7_2 — organizational_psychologist (A9 社会结构建模 组织深层)
  organizational_psychologist:
    additional_dimensions:
      - name: "组织文化物化分析 (Organizational Culture Spatialization)"
        description: "分析目标组织的文化特征（层级vs平等/竞争vs协作/个人vs集体），将文化基因转译为对空间权力结构、流通方式和边界设计的具体要求。"
        ask_yourself: "这个组织说它是'扁平化文化'——空间是否真的在支持这一点？CEO的办公室设计是否与公司价值观矛盾？开放座位区能带来文化认同还是暴露文化伪装？"
        examples: "A9-组织文化-空间语言映射 (Org Culture-Space Language Mapping), A9-权力距离空间指标 (Power Distance Spatial Index), A9-文化真实性-形象传达对比 (Culture Authenticity vs Brand Projection)"
      - name: "群体动力学空间干预设计 (Group Dynamics Spatial Intervention)"
        description: "预测物理环境改变对团队沟通模式、创造力激发和集体凝聚力的潜在影响——将组织心理学研究成果转化为可执行的空间设计决策。"
        ask_yourself: "碰撞式遇见区的设计能提升多少非正式协作？专注工位和协作区的面积比例应该是多少？会议室设计如何减少权力压制下的沉默？"
        examples: "A9-非正式交流触发设计 (Informal Collision Design), A9-协作-专注空间比例研究 (Collaboration-Focus Space Ratio), A9-会议室去权力化设计 (Meeting Room Power Neutralization Design)"

# ============================================================
# 认知脚手架 (Cognitive Scaffolding)
# ============================================================
# 定义分析深度的阶梯，指导专家按项目复杂度和用户需求调整提问深度
# 使用方式：结合 activation_profiles 确定特定业态下的典型认知深度
# 注入时机：由 OntologyLoader 在 format_as_prompt 中按需注入

cognitive_scaffolding:
  description: "认知层级框架——分析不应停留在同一深度，而应沿着 L0→L4 的阶梯逐层深入。简单装修需求可能只需 L0-L1，深度设计咨询则需要推进到 L3-L4。"
  levels:
    L0_factual:
      name: "事实层 (Factual)"
      prompt_pattern: "是什么/有多少/在哪里/什么规格"
      description: "收集客观事实和数据，建立分析基础。不评判、不推断，纯粹的信息采集。"
      typical_questions: "面积多大？层高多少？朝向？采光时长？预算范围？家庭成员构成？"
      risk_if_skipped: "缺少事实基础的分析容易变成'空中楼阁'式的概念泛泛而谈"
    L1_functional:
      name: "功能层 (Functional)"
      prompt_pattern: "够不够/好不好/达标吗/能否满足"
      description: "评估功能是否满足需求，识别达标/不达标的领域。这是设计的基本及格线。"
      typical_questions: "收纳空间够用吗？动线有交叉冲突吗？通风采光达标吗？设备容量匹配吗？"
      risk_if_skipped: "忽略功能基础直奔'体验设计'会导致好看不好用的方案"
    L2_experiential:
      name: "体验层 (Experiential)"
      prompt_pattern: "感受如何/体验怎样/氛围是否匹配"
      description: "评估空间的感知品质和情感影响。从'能用'跨越到'好用且有感'。"
      typical_questions: "走进这个空间的第一感受是什么？光影变化创造了什么情绪节奏？材料触感传达了什么温度？"
      risk_if_skipped: "停留在功能层的设计是'正确但无感'——满足所有指标但缺乏灵魂"
    L3_interpretive:
      name: "意义层 (Interpretive)"
      prompt_pattern: "意味着什么/传达了什么/为什么这样而非那样"
      description: "解读设计决策背后的价值观和叙事意图。追问设计'为什么'而非'是什么'。"
      typical_questions: "这种材料选择传达了什么生活态度？空间序列讲述了一个什么故事？留白是刻意的克制还是无意的遗漏？"
      risk_if_skipped: "缺乏意义层的分析无法区分'有意为之'和'碰巧如此'——无法产生有深度的设计论述"
    L4_dialectical:
      name: "张力层 (Dialectical)"
      prompt_pattern: "X vs Y 如何取舍/矛盾如何调和/底线在哪"
      description: "识别并回应设计中的核心矛盾与不可调和的取舍。这是设计智慧的最高体现——承认矛盾存在而非假装可以'全都要'。"
      typical_questions: "自然采光最大化 vs 隐私保护，底线在哪？材料真实性 vs 预算约束，如何取舍？效率坪效 vs 体验停留，优先级是什么？"
      risk_if_skipped: "回避张力的分析容易沦为'面面俱到的正确废话'——每个维度都讨论了但没有做出真正的设计决策"

# ============================================================
# 业态激活图谱 (Activation Profiles)
# ============================================================
# 定义每种项目类型在本体论维度(E1-E9)上的激活重心和典型认知深度
# 用途：注入时为专家提供"这类项目重点看什么、分析到多深"的指导
# 原理：不重写维度内容（避免重复），而是指向 ontological_foundations 中的议题
# 注入方式：由 OntologyLoader 在 format_as_prompt 中合并到提示头部

activation_profiles:
  personal_residential:
    elevated_topics: [E2, E3, E4, E5]
    typical_depth: "L2-L4"
    guidance: "住宅项目的分析重心在'居住者的身体-感知-记忆'三角。E2(身体体验)和E3(光)往往是区分普通设计与优秀设计的分水岭。务必从L2(体验感受)深入到L4(生活方式取舍)，避免停留在L0-L1的功能清单层面。住宅设计的终极命题不是'功能够不够'，而是'这个空间如何承载一种生活方式的愿景'。"
    key_tensions:
      - "私密性 vs 自然采光——大面积开窗带来的光和景观，与被邻居/街道窥视的不安全感(E3×E2)"
      - "材料真实性 vs 预算约束——业主想要'有质感的空间'，但真正有质感的材料往往超出预算，如何在诚实与妥协间找到平衡(E4×E9)"
      - "当下需求 vs 家庭生命周期——为三岁孩子做的设计，在孩子十三岁时还适用吗？空间的弹性如何预留(E5×E1)"
      - "个人审美表达 vs 家庭成员共识——夫妻审美不一致、代际偏好差异时，空间如何成为'协商的产物'而非'一方的独裁'(E9×E2)"

  hybrid_residential_commercial:
    elevated_topics: [E1, E5, E7, E8, E9]
    typical_depth: "L1-L4"
    guidance: "混合型项目的核心矛盾是'两种生活逻辑共用一个物理容器'。E1(空间体量)决定了边界的物理可能性，E5(时间)决定了分时共用的可行性。E7(社会关系)在这里体现为家庭成员与客户之间的界面管理。必须在L4层面直面'居住品质 vs 经营效率'的根本张力，并认真评估法规合规性。"
    key_tensions:
      - "居住隐私 vs 商业可达——顾客的便捷入口意味着家庭空间被侵蚀(E1×E9)"
      - "角色切换成本 vs 空间效率——完全分离保护心理边界但浪费面积(E1×E5)"
      - "家庭参与 vs 专业运营——家人帮忙有温度但可能缺乏专业边界(E8×E9)"
      - "商业扩张欲望 vs 居住底线——每次改建都在蚕食生活空间，底线在哪(E7×E9)"

  commercial_dining:
    elevated_topics: [E2, E3, E5, E7]
    typical_depth: "L1-L3"
    guidance: "餐饮空间E3(灯光与食欲)和E2(座位的身体舒适度)是最直接影响顾客感受的变量。E7(社会关系)在餐厅中以'社交密度与私密性'的张力呈现。E5(时间)体现为翻台节奏和多时段运营切换。分析需超越L1(坪效/翻台)推进到L2(用餐场景体验)——外卖无法替代的'在这里吃饭'的独特价值是设计的核心命题。"
    key_tensions:
      - "翻台率 vs 停留舒适——快餐的催离设计vs精品的挽留设计，哪种更符合定位(E5×E9)"
      - "声学嘈杂活力 vs 对话私密——热闹氛围制造'生意好'信号，但高端用餐需要私语(E3×E7)"
      - "开放厨房表演性 vs 厨房效率私密——让顾客看到美好制作过程 vs 不想让人看到'后台'(E2×E8)"
      - "本地文化深度表达 vs 网红打卡包装——菜系文化的严肃转译 vs 视觉驱动的传播性设计(E4×E6)"

  commercial_enterprise:
    elevated_topics: [E1, E3, E9]
    typical_depth: "L1-L3"
    guidance: "商业项目E9(经济伦理)和E1(空间体量)是硬约束，E3(光)是体验差异化的核心。需要在L1(坪效/效率)和L3(品牌叙事)之间建立桥梁——好的商业空间是效率和意义的统一，而非'先算坪效再补故事'。"
    key_tensions:
      - "坪效最大化 vs 体验停留时长——更多陈列面积意味着更少的休息区和社交空间(E1×E9)"
      - "品牌一致性 vs 在地化表达——连锁品牌的标准化与本地文化的独特性如何共存(E3×E4)"
      - "空间开敞感 vs 声学隐私——通透的空间有视觉感染力，但对话清晰度和噪音控制受损(E1×E8)"

  public_cultural:
    elevated_topics: [E1, E3, E5]
    typical_depth: "L2-L4"
    guidance: "文化展馆类项目E1(空间序列)和E3(光的戏剧性)是构建展览体验的两大支柱。分析需要达到L3(意义层)——展览空间不只是'容器'，空间本身就是展品的一部分。E5(时间)在临展/常设展切换和参观节奏设计中起关键作用。"
    key_tensions:
      - "保护文物 vs 观众互动——低照度保护需求与沉浸式体验的光照需求矛盾(E3×E8)"
      - "策展叙事控制 vs 自由探索——强线性动线保证完整叙事但压制个人发现(E1×E2)"
      - "教育使命 vs 娱乐吸引力——深度内容与大众可参与性的平衡(E5×E9)"

  healthcare_wellness:
    elevated_topics: [E2, E3, E8]
    typical_depth: "L0-L4"
    guidance: "医疗项目E2(身体体验)达到最高优先级——患者的身体往往处于脆弱/受限状态，空间对身体的'接收方式'直接影响康复。必须全深度覆盖：从L0(无障碍硬指标)到L4(尊严vs效率的伦理取舍)。E3(光)的循证治疗效果在此类项目中有最强的研究支撑。"
    key_tensions:
      - "监控效率 vs 患者尊严——护士可视性需求与患者隐私权的根本矛盾(E2×E8)"
      - "感染控制 vs 空间温度——无菌要求与'像家一样'的心理需求对立(E8×E4)"
      - "临床标准化 vs 个体化照护——规模效率与'被当作一个人而非一个病号'的尊严(E2×E9)"

  commercial_office:
    elevated_topics: [E1, E2, E8]
    typical_depth: "L1-L3"
    guidance: "办公空间E1(开敗vs封闭的体量选择)和E2(久坐/行走/协作的身体模式)是日常使用频率最高的本体议题。E8(技术基础设施)在混合办公时代成为空间体验的隐形决定者。警惕L1层面的'效率陷阱'——工位密度最大化不等于生产力最大化。"
    key_tensions:
      - "协作开放 vs 专注安静——开放空间促进偶遇但破坏深度思考(E1×E2)"
      - "层级表达 vs 平等文化——CEO独立办公室是否与'扁平化'价值观矛盾(E1×E9)"
      - "标准化工位 vs 工作模式多样性——一种工位打天下vs多种设置增加管理成本(E2×E8)"

  commercial_hospitality:
    elevated_topics: [E3, E4, E5]
    typical_depth: "L2-L4"
    guidance: "酒店文旅项目E3(光)、E4(材料触感)和E5(季节/昼夜时间性)三者交织构成'在地体验'的物质基础。分析重心在L2-L3——宾客体验的核心不是功能完备度，而是'这个地方与别处有什么不同'的独特感受。E4(材料)的在地性选择往往是差异化竞争的物质锚点。"
    key_tensions:
      - "品牌标准化 vs 在地独特性——连锁酒店的品控需求与'此地此刻'的独特性(E4×E5)"
      - "服务可见度 vs 空间宁静——高端服务的'无处不在'与宾客'被放下'的渴望(E2×E1)"
      - "旺季容量 vs 淡季空置——为高峰设计的规模在平日显得空旷寂寥(E1×E5×E9)"

  sports_entertainment_arts:
    elevated_topics: [E1, E3, E8]
    typical_depth: "L1-L3"
    guidance: "体育演艺项目E1(大空间体量控制)和E8(声学/灯光/视线等技术系统)是专业性能的基础。E3(光)在演出场馆中从'环境要素'跃升为'叙事语言'。关注L2层面的峰值体验设计——进球瞬间、谢幕时刻，空间如何放大情感爆发。"
    key_tensions:
      - "赛事专业标准 vs 日常社区使用——国际认证场馆在非赛期的社区价值如何实现(E8×E9)"
      - "极致声学 vs 多功能转换——音乐厅的声学完美主义与综合使用的灵活性需求(E8×E1)"
      - "观众安全容量 vs 氛围营造——更少的人更安全，但气氛也更冷清(E1×E2)"

  industrial_conversion:
    elevated_topics: [E2, E8, E9]
    typical_depth: "L0-L2"
    guidance: "工业项目E8(生产技术系统)是绝对主导，但E2(工人身体体验)是长期被低估的人文议题。分析以L0-L1(硬指标达标)为基础，但务必推进到L2——生产效率和工人身心健康不是对立面。E9(经济)在这里特指生产成本优化与职业环境投资的平衡。"
    key_tensions:
      - "生产效率 vs 工人舒适——自动化程度、工作台高度、噪音控制的投资回报(E8×E2)"
      - "环保合规 vs 成本控制——废气废水处理的'及格线'与'目标线'的差距(E8×E9)"
      - "当期产能 vs 扩展弹性——满产布局vs预留未来产线的空间(E1×E5)"

  educational_facility:
    elevated_topics: [E1, E2, E5, E8]
    typical_depth: "L1-L3"
    guidance: "教育项目E1(教学空间的可重构性)和E2(学生身体的多样化学习姿态)正在经历从'教室+走廊'向'学习生态'的范式转变。E5(时间)体现在学期节律、课间转换和空间的长期适应性上。E8(数字技术)是混合学习时代的基础设施。"
    key_tensions:
      - "教师控制 vs 学生自主——讲台的物理高度差暗示的权力关系(E1×E2)"
      - "技术赋能 vs 人际联结——屏幕越多，面对面互动是否越少(E8×E2)"
      - "灵活性 vs 声学分离——可移动隔断获得空间灵活性但牺牲隔音品质(E1×E8)"

  transportation_civic:
    elevated_topics: [E1, E2, E8]
    typical_depth: "L0-L2"
    guidance: "交通基础设施E1(流量容量)和E8(技术系统)是安全和效率的基础，但E2(等待者/行路者的身体体验)是提升公共空间品质的钥匙。分析以L0(硬指标)为起点，但值得推进到L2——'等待不焦虑、行走不迷路、转乘不受罪'是体验设计的突破口。"
    key_tensions:
      - "流通效率 vs 停留品质——更快的通过速度意味着更少的驻足体验(E1×E2)"
      - "安全冗余 vs 空间友好性——安检/栏杆/隔离带保障安全但创造压迫感(E8×E2)"
      - "当期建设 vs 未来扩展——预留容量的成本与不预留的改造代价(E1×E5×E9)"

  rural_regeneration_urban_renewal:
    elevated_topics: [E4, E5, E9]
    typical_depth: "L2-L4"
    guidance: "乡村振兴/城市更新项目E4(本地材料与建造记忆)、E5(时间的层叠——历史肌理与当代介入)和E9(谁受益、谁被排斥的经济正义)构成核心三角。这类项目必须达到L3-L4深度——'更新'的每一步都涉及'保留什么、改变什么、为谁而改'的价值判断，浅层的功能分析完全不够。"
    key_tensions:
      - "保护原真性 vs 现代宜居——原汁原味但漏雨渗水的老房子vs安全舒适但失去灵魂的翻新(E4×E8)"
      - "原住民利益 vs 外来投资——更新带来商业价值但可能挤走原始居民(E9×E5)"
      - "文化符号化 vs 活态传承——把传统变成景区符号vs让传统在当代生活中自然延续(E4×E5)"

  religious_spiritual:
    elevated_topics: [E1, E3, E4]
    typical_depth: "L3-L4"
    guidance: "宗教/精神空间项目E3(光的神性表达)和E1(空间体量的崇高感)是营造神圣氛围的核心手段。E4(材料的象征意义)在宗教语境中从'物质属性'跃升为'精神载体'。分析必须达到L3-L4——宗教建筑的每一个设计决策都承载价值判断和神学立场，浅层的功能分析完全无效。"
    key_tensions:
      - "传统形式 vs 当代表达——信众期待的'像教堂/寺庙'与建筑师对当代宗教空间的创造性诠释(E4×E1)"
      - "神圣静谧 vs 社区活力——礼拜的神圣感需要宁静，但宗教社区的活力需要日常喧闹(E1×E2)"
      - "开放包容 vs 传统规制——欢迎所有人vs遵循宗教仪式对空间朝向、分区的严格要求(E1×E9)"

  landscape_outdoor:
    elevated_topics: [E4, E5, E2]
    typical_depth: "L1-L3"
    guidance: "景观/户外项目E4(植物与自然材料)和E5(四季变化的时间维度)构成核心——景观是'活的设计'，随时间生长变化是其本质属性。E2(身体的多感官沉浸)在户外环境中达到最高丰富度。分析需超越L1(功能配置)推进到L2-L3——好的景观设计是'种出来的故事'而非'摆出来的布景'。"
    key_tensions:
      - "生态本真 vs 人工美学——自然演替的'野'与人们期待的'整洁'之间的审美冲突(E4×E2)"
      - "当下效果 vs 长期演变——甲方验收日的效果vs五年后的景观成熟状态，设计为谁而做(E5×E9)"
      - "高维护精致 vs 低维护可持续——日式枯山水的极致维护vs草甸花园的低干预美学(E4×E9)"

  commercial_retail:
    elevated_topics: [E1, E3, E9]
    typical_depth: "L1-L3"
    guidance: "零售/品牌体验项目E9(坪效经济学)和E1(顾客动线编排)是商业硬约束，E3(灯光的销售力)是体验差异化的核心。分析需在L1(效率指标)和L3(品牌叙事)之间建立桥梁——优秀零售空间是'让人愿意多待一会儿'与'每平米创收'的精密平衡。"
    key_tensions:
      - "体验面积 vs 陈列面积——体验区吸引停留但不直接产生销售，陈列更多但可能让人'逛不动'(E1×E9)"
      - "品牌一致性 vs 在地化——旗舰店的全球标准形象与本地消费文化的适配(E3×E4)"
      - "线上替代 vs 线下独特价值——当一切都能网购时，实体店靠什么让人'非来不可'(E2×E8)"