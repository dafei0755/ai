feeling_core:
  record_id: FEELING-XQJ-QPLCJ-001
  source_ref: SRC-LIT-辛弃疾-清平乐村居-001
  core_feelings:
    - id: F1
      label: 共享场景中的不互相打扰
      description: >
        同一家庭成员处于同一场域中，但每个人都做自己的事，既共处又不被迫互动。
    - id: F2
      label: 低压、松弛、非戏剧化的幸福
      description: >
        幸福并非来自高潮式叙事，而来自日常中自然生成的满足与轻微的温情。
    - id: F3
      label: 生活感强于观赏感
      description: >
        核心不是“给人看”，而是“人真的在这里生活、劳作、停留、陪伴”。
    - id: F4
      label: 代际共处但关系温和
      description: >
        老人、成年子女、孩子同时存在，但没有命令式秩序，是柔和的家庭连续性。
    - id: F5
      label: 人与自然的贴附关系
      description: >
        溪、草、莲蓬不是景观道具，而是生活本身的一部分。
  compressed_judgement: >
    这首词的真正价值不在“田园风格”，而在“低压共处的生活秩序”。

