  author: 辛弃疾
  dynasty: 南宋
  source_domain: literature
  source_time_context: 南宋乡居日常语境
  original_text: |
    茅檐低小，溪上青青草。
    醉里吴音相媚好，白发谁家翁媪?
    大儿锄豆溪东，中儿正织鸡笼。
    最喜小儿无赖，溪头卧剥莲蓬。
  source_context:
    - 乡居日常
    - 家庭共处
    - 非表演性幸福
