space_state_propositions:
  - proposition_id: PROP-QPLCJ-A1
    level: A
    serves_axis:
      - mainline
    statement: >
      在公共共享空间中，不同成员应能在彼此可感知的同一场域内各做各的事，
      同时不被迫互动，从而形成低压、自然的共处感。
    why_it_matters: >
      这是这首词最核心的空间经验，不成立则“村居式松弛感”不成立。
    applicable_space_types:
      - 乡村民宿
      - 家庭度假型民宿
      - 康养社区公共客厅
      - 社区型茶空间
    not_applicable_when:
      - 高流转高翻台商业餐饮
      - 强事件型发布空间
    validation_hint:
      - 是否存在多个可独立停留的小节点
      - 是否允许“同场不同事”
      - 是否不会因为动线或座位组织强迫互动
    freeze_ceiling: A
    review_status: pending

  - proposition_id: PROP-QPLCJ-A2
    level: A
    serves_axis:
      - mainline
    statement: >
      空间应优先支持生活性行为与轻日常活动，而不是把公共区域做成以观看和打卡为主的展示场。
    why_it_matters: >
      词中的幸福来自生活展开，而不是视觉奇观。
    applicable_space_types:
      - 民宿
      - 乡村社区公共空间
      - 生活方式会所
    validation_hint:
      - 是否有支持轻劳动、轻停留、轻陪伴的行为容器
      - 是否避免空间只剩拍照和观看功能
    freeze_ceiling: A
    review_status: pending

  - proposition_id: PROP-QPLCJ-B1
    level: B
    serves_axis:
      - implementation_boundary
    statement: >
      公共空间的声环境应允许低声交流和轻微生活声存在，
      但不应让任何一个停留节点被整体噪声吞没。
    why_it_matters: >
      这首词不是绝对寂静，而是“有生活声但不烦扰”。
    validation_hint:
      - 是否允许生活性背景声
      - 是否避免高混响和全场噪声扩散
    freeze_ceiling: B
    review_status: pending

  - proposition_id: PROP-QPLCJ-B2
    level: B
    serves_axis:
      - implementation_boundary
      - mainline
    statement: >
      空间尺度与构件表达应保持低姿态、低压感和贴地性，
      避免为了“乡居感”而做成刻意表演的田园布景。
    why_it_matters: >
      “茅檐低小”不是风格标签，而是低姿态的生活容器。
    risk_flags:
      - over_symbolization
      - rural_stylization
    freeze_ceiling: B
    review_status: pending

  - proposition_id: PROP-QPLCJ-B3
    level: B
    serves_axis:
      - driver_axis
    statement: >
      若用户表达“向往诗意乡居”，更可能真正向往的是低压共处、生活连续性与自然贴附感，
      而不只是乡土材料或田园景观符号。
    why_it_matters: >
      这条命题可以纠正甲方表述和真实驱动力之间的错位。
    freeze_ceiling: B
    review_status: pending

  - proposition_id: PROP-QPLCJ-C1
    level: C
    serves_axis:
      - review_hint
    statement: >
      停留位置之间最好给人一种“自然长出来”的感觉，
      而不是被设计师强行排布出来。
    why_it_matters: >
      有助于保留这首词的自然生成感，但不宜直接作为硬性条目。
    freeze_ceiling: C
    review_status: pending

  - proposition_id: PROP-QPLCJ-C2
    level: C
    serves_axis:
      - review_hint
    statement: >
      儿童活动感最好以松散、自发、微顽皮的方式出现，
      而不是被过度教育化或过度策划化。
    why_it_matters: >
      用于保留词中“无赖”带来的生动性，但不构成硬约束。
    freeze_ceiling: C
    review_status: pending

binding_to_one_main_two_aux:
  mainline_statement: >
    以“同场而不互扰、生活展开而不表演”的低压共处感作为核心空间体验。
  driver_statement: >
    “乡居向往”常常不是风格偏好，而是对低压生活秩序、关系轻松与自然贴附感的向往。
  boundary_statement: >
    禁止把“村居感”误译为“乡土符号堆砌”“田园表演化”或“高密互动型热闹组织”。
  review_tips:
    - 方向对，但若空间过于整齐和用力，容易损伤自然生成感
    - 若强调乡土材料而忽视关系组织，会落入表皮化误译
    - 若把松弛理解成散乱，会削弱真正的低压秩序

