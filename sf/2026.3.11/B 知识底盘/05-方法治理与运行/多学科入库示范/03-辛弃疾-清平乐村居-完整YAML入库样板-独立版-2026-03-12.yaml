ingest_decision:
  bundle_verdict: accepted_as_multilayer_bundle
  accepted_objects:
    - source_archive_entry
    - semantic_segmentation_record
    - experience_hypothesis_set
    - normalized_ir_record
    - project_projection_template
  rejected_direct_usages:
    - poem_as_style_label
    - poem_as_direct_taskbook_copy
    - poem_as_visual_theme_only
  review_reason: >
    该文本具有清晰而稳定的生活秩序、关系氛围与价值姿态，
    适合入库为高质量文学型来源；但其作用主要在于改写主命题与体验倾向，
    不能被粗暴简化成“乡村风格”或“古诗意境”。

project_projection_templates:
  - template_id: proj_rural_homestay_001
    suitable_for:
      - rural_homestay
      - waterfront_homestay
      - family_retreat_stay
    mainline_statement: >
      以低压共处、生活展开、自然贴附的乡居日常作为核心体验，
      而不是以景观消费和风格表演作为主要内容。
    spatial_translation:
      arrival:
        - 小尺度过渡而非高势入口
        - 进入即见柔软生活线索，而非直接视觉爆点
      public_space:
        - 共享但可分散的家庭尺度客厅
        - 可同时容纳聊天、发呆、做小事的并行结构
      edge_space:
        - 靠溪、靠草、靠院边的微停留位
        - 可坐、可蹲、可倚、可卧的非正式停留姿态
      material_and_light:
        - 低饱和自然色
        - 触感友好而非造型先行
        - 夜间暖而不艳的平缓照明
    danger_points:
      - 乡村审美表皮化
      - 低檐空间压迫化
      - “生活感”被民俗道具替代
    freeze_recommendation:
      level: B_plus
      note: >
        可冻结为主命题方向和禁忌原则，但不应直接冻结为具体形式风格。

  - template_id: proj_community_tea_space_001
    suitable_for:
      - tea_space
      - small_community_culture_space
      - slow_social_space
    mainline_statement: >
      以低压力并行共处为主，而不是以强主题社交和仪式性展示为主。
    spatial_translation:
      - 多组分散式停留
      - 同场不同事
      - 声音可轻度流动但不形成噪声中心
    danger_points:
      - 过于居家导致运营弱
      - 社交组织过松散导致场所失焦
    freeze_recommendation:
      level: B

review_checklist:
  required_questions:
    - 这次转译有没有把文本简化成“乡村风”？
    - 有没有把生活秩序误译成民俗装饰？
    - 主命题是否真的从“看”转向“住”和“共处”？
    - 是否保留了并行活动和低压关系，而不是单一公共中心？
    - 是否把最打动人的“卧剥莲蓬”翻成了身体松弛，而不是仅仅翻成儿童趣味？
  pass_conditions:
    - source_traceable
    - no_style_label_abuse
    - mainline_statement_present
    - taboo_principles_present
    - at_least_one_project_template_present
  fail_conditions:
    - 直接输出“新中式乡村风”
    - 只讨论景观和材料，不讨论关系与生活秩序
    - 没有禁忌项

lifecycle:
  current_stage: structured_candidate
  next_stage: review_pending
  release_strategy:
    - 用于 2 到 3 个乡居民宿或慢社交项目试跑
    - 重点回看复购感、生活感、家庭共处舒适度评价
    - 若连续项目中被误译为民俗布景，则降级并补强禁忌项
